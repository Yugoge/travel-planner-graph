  // 3-part key (the old 2-part key a:b silently missed). After the route resolves OK,
  // persist a route_ref into the day-file so membership + budget survive reload (M5).
  // saveMutations + the live day number are read through refs (set by effects below) to
  // avoid a TDZ on the later const declarations and keep fetchRoute dependency-stable.
  const ROUTE_MODE = 'car';
  const routePairKey = useCallback((a, b) => a + ':' + b + ':' + ROUTE_MODE, []);
  const saveMutationsRef = React.useRef(null);
  const currentDayNumRef = React.useRef(null);
  const fetchRoute = useCallback((fromOptionId, toOptionId, pairKey) => {
    if (!TRIP_ID || !fromOptionId || !toOptionId) return;
    const key = pairKey || (fromOptionId + ':' + toOptionId + ':' + ROUTE_MODE);
    routeSeqRef.current[key] = (routeSeqRef.current[key] || 0) + 1;
    const seq = routeSeqRef.current[key];
    fetch('/api/route', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ trip_id: TRIP_ID, from_option_id: fromOptionId, to_option_id: toOptionId, mode: ROUTE_MODE, request_seq: seq }),
    })
      .then(r => r.json())
      .then(data => {
        if (routeSeqRef.current[key] !== seq) return; // stale
        // Response status {ok,unknown,error}: render uses it directly; persist maps
        // unknown->unresolved (day enum has no 'unknown'). Persist a day route_ref only
        // when the route resolves OK so a known cost can join the budget.
        const seg = (data && data.segment) || {};
        setRouteCache(prev => ({ ...prev, [key]: data }));
        if (data && data.status === 'ok' && saveMutationsRef.current && currentDayNumRef.current) {
          saveMutationsRef.current(currentDayNumRef.current, [{ type: 'route_ref', extra: {
            from_option_id: fromOptionId, to_option_id: toOptionId, mode: ROUTE_MODE,
            status: 'ok',
            duration_min: seg.duration_min, distance_km: seg.distance_km, cost: seg.cost,
          } }]);
        }
      })
      .catch(() => { setRouteCache(prev => ({ ...prev, [key]: { status: 'error' } })); });
  }, []);

  // saveMutations: central save helper (M5, M6, M7, M11)
  const saveMutations = useCallback(async (dayNum, mutations) => {
    // task 20260615-125613: Preview is read-only — never mutate from a non-edit mode. Edit
    // affordances are hidden in Preview, but this guard makes the contract enforceable.
    if (mode === 'preview') return;
    if (isOffline) {
      setSaveState('error');
      setSaveStatusText('offline — not saved');
      lastSaveOkRef.current = false;
      return;
    }
    // codex finding 2: track this save synchronously so completeEdit's flush awaits it.
    inFlightSavesRef.current += 1;
    lastSaveOkRef.current = true; // optimistic; flipped to false on any error/conflict branch below
    setSaveState('saving');
    setSaveStatusText('saving…');
    const seq = ++saveSeqRef.current;
    try {
      const resp = await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          trip_id: TRIP_ID,
          day: dayNum,
          editor_session: editorSession,
          // M5: the loaded-baseline version so the server flags a conflict ONLY on real divergence.
          client_base_seq: loadedBaseSeqRef.current,
          client_base_ts: loadedBaseTsRef.current,
          mutations,
        }),
      });
      if (saveSeqRef.current !== seq) return; // stale
      if (resp.status === 409) {
        setConflictDetected(true);
        setSaveState('error');
        setSaveStatusText('conflict');
        lastSaveOkRef.current = false;
        return;
      }
      const data = await resp.json();
      if (saveSeqRef.current !== seq) return; // stale after json parse
      // BUG B fix (no snap-back): a SOFT 409 (last-writer-wins) means the server STILL PERSISTED
      // this save (handle_save proceeds; the conflict flag is advisory). Surface the banner, but
      // do NOT early-return before the local-mirror block below — otherwise the just-applied edit
      // (e.g. a flight-meal retime) is never mirrored into editorTripData and the card visually
      // SNAPS BACK to its old position even though disk holds the new value. We flag the conflict,
      // skip the optimistic "saved" label, and fall through so the APPLIED mutations still mirror.
      const _conflictSoft = data.conflict === '409-soft';
      if (_conflictSoft) {
        setConflictDetected(true);
      }
      if (!resp.ok) {
        setSaveState('error');
        setSaveStatusText('error');
        lastSaveOkRef.current = false;
        return;
      }
      // M5: advance the conflict baseline to the version this save just wrote (the server bumped
      // meta.save_seq and set last_saved_ts = saved_ts), so the NEXT save carries the current
      // baseline and does not spuriously re-flag. On a genuine soft-409 the banner already fired this
      // round; adopting the new version means a subsequent single-user save (no further concurrent
      // edit) stays clean.
      if (typeof data.save_seq === 'number') loadedBaseSeqRef.current = data.save_seq;
      if (data.saved_ts) loadedBaseTsRef.current = data.saved_ts;
      // Cycle 4 (R11/#4): a v2->meals.json writeback failure means the save did NOT persist
      // (the server wrote nothing). Surface it as an error so the UI does not claim "saved".
      if (data.writeback && data.writeback.status === 'failed') {
        setSaveState('error');
        setSaveStatusText('save failed');
        lastSaveOkRef.current = false;
        return;
      }
      // AC5/AC7/AC11 (rejection-path fix): an HTTP-200 save can carry a PARTIAL failure — a
      // per-mutation result whose status is not 'applied' (e.g. a server-rejected out-of-bounds
      // time). The client MUST consult data.mutation_results and (a) NOT claim 'saved' when any
      // requested mutation was rejected, and (b) only mirror/prune locally for the mutations the
      // server actually APPLIED. Mirroring a rejected time would show an invalid value as saved
      // and prune a valid routeCache cost — the exact two QA-reproduced edge bugs.
      const _results = Array.isArray(data.mutation_results) ? data.mutation_results : [];
      const _appliedIdx = new Set(
        _results.filter(r => r && r.status === 'applied').map(r => r.index)
      );
      const _rejected = _results.filter(r => r && r.status === 'error');
      const _reqCount = (mutations || []).length;
      // FAIL-CLOSED (housekeeping #2): a mutation is applied IFF its own index has an 'applied'
      // result row — full stop. The current server appends exactly one result per mutation in
      // every loop branch, so len(results)===_reqCount for any real batch and this is purely a
      // defensive backstop. But if a FUTURE server regression ever returned HTTP-200 with an
      // empty/truncated mutation_results for a non-empty batch, the old code FAIL-OPENED here
      // (treated all indices as applied, claimed 'saved', and mirrored an unconfirmed value).
      // We now treat an unexpectedly-short/empty result list as "not applied": no per-mutation
      // 'applied' row means not applied, so the UI does NOT claim saved and does NOT mirror/prune.
      const _isApplied = (idx) => _appliedIdx.has(idx);
      // Not fully applied = any requested mutation index lacks an 'applied' result row. An empty
      // or truncated result list for a non-empty batch therefore reads as not-fully-applied.
      const _notFullyApplied = _reqCount > 0 &&
        Array.from({ length: _reqCount }, (_, i) => i).some(i => !_appliedIdx.has(i));
      const ts = Date.now();
      if (_rejected.length || _notFullyApplied) {
        // Partial failure: keep the prior valid state for the non-applied mutation, do NOT show
        // 'saved'. Surface visible inline feedback (the save-status banner turns red).
        setSaveState('error');
        // delete_option (task 20260616): surface the server's user-facing reason for a rejected
        // delete (e.g. "cannot delete the currently-selected option …") rather than a generic line.
        const _rejDel = _rejected.find(r => r && r.type === 'delete_option');
        setSaveStatusText(_rejected[0] && _rejected[0].type === 'time'
          ? 'time rejected — out of bounds'
          : (_rejDel
              ? (_rejDel.detail && _rejDel.detail[0] ? String(_rejDel.detail[0]) : 'cannot delete the selected option')
              : (_rejected.length ? 'some changes were rejected' : 'some changes were not saved')));
        lastSaveOkRef.current = false;
      } else if (_conflictSoft) {
        // BUG B: the save PERSISTED but a genuine concurrent editor also touched the plan. Show
        // the conflict status (not 'saved') yet still mirror the APPLIED mutations below so the
        // user's own edit does not snap back — the banner already warns them to reload.
        setSaveState('error');
        setSaveStatusText('conflict');
        lastSaveOkRef.current = false;
      } else {
        setSaveState('saved');
        setLastSaveTs(ts);
        setSaveStatusText('saved');
      }
      // Cycle 4 (R5/R6/#1): mirror role-aware MEAL select mutations into editorTripData so the
      // board (which renders from editorDay.slots[].options[].included) updates WITHOUT a reload.
      // Only mirror the ones the server APPLIED (AC5 rejection-path).
      const _mealMuts = (mutations || []).filter((m, i) => m.type === 'select'
        && ['breakfast', 'lunch', 'dinner'].includes(m.slot) && _isApplied(i));
      if (_mealMuts.length) {
        setEditorTripData(prev => {
          if (!prev || !prev.days) return prev;
          const updated = JSON.parse(JSON.stringify(prev));
          const dayEntry = updated.days.find(d => Number(d.day) === Number(dayNum));
          if (!dayEntry || !dayEntry.slots) return prev;

          outline: 2px solid rgba(224,124,90,0.85) !important;
          outline-offset: -2px !important;
        }
        [data-slot-card="primary"][data-drop-success],
        [data-timeline-entry][data-drop-success] {
          animation: slot-drop-success-flash 0.6s ease-out !important;
        }
        @keyframes slot-drop-reject-flash {
          0% { background: rgba(224,124,90,0.5); }
          100% { background: rgba(224,124,90,0); }
        }
        @keyframes slot-drop-success-flash {
          0% { box-shadow: 0 0 0 4px rgba(69,178,107,0.75); }
          100% { box-shadow: 0 0 0 0 rgba(69,178,107,0); }
        }
      `}</style>
      <Sidebar
        trips={PLAN_DATA.trips} selTrip={selTrip} selDay={selDay}
        onSelect={(ti, di) => {
          setSelTrip(ti); setSelDay(di);
          // Budget recompute on day switch (M25)
          const newDay = PLAN_DATA.trips[ti] && PLAN_DATA.trips[ti].days && PLAN_DATA.trips[ti].days[di];
          if (newDay) recomputeBudget(newDay.day);
        }}
        isOpen={sbOpen} onClose={() => setSbOpen(false)} bp={bp}
        lang={lang}
      />

      <div style={{ flex: 1, minWidth: 0, marginRight: isMobileLayout ? 0 : '300px', minHeight: 0, overflowY: 'auto', height: '100dvh' }}>
        <div style={{
          borderBottom: '1px solid #f0efed',
          padding: `0 ${sm ? '12px' : '20px'}`,
          display: 'flex', alignItems: 'center', flexWrap: 'wrap',
          position: 'sticky', top: 0, background: 'rgba(255,255,255,0.97)',
          backdropFilter: 'blur(8px)', zIndex: 50, gap: '2px'
        }}>
          {sm && (
            <button onClick={() => setSbOpen(true)} style={{
              background: 'none', border: 'none', cursor: 'pointer',
              fontSize: '17px', padding: '10px 6px 10px 2px', color: '#37352f'
            }}>☰</button>
          )}
          {(isMobileLayout ? ['kanban', 'timeline', 'candidates'] : ['kanban', 'timeline']).map(m => (
            <button key={m} onClick={() => { if (isMobileLayout) setMobileTab(m); else setView(m); }} style={{
              padding: sm ? '10px 8px' : '11px 16px', background: 'none', border: 'none',
              borderBottom: (isMobileLayout ? mobileTab : view) === m ? '2px solid #37352f' : '2px solid transparent',
              fontSize: '14px', fontWeight: (isMobileLayout ? mobileTab : view) === m ? '600' : '400',
              color: (isMobileLayout ? mobileTab : view) === m ? '#37352f' : '#6b6b6b',
              cursor: 'pointer', transition: 'all .12s', whiteSpace: 'nowrap'
            }}>
              {m === 'kanban' ? L('kanban_view', lang) : m === 'timeline' ? L('timeline_view', lang) : 'Candidates'}
            </button>
          ))}
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: sm ? '6px' : '12px', ...(sm ? { width: '100%', justifyContent: 'flex-end', paddingBottom: '6px' } : {}) }}>
            {/* task 20260615-125613 (R3/R4): Preview<->Edit mode toggle. Only meaningful in the
                in-app editor (TRIP_ID set); the standalone static export has no server to save to. */}
            {(typeof TRIP_ID !== 'undefined' && TRIP_ID) && (
              mode === 'preview' ? (
                <button
                  data-mode-enter-edit=""
                  onClick={enterEdit}
                  style={{
                    padding: sm ? '8px 12px' : '9px 16px', background: '#37352f',
                    color: '#ffffff', border: '1px solid #37352f', borderRadius: '6px',
                    fontSize: '13px', fontWeight: '600', cursor: 'pointer', whiteSpace: 'nowrap'
                  }}
                >{lang === 'local' ? '编辑' : 'Edit'}</button>
              ) : (
                <button
                  data-mode-done=""
                  onClick={completeEdit}
                  disabled={completingEdit}
                  style={{
                    padding: sm ? '8px 12px' : '9px 16px',
                    background: completingEdit ? '#9b9a96' : '#45b26b',
                    color: '#ffffff', border: `1px solid ${completingEdit ? '#9b9a96' : '#45b26b'}`,
                    borderRadius: '6px', fontSize: '13px', fontWeight: '600',
                    cursor: completingEdit ? 'wait' : 'pointer', whiteSpace: 'nowrap'
                  }}
                >{completingEdit ? (lang === 'local' ? '保存中…' : 'Saving…') : (lang === 'local' ? '完成' : 'Done')}</button>
              )
            )}
            {/* Map provider toggle */}
            <div style={{ display: 'flex', gap: '2px', background: '#f5f5f3', borderRadius: '6px', padding: '2px', border: '1px solid #e0e0e0' }}>
              <button onClick={() => setMapProvider('gaode')} style={{
                padding: sm ? '5px 6px' : '6px 10px',
                background: mapProvider === 'gaode' ? '#e6f3ff' : 'transparent',
                border: mapProvider === 'gaode' ? '1px solid #0085fe' : '1px solid transparent',
                borderRadius: '4px',
                fontSize: '12px', fontWeight: mapProvider === 'gaode' ? '600' : '400',
                color: mapProvider === 'gaode' ? '#0085fe' : '#6b6b6b',
                cursor: 'pointer', transition: 'all .12s',
                display: 'flex', alignItems: 'center', gap: '3px'
              }}>
                <GaodeLogo size={12} />
                {sm ? '高德' : '高德地图'}
              </button>
              <button onClick={() => setMapProvider('google')} style={{
                padding: sm ? '5px 6px' : '6px 10px',
                background: mapProvider === 'google' ? '#e8f0fe' : 'transparent',
                border: mapProvider === 'google' ? '1px solid #4285F4' : '1px solid transparent',
                borderRadius: '4px',
                fontSize: '12px', fontWeight: mapProvider === 'google' ? '600' : '400',
                color: mapProvider === 'google' ? '#4285F4' : '#6b6b6b',
                cursor: 'pointer', transition: 'all .12s',
                display: 'flex', alignItems: 'center', gap: '3px'
              }}>
                <GoogleMapsLogo size={12} />
                Google
              </button>
            </div>
            {/* Language toggle */}
            <div style={{ display: 'flex', gap: '4px' }}>
              <button onClick={() => setLang('local')} style={{
                padding: sm ? '8px 10px' : '9px 14px',
                background: lang === 'local' ? '#e9f5ec' : '#f5f5f3',
                border: `1px solid ${lang === 'local' ? '#45b26b' : '#e0e0e0'}`,
                borderRadius: '6px',
                fontSize: '13px', fontWeight: lang === 'local' ? '600' : '400',
                color: lang === 'local' ? '#176d2c' : '#6b6b6b',
                cursor: 'pointer', transition: 'all .12s'
              }}>
                {PLAN_DATA.trip_summary.local_display || 'Local'}
              </button>
              <button onClick={() => setLang('base')} style={{
                padding: sm ? '8px 10px' : '9px 14px',
                background: lang === 'base' ? '#e9f5ec' : '#f5f5f3',
                border: `1px solid ${lang === 'base' ? '#45b26b' : '#e0e0e0'}`,
                borderRadius: '6px',
                fontSize: '13px', fontWeight: lang === 'base' ? '600' : '400',
                color: lang === 'base' ? '#176d2c' : '#6b6b6b',
                cursor: 'pointer', transition: 'all .12s'
              }}>
                {PLAN_DATA.trip_summary.base_display || 'EN'}
              </button>
            </div>
            {/* Save status badge (M5, M27) */}
            <span style={{
              fontSize: '11px', padding: '3px 7px', borderRadius: '4px',
              background: saveState === 'saving' ? '#fff3cd' : saveState === 'saved' ? '#d4edda' : saveState === 'error' ? '#f8d7da' : '#f5f5f3',
              color: saveState === 'saving' ? '#856404' : saveState === 'saved' ? '#155724' : saveState === 'error' ? '#721c24' : '#9b9a97',
              border: '1px solid transparent', whiteSpace: 'nowrap'
            }}>
              {saveStatusText || (saveState === 'idle' ? '' : saveState)}
            </span>
            {/* Conn-status badge (M28) */}
            <span className="conn-status" data-state={isOffline ? 'offline' : 'online'} style={{
              fontSize: '11px', padding: '3px 7px', borderRadius: '4px',
              background: isOffline ? '#f8d7da' : '#d4edda',
              color: isOffline ? '#721c24' : '#155724',
              border: '1px solid transparent', whiteSpace: 'nowrap'
            }}>
              {isOffline ? 'offline' : 'online'}
            </span>
            {/* Export buttons (M26) */}
            {TRIP_ID && (() => {
              const REQUIRED_SLOT_KEYS_CHECK = ['accommodation', 'breakfast', 'lunch', 'dinner'];
              const _anyValidationError = () => {
                if (!editorTripData || !editorTripData.days) return true;
                return editorTripData.days.some(edDay => {
                  return REQUIRED_SLOT_KEYS_CHECK.some(slotId => {
                    // accommodation is top-level; named meal slots are under .slots
                    const slot = slotId === 'accommodation' ? edDay.accommodation : (edDay.slots && edDay.slots[slotId]);
                    if (!slot) return true; // missing slot = validation error
                    if (slot.skipped) return false;
                    const key = edDay.day + ':' + slotId;
                    const resolved = Object.prototype.hasOwnProperty.call(editorSelections, key) ? editorSelections[key] : slot.selected_option_id;
                    return !resolved;
                  });
                });
              };
              const exportDisabled = isOffline || _anyValidationError();
              const handleExport = async (kind) => {
                if (exportDisabled) return;
                try {
                  const resp = await fetch('/api/export/' + kind, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trip_id: TRIP_ID }),
                  });
                  const data = await resp.json();
                  if (data.file_path) {
                    setSaveStatusText(data.file_path);
                  } else {
                    setSaveStatusText('export ' + kind + ' failed');
                    setSaveState('error');
                  }
                } catch (_) {
                  setSaveStatusText('export ' + kind + ' failed');
                  setSaveState('error');
                }
              };
              return (<>
                <button onClick={() => handleExport('pdf')} disabled={exportDisabled} style={{
                  fontSize: '11px', padding: '4px 8px', borderRadius: '4px',
                  background: exportDisabled ? '#f5f5f3' : '#edf2fc', color: exportDisabled ? '#c4c4c0' : '#2b63b5',
                  border: '1px solid ' + (exportDisabled ? '#e0e0e0' : '#b4caf0'), cursor: exportDisabled ? 'default' : 'pointer'
                }}>PDF</button>
                <button onClick={() => handleExport('ical')} disabled={exportDisabled} style={{
                  fontSize: '11px', padding: '4px 8px', borderRadius: '4px',
                  background: exportDisabled ? '#f5f5f3' : '#edf2fc', color: exportDisabled ? '#c4c4c0' : '#2b63b5',
                  border: '1px solid ' + (exportDisabled ? '#e0e0e0' : '#b4caf0'), cursor: exportDisabled ? 'default' : 'pointer'
                }}>iCal</button>
              </>);
            })()}
          </div>
        </div>
        {/* OfflineBanner (M6) */}
        {isOffline && (
          <div style={{ background: '#f8d7da', color: '#721c24', padding: '8px 20px', fontSize: '13px', fontWeight: '500' }}>
            You are offline. Changes will not be saved until you reconnect.
          </div>
        )}
        {/* ConflictBanner (M7, M29) */}
        {conflictDetected && (
          <div style={{ background: '#fff3cd', color: '#856404', padding: '8px 20px', fontSize: '13px', fontWeight: '500', display: 'flex', alignItems: 'center', gap: '12px' }}>
            <span>Another session modified this plan. Reload to see the latest version.</span>
            <button onClick={() => window.location.reload()} style={{ fontSize: '12px', padding: '3px 10px', borderRadius: '4px', background: '#856404', color: '#fff', border: 'none', cursor: 'pointer' }}>Reload</button>
            <button onClick={() => setConflictDetected(false)} style={{ fontSize: '12px', padding: '3px 10px', borderRadius: '4px', background: 'transparent', color: '#856404', border: '1px solid #856404', cursor: 'pointer' }}>Dismiss</button>
          </div>
        )}

        {/* Approve Day button (M8, M24) */}
        {TRIP_ID && day && editorDay && (() => {
          const REQUIRED_SLOT_KEYS_BTN = ['accommodation', 'breakfast', 'lunch', 'dinner'];
          // AC24: use editorDay (v2 slot-envelope) not effectiveDay (PLAN_DATA shape)
          const getEdSlot = (slotId) =>
            slotId === 'accommodation' ? editorDay.accommodation : (editorDay.slots && editorDay.slots[slotId]);
          const allFilled = REQUIRED_SLOT_KEYS_BTN.every(slotId => {
            const slot = getEdSlot(slotId);
            if (!slot) return false; // missing slot = not filled
            if (slot.skipped) return true;
            const key = day.day + ':' + slotId;
            const resolved = Object.prototype.hasOwnProperty.call(editorSelections, key) ? editorSelections[key] : slot.selected_option_id;
            return !!resolved;
          });
          const isApproved = editorDay && editorDay.stage === 'user-selected';
          const canApprove = allFilled && editorDay && (editorDay.stage === 'draft-options' || editorDay.stage === 'user-review');
          const approveDisabled = isApproved || !canApprove;
          return (
            <div style={{ padding: '6px 20px', borderBottom: '1px solid #f0efed', display: 'flex', alignItems: 'center', gap: '8px' }}>
              <button
                disabled={approveDisabled}
                onClick={() => {
                  if (approveDisabled) return;
                  const dayNum = day.day;
                  saveMutations(dayNum, [{ type: 'stage', from_stage: editorDay.stage, to_stage: 'user-selected' }]);
                }}
                style={{
                  fontSize: '12px', padding: '5px 14px', borderRadius: '5px', fontWeight: '600',
                  background: isApproved ? '#e9f5ec' : approveDisabled ? '#f5f5f3' : '#45b26b',
                  color: isApproved ? '#1a7a32' : approveDisabled ? '#c4c4c0' : '#fff',
                  border: '1px solid ' + (isApproved ? '#a2d9b1' : approveDisabled ? '#e0e0e0' : '#3a9a5c'),
                  cursor: approveDisabled ? 'default' : 'pointer', transition: 'all .12s'
                }}
              >
                {isApproved ? 'Approved' : 'Approve Day'}
              </button>
            </div>
          );
        })()}
        {/* Cycle-2: Mobile bottom-sheet for candidates (replaces full-screen tab) */}
        {isMobileLayout && day && (
          <MobileBottomSheet isDragging={false} expanded={mobileTab === 'candidates'}>
            {/* task 20260615-125613 (codex finding 1): ingest is an edit affordance — hidden in
                Preview so a read-only Preview cannot persist a candidate via /api/ingest/commit. */}
            {TRIP_ID && mode === 'edit' && (
              <div data-ingest-mobile="" style={{ padding: '8px 12px', borderBottom: '1px solid #f0efed', background: '#fff' }}>
                {!ingestOpen ? (
                  <button data-ingest-open="" onClick={() => setIngestOpen(true)} style={{ width: '100%', padding: '10px', background: '#37352f', color: '#fff', border: 'none', borderRadius: '6px', cursor: 'pointer', fontSize: '14px', fontWeight: 600 }}>
                    + {lang === 'local' ? '从链接添加备选' : 'Add candidate from link'}
                  </button>
                ) : (
                  <IngestPanel
                    tripId={TRIP_ID}
                    dayNum={publishedDay && publishedDay.day}
                    editorSession={editorSession}
                    lang={lang}
                    onAdded={refetchTripData}
                    onClose={() => setIngestOpen(false)}
                  />
                )}
              </div>
            )}
            <CandidatesSidebar
              editorTripData={editorTripData}
              publishedDay={publishedDay}
              lang={lang}
              mapProvider={mapProvider}
              editorSelections={editorSelections}
              saveMutations={saveMutations}
              setEditorSelections={setEditorSelections}
              editorDay={editorDay}
              pendingSelection={pendingSelection}
              setPendingSelection={setPendingSelection}
              setEditorTripData={setEditorTripData}
              undoRecord={undoRecord}
              inlineMode={true}
            />
          </MobileBottomSheet>
        )}
        {day ? (() => {
          const activeView = isMobileLayout ? mobileTab : view;
          if (isMobileLayout && activeView === 'candidates') {
            return null; // now handled by MobileBottomSheet above
          }
          return activeView === 'kanban'
            ? <KanbanView
                day={day}
                publishedDay={publishedDay}
                tripSummary={PLAN_DATA.trip_summary}
                showSummary={selDay === 0 && selTrip === 0}
                bp={bp}
                lang={lang}
                mapProvider={mapProvider}
                onItemClick={handleItemClick}
                onBudgetClick={handleBudgetClick}
                editorDay={editorDay}
                editorSelections={editorSelections}
                saveMutations={saveMutations}
                setEditorSelections={setEditorSelections}
                pendingSelection={pendingSelection}
                setPendingSelection={setPendingSelection}
                setEditorTripData={setEditorTripData}
                editorTripData={editorTripData}
                liveDayTotal={liveDayTotal}
                routeCache={routeCache}
                fetchRoute={fetchRoute}
              />
            : <TimelineView
                day={day}
                bp={bp}
                lang={lang}
                mapProvider={mapProvider}
                onItemClick={handleItemClick}
                editorDay={editorDay}
                editorSelections={editorSelections}
                pendingSelection={pendingSelection}
                setPendingSelection={setPendingSelection}
                saveMutations={saveMutations}
                setEditorSelections={setEditorSelections}
                setEditorTripData={setEditorTripData}
                routeCache={routeCache}
                fetchRoute={fetchRoute}
              />;
        })() : (
          <div style={{ padding: `60px ${sm ? '16px' : '48px'}`, color: '#c4c4c0' }}>
            <div style={{ fontSize: '48px', marginBottom: '12px' }}>🗺️</div>
            <div style={{ fontWeight: '500', fontSize: '16px', color: '#9b9a97' }}>{trip?.name}</div>
            <div style={{ marginTop: '4px' }}>{L('coming_soon', lang)}</div>
          </div>
        )}

        {selectedItem && (
          <ItemDetailSidebar
            item={selectedItem.item}
            type={selectedItem.type}
            onClose={() => setSelectedItem(null)}
            bp={bp}
            lang={lang}
            mapProvider={mapProvider}
          />
        )}

        {selectedBudgetCat && (
          <BudgetDetailSidebar
            category={selectedBudgetCat.category}
            items={selectedBudgetCat.items}
            total={selectedBudgetCat.total}
            onClose={() => setSelectedBudgetCat(null)}
            bp={bp}
            lang={lang}
          />
        )}
      </div>

      {!isMobileLayout && (
        <div style={{ position: 'fixed', top: 0, right: 0, width: '300px', height: '100dvh', display: 'flex', flexDirection: 'column' }}>
          {/* task 20260615-125613 (codex finding 1): ingest hidden in Preview (edit affordance). */}
          {TRIP_ID && mode === 'edit' && (
            <div style={{ padding: '10px 12px', borderBottom: '1px solid #f0efed', background: '#fff' }}>
              {!ingestOpen ? (
                <button data-ingest-open="" onClick={() => setIngestOpen(true)} style={{ width: '100%', padding: '8px', background: '#37352f', color: '#fff', border: 'none', borderRadius: '6px', cursor: 'pointer', fontSize: '13px', fontWeight: 600 }}>
                  + {lang === 'local' ? '从链接添加备选' : 'Add candidate from link'}
                </button>
              ) : (
                <IngestPanel
                  tripId={TRIP_ID}
                  dayNum={publishedDay && publishedDay.day}
                  editorSession={editorSession}
                  lang={lang}
                  onAdded={refetchTripData}
                  onClose={() => setIngestOpen(false)}
                />
              )}
            </div>
          )}
          <div style={{ flex: 1, minHeight: 0, overflowY: 'auto' }}>
            <CandidatesSidebar
              editorTripData={editorTripData}
              publishedDay={publishedDay}
              lang={lang}
              mapProvider={mapProvider}
              editorSelections={editorSelections}
              saveMutations={saveMutations}
              setEditorSelections={setEditorSelections}
              editorDay={editorDay}
              pendingSelection={pendingSelection}
              setPendingSelection={setPendingSelection}
              setEditorTripData={setEditorTripData}
              undoRecord={undoRecord}
              inlineMode
            />
          </div>
        </div>
      )}
    </div>
  );
}


    // Render app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NotionTravelApp />);
  </script>
</body>
</html>
