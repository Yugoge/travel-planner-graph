            {/* AC6/AC7: inter-item route render — between each pair of CONSECUTIVE located
                timeline items, render the route (duration + distance + mode + cost) when the
                routeCache holds a resolved entry for the 3-part key from:to:car; a non-ok route
                (pending/unresolved/error/stale/missing) renders pending with a working retry and
                is NEVER coerced to ¥0 (pending != 0). Positioned at the vertical midpoint of the
                gap so it visibly sits BETWEEN the two items on the timeline. */}
            {editorDay && routeCache && entriesWithLayout.map((entry, i) => {
              if (i === 0) return null;
              const prev = entriesWithLayout[i - 1];
              const aId = prev && prev.option_id;
              const bId = entry && entry.option_id;
              if (!aId || !bId || aId === bId) return null;
              const pairKey = aId + ':' + bId + ':car';
              const data = routeCache[pairKey];
              const midTop = (top(prev.time.end) + top(entry.time.start)) / 2;
              const status = data && data.status;
              const isOk = status === 'ok';
              const seg = (data && (data.segment || data)) || {};
              const parts = [];
              if (isOk) {
                if (seg.duration_min != null) parts.push('~' + seg.duration_min + ' min');
                if (seg.distance_km != null) parts.push(seg.distance_km + ' km');
                if (seg.mode) parts.push(seg.mode);
                if (seg.cost != null) parts.push(fmtCost(seg.cost, undefined, lang));
              }
              const label = isOk ? (parts.join(' · ') || 'route') : (data ? 'route pending' : 'add route');
              return (
                <div key={'route-' + pairKey} data-route-gap data-route-status={status || 'missing'} data-route-pair={pairKey}
                  style={{ position: 'absolute', top: Math.max(0, midTop - 9), left: '12px', zIndex: 2,
                    fontSize: '11px', color: isOk ? '#6b6b6b' : '#e07c5a', background: '#f5f5f3',
                    fontVariantNumeric: 'tabular-nums',
                    borderRadius: '4px', padding: '1px 8px', display: 'inline-flex', alignItems: 'center', gap: '4px' }}>
                  <span aria-hidden="true">🚕</span>
                  <span>{label}</span>
                  {!isOk && fetchRoute && (
                    <button data-route-retry onClick={(e) => { e.stopPropagation(); fetchRoute(aId, bId, pairKey); }}
                      style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '10px', color: '#4a90d9', padding: 0 }}>retry</button>
                  )}
                </div>
              );
            })}
          </div>
        </div>
        )}
        {/* AC8 mobile: bottom spacer so the last timeline items clear the 64px peek
            bottom-sheet and stay tappable (the sheet no longer overlaps/traps taps). */}
        {sm && <div data-mobile-sheet-spacer="" style={{ height: '88px' }} aria-hidden="true" />}
      </div>
    </div>
  );
};

// ============================================================
// EDITOR HELPERS (always active — unified viewer/editor page)
// ============================================================

// R1 v3 — locate a v2 option object for a given slot+selectedId across
// precedence: (1) target slot options, (2) same-day cross-slot, (3) cross-day fallback.
// Returns null if not found. Preserves slot/day context (NOT a flat map).
function findSelectedOption(editorDay, slotId, selectedId, editorTripData) {
  if (!selectedId) return null;
  // 1. Target slot
  const tgt = editorDay && editorDay.slots && editorDay.slots[slotId];
  if (tgt && tgt.options) {
    const hit = tgt.options.find(o => o.option_id === selectedId);
    if (hit) return hit;
  }
  // 2. Same-day cross-slot
  if (editorDay && editorDay.slots) {
    for (const sKey of Object.keys(editorDay.slots)) {
      if (sKey === slotId) continue;
      const s = editorDay.slots[sKey];
      if (!s || !s.options) continue;
      const hit = s.options.find(o => o.option_id === selectedId);
      if (hit) return hit;
    }
  }
  // 3. Cross-day fallback (editorTripData.days[*])
  if (editorTripData && editorTripData.days) {
    for (const d of editorTripData.days) {
      if (!d || !d.slots) continue;
      for (const sKey of Object.keys(d.slots)) {
        const s = d.slots[sKey];
        if (!s || !s.options) continue;
        const hit = s.options.find(o => o.option_id === selectedId);
        if (hit) return hit;
      }
    }
  }
  return null;
}

// R1c v3 — locate a v2 accommodation option across editorDay then cross-day fallback.
function findSelectedAccommodationOption(editorDay, editorTripData, selectedId) {
  if (!selectedId) return null;
  const acc = editorDay && editorDay.accommodation;
  if (acc && acc.options) {
    const hit = acc.options.find(o => o.option_id === selectedId);
    if (hit) return hit;
  }
  if (editorTripData && editorTripData.days) {
    for (const d of editorTripData.days) {
      const a = d && d.accommodation;
      if (!a || !a.options) continue;
      const hit = a.options.find(o => o.option_id === selectedId);
      if (hit) return hit;
    }
  }
  return null;
}

// R1 v3 synthesis helper — map a v2 option into PLAN card shape.
// iter-1 currency-display fix: callers pass a normalized DTO whose `cost` is ALREADY in
// display currency (converted by normalizeOptionCardDTO) and `cost_local` holds the raw
// local amount. Emit the CONVERTED numeric `cost` so fmtCost renders the right number with
// the € symbol (no more raw-CNY-as-€). For any non-DTO fallback caller, convert via
// toDisplayCurrency. cost_display is a display-currency string fallback only.
function _synthesizeCardFromV2Option(opt, existingCard) {
  const base = existingCard ? { ...existingCard } : {};
  base.name_base = opt.name || base.name_base;
  base.name_local = opt.name_local || base.name_local || '';
  if (opt.location_summary) base.location_base = opt.location_summary;
  if (opt.location_local) base.location_local = opt.location_local;
  base.image = opt.cover_image || opt.image || base.image || null;
  // Time: preserve existing card's time if v2 omits (TimelineView filters 00:00)
  if (opt.time && opt.time.start && opt.time.start !== '00:00') base.time = opt.time;
  // notes
  if (opt.notes_base) base.notes_base = opt.notes_base;
  if (opt.notes_local) base.notes_local = opt.notes_local;
  // cost: prefer the DTO's already-converted display `cost`; else convert local->display.
  const displayCost = (typeof opt.cost === 'number')
    ? opt.cost
    : toDisplayCurrency(opt.cost_local, opt.currency_local);
  base.cost = displayCost || 0;
  base.cost_local = (typeof opt.cost_local === 'number') ? opt.cost_local : 0;
  base.cost_display = '';
  base.option_id = opt.option_id;
  base.selected = true;
  return base;
}

// R1 v3 — match an existing card against a v2 option by option_id OR name.
function _matchesOption(card, opt) {
  if (!card || !opt) return false;
  if (card.option_id && opt.option_id && card.option_id === opt.option_id) return true;
  if (card.name_base && opt.name && card.name_base === opt.name) return true;
  if (card.name_local && opt.name_local && card.name_local === opt.name_local) return true;
  return false;
}

// mergeEditorSelectionsIntoPublishedDay was DELETED in Cycle 4 (pillar a, R3/AC2).
// Its full overlay is reproduced — sourced purely from the v2 editor model — by
// deriveV2DisplayDay (defined below normalizeSlotEnvelope). Editor-mode code reads
// NEITHER day.meals NOR day.meal_alternatives NOR publishedDay.meals; the v2-derived
// day model (incl. .renderOptions) is the single source feeding Timeline + Budget.

// ============================================================
// R4 v4 (dev-20260531-084316) — UNIFIED CARD NORMALIZATION + <OptionCard>
// One DTO + one component feed BOTH the middle board (KanbanView) AND the right
// sidebar (CandidatesSidebar), killing the two-normalization-path defect.
// ============================================================

// normalizeOptionCardDTO: canonicalize a single v2/PLAN-shaped option into the
// fields OptionCard renders. image = cover_image || image || null (single source).
// Carries name_base/name_local so getDisplayName/getDisplayField work unchanged.
function normalizeOptionCardDTO(opt) {
  if (!opt) return null;
  // RC (iter-1 currency-display fix): editor v2-derived options carry RAW LOCAL cost
  // (CNY) + currency_local; fmtCost renders with the DISPLAY symbol (€) and documents
  // "All costs are in display currency". Convert local->display HERE — the single shared
  // DTO chokepoint feeding board OptionCards, Timeline, and Budget-detail (via
  // _displayCardFromDTO) — so every editor surface shows the CONVERTED value, byte-for-byte
  // matching the static viewer (which converts via gen._to_display_currency). cost_local
  // preserves the original local amount for any surface that legitimately needs it.
  //
  // IDEMPOTENT + NO-DOUBLE-CONVERT (codex finding #2): convert local->display IFF the
  // option carries `currency_local`. Every raw v2 option ALWAYS carries currency_local
  // (verified: 52/52 on disk; flight-meal adapter defaults it to CNY), so meals/activities/
  // accommodation options all convert. A PLAN-synthesized card (e.g.
  // preserveCurrentAccommodationOption from publishedDay.accommodation) has NO currency_local
  // and its `cost` is ALREADY display currency -> PASS THROUGH (dividing would 7.9x-understate).
  // Raw source = cost_local (set by a prior normalize) ?? cost, so re-normalizing is a no-op:
  //   raw v2:    {cost:88, currency_local:'CNY'} -> {cost:11.2, cost_local:88, currency_local:'CNY'}
  //              -> re-normalize converts cost_local(88) -> 11.2 (stable).
  //   PLAN card: {cost:507}                      -> {cost:507, cost_local:507} (no currency_local)
  //              -> re-normalize passes through 507 (stable, no division).
  const hasLocalCurrency = typeof opt.currency_local === 'string' && opt.currency_local.length > 0;
  const rawSource = typeof opt.cost_local === 'number'
    ? opt.cost_local
    : (typeof opt.cost === 'number' ? opt.cost : 0);
  const displayCost = hasLocalCurrency
    ? toDisplayCurrency(rawSource, opt.currency_local)
    : (typeof opt.cost === 'number' ? opt.cost : 0); // already-display PLAN card: no conversion
  const localCost = rawSource;
  return {
    ...opt,
    option_id: opt.option_id || null,
    name_base: opt.name_base || opt.name || '',
    name_local: opt.name_local || '',
    location_base: opt.location_base || opt.location_summary || '',
    location_local: opt.location_local || '',
    image: opt.cover_image || opt.image || null,
    cost: displayCost,
    cost_local: localCost,
    cost_display: opt.cost_display || '',
    time: opt.time || null,
  };
}

// normalizeSlotEnvelope: resolve one slot's CARD model from v2 selection state.
// Inputs carry the fallback context the cross-day resolvers (2743/2777) require.
//   { dayNum, slotId, editorDay, editorTripData, editorSelections, publishedDay, context }
// Returns { slotId, isEmpty, isAccommodation, selectedId, option (DTO|null), origin }.
// isEmpty=true ⇒ board draws an explicit empty slot (no PLAN default). This is the
// SYM1 source-root fix: render by v2 selection, not by cloned PLAN_DATA.
// MEAL_SLOT_IDS_TPL: the three meal slots that may carry primary + included.
const MEAL_SLOT_IDS_TPL = ['breakfast', 'lunch', 'dinner'];

// _slotRawOptions: the v2 options[] for a slot from the editor v2 model.
function _slotRawOptions(editorDay, slotId, isAccommodation) {
  const s = isAccommodation
    ? (editorDay && editorDay.accommodation)
    : (editorDay && editorDay.slots && editorDay.slots[slotId]);
  return (s && Array.isArray(s.options)) ? s.options : [];
}

// _includedOptions: meal-slot options carrying included:true, de-duped against the
// primary, ordered by the slot's options[] array order (R6 deterministic semantics).
function _includedOptions(editorDay, slotId, isAccommodation, primaryId) {
  if (isAccommodation || !MEAL_SLOT_IDS_TPL.includes(slotId)) return [];
  const out = [];
  const seen = new Set();
  for (const o of _slotRawOptions(editorDay, slotId, isAccommodation)) {
    if (o && o.included === true && o.option_id && o.option_id !== primaryId && !seen.has(o.option_id)) {
      seen.add(o.option_id);
      out.push(o);
    }
  }
  return out;
}

// normalizeSlotEnvelope: resolve one slot's CARD model from v2 selection state.
// Returns { slotId, isEmpty, isAccommodation, selectedId, option (DTO|null) — back-compat,
//           primary (DTO|null), included: [DTO], renderOptions: [DTO] }.
// renderOptions = primary (if any) followed by each included meal option, all DTOs.
// DISPLAY-OCCUPANCY (R2-B4/R9): a meal slot is display-EMPTY when it has no resolvable
// primary AND no included:true option, even if options[] is non-empty.
function normalizeSlotEnvelope({ dayNum, slotId, editorDay, editorTripData, editorSelections }) {
  const sel = editorSelections || {};
  const isAccommodation = slotId === 'accommodation';
  const key = dayNum + ':' + slotId;
  const slotObj = isAccommodation
    ? (editorDay && editorDay.accommodation)
    : (editorDay && editorDay.slots && editorDay.slots[slotId]);
  const locallyTouched = Object.prototype.hasOwnProperty.call(sel, key);
  const persisted = slotObj && slotObj.selected_option_id;
  let selectedId = locallyTouched ? sel[key] : persisted;
  // BUG 3 (task 20260616): an UNTOUCHED slot with no explicit selection must still render the
  // server-stamped rendered primary (rendered_primary_option_id) — else options[0] for an
  // unskipped meal/accommodation slot — so the recommended option (e.g. Jianxinyuan) shows as the
  // MAIN card in EDIT mode, not the first `included` alternate. Mirrors CandidatesSidebar's
  // effectivePrimaryId and the static viewer. A locally TOUCHED slot (incl. an explicit clear,
  // sel[key]=null) is respected verbatim — no fallback — so a deliberate clear stays empty.
  if (!locallyTouched && (selectedId === undefined || selectedId === null) && slotObj) {
    if (slotObj.rendered_primary_option_id) {
      selectedId = slotObj.rendered_primary_option_id;
    } else if (!slotObj.skipped && Array.isArray(slotObj.options) && slotObj.options.length) {
      selectedId = slotObj.options[0].option_id;
    }
  }
  const rawPrimary = selectedId
    ? (isAccommodation
        ? findSelectedAccommodationOption(editorDay, editorTripData, selectedId)
        : findSelectedOption(editorDay, slotId, selectedId, editorTripData))
    : null;
  const primaryDTO = rawPrimary ? normalizeOptionCardDTO(rawPrimary) : null;
  const includedRaw = _includedOptions(editorDay, slotId, isAccommodation, selectedId);
  const includedDTOs = includedRaw.map(o => normalizeOptionCardDTO(o));
  const renderOptions = [];
  if (primaryDTO) renderOptions.push(primaryDTO);
  includedDTOs.forEach(d => renderOptions.push(d));
  const isEmpty = renderOptions.length === 0;
  return {
    slotId, isEmpty, isAccommodation, selectedId: selectedId || null,
    option: primaryDTO, primary: primaryDTO, included: includedDTOs, renderOptions,
  };
}

// deriveV2DisplayDay: the single v2-only day display model that REPLACES the deleted
// mergeEditorSelectionsIntoPublishedDay overlay. It reproduces the full overlay the
// deleted function supplied — the per-category budget overlay (sole Donut writer),
// day.cover, accommodation cover/check_in/check_out/stars, meal time, activity-anchor
// replacement, duplicate filtering, and cross-day fallback — but sources EVERYTHING
// from the v2 editor model (editorDay/editorTripData/editorSelections), reading NEITHER
// day.meals NOR day.meal_alternatives NOR publishedDay.meals in editor mode.
// Output is publishedDay-shaped for the Timeline/Budget consumers PLUS:
//   .renderOptions = { breakfast:[DTO], lunch:[DTO], dinner:[DTO] }  (primary + included)
// Timeline + Budget-detail meal reads consume .renderOptions[mealType], not day.meals.
function deriveV2DisplayDay({ dayNum, editorDay, editorTripData, editorSelections, publishedDay }) {
  // Viewer mode (no editorDay): return publishedDay untouched (no v2 overlay).
  if (!editorDay) return publishedDay;
  const day = publishedDay ? JSON.parse(JSON.stringify(publishedDay)) : { day: dayNum };
  // AC8 atomicity: carry the v2 day clock window (arrival_ts/departure_ts) from the raw editor
  // day onto the display day so TimelineView can clamp a grid drag-IN's derived time into the
  // same [arrival,departure] bounds the server save-boundary enforces (publishedDay from /api/trip
  // does not expose these). Without this the clamp falls back to 00:00-23:59 and an empty-grid
  // drop near the top of a flight/arrival day derives an out-of-bounds time the server rejects.
  if (editorDay) {
    if (editorDay.arrival_ts !== undefined) day.arrival_ts = editorDay.arrival_ts;
    if (editorDay.departure_ts !== undefined) day.departure_ts = editorDay.departure_ts;
  }
  // 1. Budget overlay — editorDay.budget is the authoritative per-category source.
  if (editorDay && editorDay.budget) {
    day.budget = Object.assign({}, day.budget, editorDay.budget);
  }

  // 2. Meals: derive primary + included per meal slot from v2 selection state.
  const renderOptions = {};
  day.meals = {};
  day.meal_alternatives = {};
  MEAL_SLOT_IDS_TPL.forEach(slotId => {
    const env = normalizeSlotEnvelope({ dayNum, slotId, editorDay, editorTripData, editorSelections });
    // Build PLAN-shaped DISPLAY cards from the v2 DTOs so the publishedDay-shaped consumers
    // (TimelineView, Donut, Budget-detail) keep working — and so meal `time` is preserved
    // (raw v2 DTOs have no time; _displayCardFromDTO restores the slot's PLAN time). The
    // Timeline/Budget-detail read renderOptions[], so renderOptions MUST hold display cards.
    const cards = env.renderOptions.map(d => _displayCardFromDTO(d, slotId, publishedDay));
    renderOptions[slotId] = cards;
    day.meals[slotId] = cards.length ? cards[0] : null;
    if (cards.length > 1) {
      day.meal_alternatives[slotId] = cards.slice(1);
    }
  });

  // 3. Accommodation: cover/check_in/check_out/stars from the v2 selected option.
  const accEnv = normalizeSlotEnvelope({ dayNum, slotId: 'accommodation', editorDay, editorTripData, editorSelections });
  if (accEnv.primary) {
    const accCard = _displayCardFromDTO(accEnv.primary, 'accommodation', publishedDay);
    const raw = accEnv.primary;
    accCard.check_in = raw.check_in || (publishedDay && publishedDay.accommodation && publishedDay.accommodation.check_in) || accCard.check_in || '';
    accCard.check_out = raw.check_out || (publishedDay && publishedDay.accommodation && publishedDay.accommodation.check_out) || accCard.check_out || '';
    accCard.stars = (raw.stars !== undefined ? raw.stars : (publishedDay && publishedDay.accommodation && publishedDay.accommodation.stars)) || 0;
    day.accommodation = accCard;
    const coverImg = raw.cover_image || raw.image || accCard.image;
    if (coverImg) day.cover = coverImg;
  } else if (Object.prototype.hasOwnProperty.call(editorSelections || {}, dayNum + ':accommodation')
             && (editorSelections || {})[dayNum + ':accommodation'] === null) {
    day.accommodation = null;
  }

  // 4. Activities: anchor-replacement + duplicate filtering from v2 selection.
  const actSlots = ['morning_activity', 'afternoon_activity', 'evening_activity'];
  const actArrays = ['attractions', 'entertainment', 'cafe', 'unscheduled_optionals'];
  actSlots.forEach(slotId => {
    const env = normalizeSlotEnvelope({ dayNum, slotId, editorDay, editorTripData, editorSelections });
    if (!env.primary) return;
    const selOpt = env.primary;
    let anchorArr = null, anchorIdx = -1;
    for (const arr of actArrays) {
      if (!day[arr]) continue;
      const idx = day[arr].findIndex(c => _matchesOption(c, selOpt));
      if (idx >= 0) { anchorArr = arr; anchorIdx = idx; break; }
    }
    if (anchorArr === null) {
      const slotOptionNames = new Set();
      (_slotRawOptions(editorDay, slotId, false)).forEach(o => {
        if (o.name) slotOptionNames.add(o.name);
        if (o.name_local) slotOptionNames.add(o.name_local);
      });
      let timedHit = null, untimedHit = null;
      for (const arr of actArrays) {
        if (!day[arr]) continue;
        for (let i = 0; i < day[arr].length; i++) {
          const c = day[arr][i];
          if ((c.name_base && slotOptionNames.has(c.name_base)) || (c.name_local && slotOptionNames.has(c.name_local))) {
            if (c.time && c.time.start && c.time.start !== '00:00') { if (!timedHit) timedHit = { arr, i }; }
            else if (!untimedHit) untimedHit = { arr, i };
          }
        }
      }
      const hit = timedHit || untimedHit;
      if (hit) { anchorArr = hit.arr; anchorIdx = hit.i; }
    }
    if (anchorArr === null) return;
    const existing = day[anchorArr][anchorIdx];
    // F8/AC5: an explicit user-edited v2 option time is AUTHORITATIVE — it must win over
    // the stale published-anchor time. Only fall back to the anchor's time when the v2
    // option carries no edited time (preserving the pre-edit positioning behavior).
    const v2Time = (selOpt && selOpt.time && selOpt.time.start && selOpt.time.end) ? selOpt.time : null;
    if (_matchesOption(existing, selOpt)) {
      existing.selected = true; existing.option_id = selOpt.option_id;
      if (v2Time) existing.time = v2Time;
    } else {
      const synth = _synthesizeCardFromV2Option(selOpt, existing);
      if (v2Time) synth.time = v2Time;
      else if (existing.time) synth.time = existing.time;
      day[anchorArr][anchorIdx] = synth;
    }
    for (const arr of actArrays) {
      if (!day[arr]) continue;
      day[arr] = day[arr].filter((c, i) => {
        if (arr === anchorArr && i === anchorIdx) return true;
        return !_matchesOption(c, selOpt);
      });
    }
  });

  day.renderOptions = renderOptions;
  return day;
}

  card.name_local = dto.name_local || card.name_local || '';

// Module-level drag state for onDragOver compatibility gate (AC18/FIX3)

const MEAL_SLOTS = new Set(['breakfast', 'lunch', 'dinner', 'meals-any']);
// SKIPPABLE_MEAL_SLOTS: the 3 real persisted meal slots per day.schema.json (additionalProperties:false).
// MEAL_SLOTS includes the UI-only 'meals-any' pseudo-slot which is NOT a valid persisted key — a skip
// mutation with slot:'meals-any' would write a schema-forbidden slots['meals-any'] key on disk.
// Therefore ALL backend `skip` mutation emits must be gated by SKIPPABLE_MEAL_SLOTS, not MEAL_SLOTS.
const SKIPPABLE_MEAL_SLOTS = new Set(['breakfast', 'lunch', 'dinner']);

// with the canonical payload shape {type:'skip', slot, extra:{skipped:false, skipped_reason:null}}.
// Returns [] when no input id is a valid persisted meal slot (filter no-ops for non-meal callers).
const buildSkipMuts = (...ids) => {
  const seen = new Set();
  const muts = [];
  for (const id of ids) {
    if (!id || !SKIPPABLE_MEAL_SLOTS.has(id) || seen.has(id)) continue;
    seen.add(id);
    muts.push({ type: 'skip', slot: id, extra: { skipped: false, skipped_reason: null } });
  }
  return muts;
};
function _isCompatible(srcSlotId, tgtSlotId) {
  if (MEAL_SLOTS.has(srcSlotId) && MEAL_SLOTS.has(tgtSlotId)) return true;

// attribute is set+reset at most once per ~500ms to avoid restarting the
// animation every frame. Stamp the element with __rejectAt to track timing.

      borderLeft: inlineMode ? 'none' : '1px solid #e5e7eb', zIndex: inlineMode ? undefined : 100,
      fontFamily: "ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif",
      padding: '16px 12px'
    }}>
      <div style={{ fontSize: '12px', color: '#9b9a97' }}>{lang === 'local' ? '今日无候选项。' : 'No candidates for this day.'}</div>
    </div>
  );

  const getSlotLabel = (slotId) => {
    const resolved = L(slotId, lang);
    if (resolved !== slotId) return resolved;
    const fallbacks = {
      breakfast: lang === 'local' ? '早餐' : 'Breakfast',
      lunch: lang === 'local' ? '午餐' : 'Lunch',
      dinner: lang === 'local' ? '晚餐' : 'Dinner',
      morning_activity: lang === 'local' ? '上午' : 'Morning',
      afternoon_activity: lang === 'local' ? '下午' : 'Afternoon',
      evening_activity: lang === 'local' ? '晚上' : 'Evening',
    };
    return fallbacks[slotId] || slotId;
  };

  // Cycle 4 (R8/FACT-3): COMPOSITE (day, slot_id, option_id) meal identity. The fixture
  // reuses option_ids (dinner-1-1/dinner-1-2) across breakfast/lunch/dinner, so a GLOBAL
  // option_id dedup/hide would collapse them. Build one candidate ENTRY PER (slot, option),
  // de-duped only WITHIN a slot, and tag each with its real source slot so hide/select/
  // pending/React-key are all slot-scoped. A meal candidate is hidden only when THAT slot's
  // candidate is primary or included:true; the same option_id in another slot stays renderable.
  const mealSelectionSlotIds = ['breakfast', 'lunch', 'dinner'];
  const mealsGroup = [];
  mealSelectionSlotIds.forEach(slotId => {
    const slot = slots[slotId];
    if (!slot || !slot.options) return;
    const seenInSlot = new Set();
    slot.options.forEach(rawOpt => {
      if (seenInSlot.has(rawOpt.option_id)) return;
      seenInSlot.add(rawOpt.option_id);
      mealsGroup.push({ ...rawOpt, _originSlotId: slotId });
    });
  });

  // Slot-scoped hide: a candidate is hidden only when, IN ITS OWN slot, it is the primary
  // OR carries included:true. (R8 composite identity — NOT a global option_id check.)
  const isMealHiddenInSlot = (optionId, slotId) => {
    const slot = slots[slotId];
    if (!slot) return false;
    const resolved = resolveSelectionLocal(dayNum + ':' + slotId, slot.selected_option_id);
    if (resolved === optionId) return true;
    return (slot.options || []).some(o => o.option_id === optionId && o.included === true);
  };

  // BUG 3 (task 20260616) — the RENDERED primary of a slot: the option the legacy-canonical codec
  // actually renders as the primary card, which the server REJECTS deleting. SINGLE SOURCE OF
  // TRUTH: prefer the server-stamped slot.rendered_primary_option_id (computed by the codec's
  // rendered_primary_option_id resolver in trip.py), so the client and server agree EXACTLY —
  // including the stale-selection case (legacy-name-matched primary != selected_option_id) the
  // old JS derivation missed. Fall back to the local derivation only for payloads without the
  // field (selected, else options[0] for an unskipped meal/accommodation slot). Activity slots
  // have no de-facto primary (rendered per-item), so a null-selection activity slot returns null.
  // Used to suppress the 🗑 control on the rendered-primary candidate card.
  const effectivePrimaryId = (slotId, slot) => {
    if (!slot) return null;
    // Client-side derivation for a slot the user has actively TOUCHED in Edit mode: selected
    // option (if present), else options[0] for an unskipped meal/accommodation slot, else null.
    // This is EXACTLY the server resolver's precedence for the client-known case — the only
    // branch the client cannot reproduce is the legacy-name match for STALE-selection slots,
    // which only applies to UNTOUCHED slots (see below).
    const localDerivedPrimary = () => {
      const opts = slot.options || [];
      const resolved = resolveSelectionLocal(dayNum + ':' + slotId, slot.selected_option_id);
      if (resolved && opts.some(o => o.option_id === resolved)) return resolved;
      const isMealOrAcc = MEAL_SLOT_IDS_TPL.includes(slotId) || slotId === 'accommodation';
      if (isMealOrAcc && !slot.skipped && opts.length > 0) return opts[0].option_id;
      return null;
    };
    // Approach (b): once the local editor has SUPERSEDED the server's view of this slot (the user
    // selected in Edit mode → editorSelections holds this slot's key), the server-stamped
    // rendered_primary_option_id is STALE for the candidate sidebar — it still names the
    // pre-select primary. For a TOUCHED slot the rendered primary is simply selected-else-options[0],
    // which the client computes correctly, so the delete-control visibility flips immediately with
    // NO refetch. UNTOUCHED slots keep the server stamp verbatim, preserving the stale-selection
    // legacy-name-match branch the client cannot reproduce.
    const locallyTouched = Object.prototype.hasOwnProperty.call(editorSelections || {}, dayNum + ':' + slotId);
    if (Object.prototype.hasOwnProperty.call(slot, 'rendered_primary_option_id') && !locallyTouched) {
      return slot.rendered_primary_option_id;
    }
    return localDerivedPrimary();
  };

  // Non-meal slots
  const activitySlots = ['morning_activity', 'afternoon_activity', 'evening_activity'];

  // R4 v4 (codex-1) — GLOBAL activity move-semantics: an activity option selected
  // in ANY activity slot is hidden from the sidebar everywhere (mirrors isMealSelected),
  // so a selected option does not linger as a duplicate under a different activity slot.
  const isActivitySelected = (optionId) => activitySlots.some(sid => {
    const s = slots[sid];
    const resolved = resolveSelectionLocal(dayNum + ':' + sid, s && s.selected_option_id);
    return resolved === optionId;
  });

  // Drop handler: drop from CandidatesSidebar or board onto CandidatesSidebar = deselect (M17b)
  // Thin wrapper: pre/post side-effect hooks (meal resynthesis) surround commitDropAction core (M4)
  const handleSidebarDrop = (e) => {
    if (typeof window !== 'undefined' && window.__TRIP_PREVIEW_READONLY) return; // read-only Preview
    if (window.TRIP_EDITOR_DND_ENGINE !== 'native') return;
    e.preventDefault();
    e.stopPropagation();
    const _p = parseDragPayload(e);
    if (!_p) return;
    const srcSlotId = _p.sourceSlotId;
    // board card dropped onto sidebar → deselect from source slot
    if ((_p.sourceSurface === 'plan-to-candidates' || _p.sourceSurface === 'board') && srcSlotId) {
      // Pre-wrapper (meal resynthesis): synthesize deselected meal option back into options[] (M4)
      // Cycle 4 (R3/AC2): editor-mode code no longer reads publishedDay.meals. The v2
      // model is the source of truth — the option is recovered from the v2 slots only.
      if (MEAL_SLOTS && MEAL_SLOTS.has(srcSlotId) && _p.optionId && setEditorTripData) {
        const optionId = _p.optionId;
        setEditorTripData(prev => {
          if (!prev || !prev.days) return prev;
          const updated = JSON.parse(JSON.stringify(prev));
          const dayEntry = updated.days.find(d => Number(d.day) === Number(dayNum));
          if (!dayEntry || !dayEntry.slots) return prev;
          if (!dayEntry.slots[srcSlotId]) dayEntry.slots[srcSlotId] = { options: [] };
          if (!dayEntry.slots[srcSlotId].options) dayEntry.slots[srcSlotId].options = [];
          dayEntry.slots[srcSlotId].skipped = false;
          const already = dayEntry.slots[srcSlotId].options.some(o => o.option_id === optionId);
          if (!already) {
            let srcOpt = null;
            let foundSlotKey = null;
            for (const sKey of Object.keys(dayEntry.slots)) {
              if (!MEAL_SLOTS.has(sKey)) continue;
              const s = dayEntry.slots[sKey];
              if (!s || !s.options) continue;
              const hit = s.options.find(o => o.option_id === optionId);
              if (hit) { srcOpt = hit; foundSlotKey = sKey; break; }
            }
            if (srcOpt) {
              const img = srcOpt.cover_image || srcOpt.image || null;
              dayEntry.slots[srcSlotId].options.push({
                ...srcOpt,
                cover_image: srcOpt.cover_image || img,
                image: srcOpt.image || img,
              });
              if (foundSlotKey && foundSlotKey !== srcSlotId) {
                dayEntry.slots[foundSlotKey].options = dayEntry.slots[foundSlotKey].options.filter(o => o.option_id !== optionId);
              }
            }
          }
          return updated;
        });
      }
      // Core: commitDropAction deselect path (targetSurface='sidebar') (M2)
      commitDropAction({ optionId: _p.optionId, sourceSlotId: srcSlotId, originSlotId: _p.originSlotId, targetSlotId: null, sourceSurface: _p.sourceSurface, targetSurface: 'sidebar', targetDroppable: true, allowWhenNonDroppable: false }, { dayNum, saveMutations, setEditorSelections, setEditorTripData, buildSkipMuts, flashSuccess: null, flashReject: null });
    }
  };

  // Apply selection from candidate tap/drop
  const applySelection = (optionId, targetSlotId, originSlotId) => {
    if (typeof window !== 'undefined' && window.__TRIP_PREVIEW_READONLY) return; // read-only Preview
    const key = dayNum + ':' + targetSlotId;
    // Cycle 4 (R9): drag/tap onto an OCCUPIED meal slot ADDS the meal as an included
    // alternate (selection_role:'included'), leaving the primary unchanged. An EMPTY meal
    // slot takes the normal SET-primary path below.
    if (MEAL_SLOTS.has(targetSlotId) && targetSlotId !== 'meals-any' && isMealSlotOccupied(targetSlotId, optionId)) {
      saveMutations(dayNum, [
        { type: 'select', slot: targetSlotId, option_id: optionId, origin_slot_id: originSlotId || null, selection_role: 'included' },
      ]);
      setPendingSelection && setPendingSelection(null);
      return;
    }
    // Cross-meal copy (M20): if meal option absent from target slot options, copy it
    if (MEAL_SLOTS.has(targetSlotId) && targetSlotId !== 'meals-any' && setEditorTripData) {
      setEditorTripData(prev => {
        if (!prev) return prev;
        const updated = JSON.parse(JSON.stringify(prev));
        const dayEntry = updated.days && updated.days.find(d => Number(d.day) === Number(dayNum));
        if (!dayEntry || !dayEntry.slots) return prev;
        const tgtSlot = dayEntry.slots[targetSlotId];
        if (!tgtSlot) return prev;
        if (!tgtSlot.options) tgtSlot.options = [];
        const alreadyThere = tgtSlot.options.some(o => o.option_id === optionId);
        if (!alreadyThere && originSlotId && originSlotId !== 'meals-any') {
          const srcSlot = dayEntry.slots[originSlotId];
          if (srcSlot && srcSlot.options) {
            const srcOpt = srcSlot.options.find(o => o.option_id === optionId);
            if (srcOpt) tgtSlot.options.push({ ...srcOpt });
          }
        }
        return updated;
      });
    }
    setEditorSelections(prev => ({ ...prev, [key]: optionId }));
    const mutations = [{ type: 'select', slot: targetSlotId, option_id: optionId, origin_slot_id: originSlotId || null }];
    saveMutations(dayNum, mutations);
    setPendingSelection && setPendingSelection(null);
  };

  // delete_option (task 20260616): remove a NON-selected candidate option from a slot entirely
  // through the existing mutation-batch path. The server rejects deleting the slot's selected
  // option (a delete control is never offered on a selected card), so this is always a candidate
  // /alternate. Optimistically prune it from editorTripData so the card disappears without a
  // reload; saveMutations only keeps the prune if the server APPLIED the delete (it reverts the
  // local state on a rejected delete by leaving the option in the refetched model on Done).
  const deleteCandidate = (slotId, optionId) => {
    if (typeof window !== 'undefined' && window.__TRIP_PREVIEW_READONLY) return; // read-only Preview
    if (!saveMutations || !slotId || !optionId) return;
    saveMutations(dayNum, [{ type: 'delete_option', slot: slotId, option_id: optionId }]);
  };

  // R4 v4 — structured candidate drag descriptor for OptionCard (candidates context).
  // Preserves the FULL DnD surface: native onDragStart/onDragEnd + pointer handleProps
  // + the sidebar-deselect .slot-drop overlay. slotId is the drag slotId (meals use
  // 'meals-any'); originSlotId is the real source slot.
  const makeCandidateDrag = (rawOpt, slotId, originSlotId, name) => ({
    optionId: rawOpt.option_id, slotId, originSlotId, sourceSurface: 'candidates',
    isMobileViewport,
    draggable: window.TRIP_EDITOR_DND_ENGINE === 'native',
    dragOptionId: rawOpt.option_id,
    onDragStart: (window.TRIP_EDITOR_DND_ENGINE === 'native') ? (e) => {
      currentDragSlotId = slotId;
      e.dataTransfer.setData('text/plain', JSON.stringify({ optionId: rawOpt.option_id, slotId, originSlotId, direction: 'candidates' }));
      e.dataTransfer.effectAllowed = 'move';
    } : undefined,
    onDragEnd: (window.TRIP_EDITOR_DND_ENGINE === 'native') ? () => { currentDragSlotId = null; } : undefined,
    handleProps: getHandleProps(rawOpt.option_id, slotId, originSlotId, 'candidates', name, rawOpt.cover_image || rawOpt.image),
    // M3 (stress-test): mobile-only tap-to-add into the candidate's own slot (set-primary if the
    // slot is empty, included alternate if occupied — applySelection handles both and persists).
    // The added item then renders in the Timeline tab at the slot's default time (editable via ✎).
    // Desktop keeps drag + tap-to-place (no button) so this affordance is gated on the viewport.
    onMobileAdd: isMobileViewport ? () => { applySelection(rawOpt.option_id, originSlotId, originSlotId); } : undefined,
    slotDrop: {
      dataDroppable: 'true', dataDropZone: 'sidebar-candidate', dataTargetSurface: 'sidebar',
      onDragOver: window.TRIP_EDITOR_DND_ENGINE === 'native' ? (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; } : undefined,
    },
  });

  const containerStyle = {
    position: inlineMode ? 'static' : 'fixed', right: 0, top: 0, bottom: 0, width: inlineMode ? '100%' : '300px',
    overflowY: inlineMode ? 'visible' : 'auto', background: 'white',
    borderLeft: inlineMode ? 'none' : '1px solid #e5e7eb', zIndex: inlineMode ? undefined : 100,
    fontFamily: "ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif",
  };

  return (
    <div id="candidates-groups" style={containerStyle}
      data-drop-zone="sidebar-candidate"
      data-target-surface="sidebar"
      data-droppable="true"
      onDragOver={window.TRIP_EDITOR_DND_ENGINE === 'native' ? (e) => e.preventDefault() : undefined}
      onDrop={handleSidebarDrop}
    >
      <div style={{ padding: '12px 12px 4px', borderBottom: '1px solid #f0efed', fontSize: '13px', fontWeight: '600', color: '#37352f', position: inlineMode ? 'static' : 'sticky', top: 0, background: 'white', zIndex: 1 }}>
        {lang === 'local' ? '候选项 — 第' + dayNum + '天' : 'Candidates — Day ' + dayNum}
      </div>

      {/* Accommodation group (AC15/FIX5): show accommodation options so user can select */}
      {editorDay && editorDay.accommodation && editorDay.accommodation.options && editorDay.accommodation.options.length > 0 && (() => {
        const accKey = dayNum + ':accommodation';
        const selectedAccId = resolveSelectionLocal(accKey, editorDay.accommodation.selected_option_id);
        const accLabel = L('accommodation', lang);
        return (
          <div style={{ padding: '8px 12px' }}>
            <div style={{ fontSize: '10px', fontWeight: '700', color: '#6b6b6b', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '6px' }}>
              {accLabel !== 'accommodation' ? accLabel : (lang === 'local' ? '住宿' : 'Accommodation')}
            </div>
            {editorDay.accommodation.options.map((rawOpt, oi) => {
              const opt = normalizeOptionCardDTO(rawOpt);
              const isSelected = selectedAccId === rawOpt.option_id;
              const isPending = pendingSelection && pendingSelection.optionId === rawOpt.option_id && pendingSelection.slotId === 'accommodation';
              // R4 v4 move-semantics: selected accommodation lives on the board, hide here.
              if (isSelected) return null;
              // BUG 3: suppress 🗑 on the EFFECTIVE rendered primary (options[0] of a null-selection
              // unskipped accommodation slot) — the server rejects deleting it.
              const isEffectivePrimary = effectivePrimaryId('accommodation', editorDay.accommodation) === rawOpt.option_id;
              const accDrag = makeCandidateDrag(rawOpt, 'accommodation', 'accommodation', getDisplayName(opt, lang));
              return (
                <OptionCard key={rawOpt.option_id || oi} context="candidates"
                  option={normalizeOptionCardDTO(rawOpt)}
                  categoryColor="#27ae60" categoryEmoji="🏨"
                  categoryLabel={accLabel !== 'accommodation' ? accLabel : (lang === 'local' ? '住宿' : 'Accommodation')}
                  isSelected={isSelected} isPending={isPending} isEmpty={false}
                  lang={lang} mapProvider={mapProvider} drag={accDrag}
                  onDelete={isEffectivePrimary ? undefined : () => deleteCandidate('accommodation', rawOpt.option_id)}
                  onClick={() => {
                    if (isPending) { setPendingSelection && setPendingSelection(null); return; }
                    setPendingSelection && setPendingSelection({ optionId: rawOpt.option_id, slotId: 'accommodation', originSlotId: 'accommodation' });
                  }}
                />
              );
            })}
          </div>
        );
      })()}

      {/* Unified Meals group (M19) */}
      {mealsGroup.length > 0 && (() => {
        const mealsLabel = L('meals', lang);
        return (
        <div style={{ padding: '8px 12px' }}>
          <div style={{ fontSize: '10px', fontWeight: '700', color: '#6b6b6b', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '6px' }}>
            {mealsLabel !== 'meals' ? mealsLabel : (lang === 'local' ? '餐饮' : 'Meals')}
          </div>
          {mealsGroup.map((rawOpt, oi) => {
            const opt = normalizeOptionCardDTO(rawOpt);
            const slotId = rawOpt._originSlotId;
            // R8 composite identity: hide only when THIS option is primary/included IN ITS OWN
            // slot; the same option_id under another meal slot stays independently renderable.
            const isSelected = isMealHiddenInSlot(rawOpt.option_id, slotId);
            if (isSelected) return null;
            // BUG 3: suppress the 🗑 control on the EFFECTIVE rendered primary (options[0] of a
            // null-selection unskipped meal slot) — the server rejects deleting it.
            const isEffectivePrimary = effectivePrimaryId(slotId, slots[slotId]) === rawOpt.option_id;
            // Pending state is slot-scoped too (composite identity).
            const isPending = pendingSelection && pendingSelection.optionId === rawOpt.option_id
              && pendingSelection.originSlotId === slotId;
            const mealDrag = makeCandidateDrag(rawOpt, slotId, slotId, getDisplayName(opt, lang));
            return (
              <OptionCard key={dayNum + ':' + slotId + ':' + (rawOpt.option_id || oi)} context="candidates"
                option={normalizeOptionCardDTO(rawOpt)}
                categoryColor="#e67e22" categoryEmoji="🍽️"
                categoryLabel={getSlotLabel(slotId)}
                isSelected={isSelected} isPending={isPending} isEmpty={false}
                lang={lang} mapProvider={mapProvider} drag={mealDrag}
                onDelete={isEffectivePrimary ? undefined : () => deleteCandidate(slotId, rawOpt.option_id)}
                onClick={() => {
                  if (isPending) { setPendingSelection && setPendingSelection(null); return; }
                  setPendingSelection && setPendingSelection({ optionId: rawOpt.option_id, slotId: slotId, originSlotId: slotId });
                }}
              />
            );
          })}
        </div>
        );
      })()}

      {/* Activity slots */}
      {activitySlots.map(slotId => {
        const slot = slots[slotId];
        if (!slot || !slot.options || slot.options.length === 0) return null;
        const key = dayNum + ':' + slotId;
        const selectedId = resolveSelectionLocal(key, slot.selected_option_id);
        return (
          <div key={slotId} style={{ padding: '8px 12px' }}>
            <div style={{ fontSize: '10px', fontWeight: '700', color: '#6b6b6b', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '6px' }}>
              {getSlotLabel(slotId)}
            </div>
            {slot.options.map((rawOpt, oi) => {
              const opt = normalizeOptionCardDTO(rawOpt);
              const isSelected = selectedId === rawOpt.option_id;
              const isPending = pendingSelection && pendingSelection.optionId === rawOpt.option_id && pendingSelection.slotId === slotId;
              // R4 v4 move-semantics (codex-1): selected activity lives on the board — hide it
              // from EVERY activity slot in the sidebar, not just its own slot.
              if (isSelected || isActivitySelected(rawOpt.option_id)) return null;
              const actDrag = makeCandidateDrag(rawOpt, slotId, slotId, getDisplayName(opt, lang));
              return (
                <OptionCard key={rawOpt.option_id || oi} context="candidates"
                  option={normalizeOptionCardDTO(rawOpt)}
                  categoryColor="#3498db" categoryEmoji="📍"
                  categoryLabel={getSlotLabel(slotId)}
                  isSelected={isSelected} isPending={isPending} isEmpty={false}
                  lang={lang} mapProvider={mapProvider} drag={actDrag}
                  onDelete={() => deleteCandidate(slotId, rawOpt.option_id)}
                  onClick={() => {
                    if (isPending) { setPendingSelection && setPendingSelection(null); return; }
                    setPendingSelection && setPendingSelection({ optionId: rawOpt.option_id, slotId: slotId, originSlotId: slotId });
                  }}
                />
              );
            })}
          </div>
        );
      })}
    </div>
  );
};

// ============================================================
// INGEST (Cycle 3) — paste URL/RedNote link -> preview -> review -> Add candidate
// ============================================================
// IngestPanel: a self-contained "Add from link" surface. It scrapes server-side
// (POST /api/ingest, draft-only), renders an editable preview, gates Add until the
// required fields/branch conditions are satisfied (F2 multi-item, F8 city-mismatch,
// thin page), offers optional cover-image selection, commits via POST
// /api/ingest/commit, inspects the add_option mutation_results (a rejected Add is an
// error, NOT a silent success), and on success refetches so the candidate appears +
// is draggable. Every failure branch is a first-class actionable state — never a
// silent no-op.
const INGEST_ADDABLE_SLOTS = ['breakfast','lunch','dinner','morning_activity','afternoon_activity','evening_activity','accommodation'];
const INGEST_ACTIVITY_SLOTS = ['morning_activity','afternoon_activity','evening_activity'];
const INGEST_ACTIVITY_CATS = ['attractions','cafe','entertainment','shopping'];

const IngestPanel = ({ tripId, dayNum, editorSession, lang, onAdded, onClose }) => {
  const [url, setUrl] = useState('');
  const [slot, setSlot] = useState('morning_activity');
  const [activityCat, setActivityCat] = useState('attractions');
  const [busy, setBusy] = useState(false);
  const [draft, setDraft] = useState(null);          // {draft_id, preview, option, branch, ...}
  const [branchMsg, setBranchMsg] = useState(null);  // {kind:'blocked'|'manual_required'|'error'|'expired', detail, branch}
  const [edited, setEdited] = useState({});          // user-edited whitelisted fields
  const [chosenImage, setChosenImage] = useState(null);
  const [chosenItem, setChosenItem] = useState(null);
  const [cityConfirmed, setCityConfirmed] = useState(false);
  const [result, setResult] = useState(null);        // {status:'added'|'rejected', detail, where}
  // Multi-candidate (小红书 list-note) state: a list of independently-addable candidates,
  // each {draft_id, item_id, option, preview} from the server; addState tracks per-candidate
  // add status ('idle'|'adding'|'added'|'rejected') keyed by draft_id.
  const [multi, setMulti] = useState(null);          // {candidates:[...], note_title, canonical_url}
  const [multiAddState, setMultiAddState] = useState({});
  // F8-MULTI: per-candidate city-mismatch confirmation, keyed by draft_id — mirrors the
  // single-URL `cityConfirmed`. A candidate whose server flagged requires_city_confirm is
  // NOT auto-confirmed; the user must tick its own checkbox before that candidate can Add.
  const [multiCityConfirmed, setMultiCityConfirmed] = useState({});
  const isLocal = lang === 'local';
  const t = (zh, en) => (isLocal ? zh : en);
  const isActivity = INGEST_ACTIVITY_SLOTS.includes(slot);

  const ingestHeaders = { 'Content-Type': 'application/json', 'X-Editor-Session': editorSession };

  const resetDraftState = () => {
    setDraft(null); setEdited({}); setChosenImage(null); setChosenItem(null);
    setCityConfirmed(false); setResult(null); setBranchMsg(null);
    setMulti(null); setMultiAddState({}); setMultiCityConfirmed({});
  };

  const cleanupDraft = useCallback((dId) => {
    if (!dId) return;
    fetch('/api/ingest/cleanup', { method: 'POST', headers: ingestHeaders,
      body: JSON.stringify({ draft_id: dId }) }).catch(() => {});
  }, [editorSession]);

  // Changing the url/slot/activity-category while a manual_required branch is showing
  // would otherwise let the manual Add commit the OLD server-minted draft's target
  // (a silent wrong-target add). Discard the stale branch + its orphaned draft
  // so the next Scrape mints a draft matching the new target.
  const onTargetChange = (setter) => (v) => {
    if (branchMsg) {
      if (branchMsg.draft_id) cleanupDraft(branchMsg.draft_id);
      setBranchMsg(null);
    }
    setter(v);
  };

  const doScrape = async () => {
    if (!url.trim()) { setBranchMsg({ kind: 'error', detail: t('请粘贴一个链接','paste a link first') }); return; }
    resetDraftState();
    setBusy(true);
    try {
      const body = { trip_id: tripId, day: dayNum, slot, url: url.trim() };
      if (isActivity) body.activity_category = activityCat;
      const r = await fetch('/api/ingest', { method: 'POST', headers: ingestHeaders, body: JSON.stringify(body) });
      const data = await r.json();
      if (r.status === 403) { setBranchMsg({ kind: 'error', detail: t('会话校验失败','session check failed') }); return; }
      if (r.status === 413) { setBranchMsg({ kind: 'error', detail: t('请求过大','request too large') }); return; }
      if (data.status === 'blocked') {
        setBranchMsg({ kind: 'blocked', branch: data.branch, detail: data.detail || t('该链接被安全策略拦截','link blocked by safety policy') });
        return;
      }
      if (data.status === 'manual_required' || data.status === 'needs_render') {
        // First-class actionable branch (rednote auth / timeout / 429 / unsupported MIME /
        // interstitial / SPA). Offer manual-entry that still records the URL citation.
        // The server now mints a real MANUAL draft for these branches and returns its
        // draft_id — the manual Add commits THAT draft, never null.
        setBranchMsg({ kind: 'manual_required', branch: data.branch, detail: data.detail,
                       canonical_url: data.canonical_url, draft_id: data.draft_id || null });
        return;
      }
      if (data.status === 'multi_preview') {
        // A 小红书 list-note extracted into N independently-addable candidates.
        setMulti(data);
        const init = {};
        (data.candidates || []).forEach(c => { init[c.draft_id] = 'idle'; });
        setMultiAddState(init);
      } else if (data.status === 'preview') {
        setDraft(data);
        if (data.preview && data.preview.images && data.preview.images.length === 1) {
          setChosenImage(data.preview.images[0].id); // single image -> preselect, user may decline
        }
      } else if (data.status === 'error') {
        setBranchMsg({ kind: 'error', detail: data.detail || t('抓取失败','scrape failed') });
      }
    } catch (e) {
      setBranchMsg({ kind: 'error', detail: t('网络错误，请重试','network error, retry') });
    } finally {
      setBusy(false);
    }
  };

  const previewVal = (field) => {
    if (Object.prototype.hasOwnProperty.call(edited, field)) return edited[field];
    return (draft && draft.option && draft.option.normalized && draft.option.normalized[field]) || '';
  };
  const setVal = (field, v) => setEdited(prev => ({ ...prev, [field]: v }));

  const multiItem = draft && draft.preview && draft.preview.multi_item;
  const thinPage = draft && draft.preview && draft.preview.thin;
  const needsCityConfirm = draft && draft.preview && draft.preview.requires_city_confirm;

  // Add gating (F2/F8/thin): name+why required; multi-item requires an item pick;
  // city-mismatch (F8) requires explicit confirm before Add is enabled.
  const nameOk = String(previewVal('name') || '').trim().length > 0;
  const whyOk = String(previewVal('why_fits_user') || (draft && draft.option && draft.option.normalized.why_fits_user) || '').trim().length > 0;
  const itemOk = !multiItem || !!chosenItem;
  const cityOk = !needsCityConfirm || cityConfirmed;
  const addEnabled = !!draft && !busy && !result && nameOk && whyOk && itemOk && cityOk;

  const doAdd = async () => {
    if (!draft) return;
    setBusy(true);
    try {
      const userEdits = {};
      ['name','name_local','location_summary','why_fits_user','cost','currency_local'].forEach(f => {
        if (Object.prototype.hasOwnProperty.call(edited, f)) userEdits[f] = edited[f];
      });
      const body = {
        draft_id: draft.draft_id,
        selected_item_id: chosenItem || undefined,
        selected_image_id: chosenImage || undefined,
        user_edited_fields: userEdits,
        city_confirmed: needsCityConfirm ? !!cityConfirmed : undefined,
      };
      const r = await fetch('/api/ingest/commit', { method: 'POST', headers: ingestHeaders, body: JSON.stringify(body) });
      const data = await r.json();
      if (r.status === 409 && data.code === 'draft_expired') {
        // F5: draft expired during review — visible, never silent. Carry the typed input
        // onto the expired banner so the "input preserved" claim is HONEST: the
        // user literally sees + can re-use what they typed, instead of a silent discard.
        const preserved = { ...(draft.option && draft.option.normalized ? {
          name: draft.option.normalized.name, why_fits_user: draft.option.normalized.why_fits_user,
          location_summary: draft.option.normalized.location_summary } : {}), ...edited };
        setBranchMsg({ kind: 'expired', preserved,
          detail: t('草稿已过期，请重新抓取。你刚才填写的内容已保留如下，可复制后重试。',
                    'Draft expired — re-scrape. Your typed input is preserved below; copy it and retry.') });
        setDraft(null);
        return;
      }
      if (data.status === 'added' || data.status === 'updated_existing') {
        setResult({ status: 'added', where: data.where, detail: data.detail, updated: data.status === 'updated_existing' });
        // Refetch so the candidate appears + is draggable.
        if (onAdded) await onAdded();
      } else if (data.status === 'rejected') {
        // add_option failure rides inside HTTP 200 — surface it as an error.
        setResult({ status: 'rejected', detail: data.detail || data.mutation_results });
      } else if (data.status === 'error') {
        setResult({ status: 'rejected', detail: data.detail });
      } else {
        setResult({ status: 'rejected', detail: t('未知响应','unexpected response') });
      }
    } catch (e) {
      setResult({ status: 'rejected', detail: t('网络错误','network error') });
    } finally {
      setBusy(false);
    }
  };

  // Add ONE candidate from a 小红书 list-note. Each candidate has its own server draft, so
  // the commit goes through the SAME /api/ingest/commit path as a single-URL ingest. The
  // city-mismatch gate (F8-MULTI) is NEVER auto-confirmed: a candidate the server flagged
  // requires_city_confirm sends the user's ACTUAL per-candidate choice (multiCityConfirmed
  // keyed by draft_id), mirroring the single-URL path. If confirm is required but the user
  // has not ticked it, the Add is blocked here (and the button is disabled) — never silently true.
  const doAddCandidate = async (cand) => {
    if (!cand || !cand.draft_id) return;
    if (cand.requires_city_confirm && !multiCityConfirmed[cand.draft_id]) return;
    setMultiAddState(prev => ({ ...prev, [cand.draft_id]: 'adding' }));
    try {
      const body = {
        draft_id: cand.draft_id,
        city_confirmed: cand.requires_city_confirm ? !!multiCityConfirmed[cand.draft_id] : undefined,
      };
      const r = await fetch('/api/ingest/commit', { method: 'POST', headers: ingestHeaders, body: JSON.stringify(body) });
      const data = await r.json();
      if (data.status === 'added' || data.status === 'updated_existing') {
        setMultiAddState(prev => ({ ...prev, [cand.draft_id]: 'added' }));
        if (onAdded) await onAdded(); // refetch so the new candidate is draggable
      } else {
        setMultiAddState(prev => ({ ...prev, [cand.draft_id]: 'rejected' }));
      }
    } catch (e) {
      setMultiAddState(prev => ({ ...prev, [cand.draft_id]: 'rejected' }));
    }
  };

  // Cleanup EVERY un-added candidate draft when the multi list is dismissed, so the
  // server GCs the unchosen drafts + their images (no orphaned drafts).
  // F3: skip a candidate whose Add is still in-flight ('adding') — GC'ing its draft
  // here would race the live /api/ingest/commit and delete the draft underneath itself.
  // Only drafts that are neither 'added' nor 'adding' are safe to GC on close.
  const cleanupMultiDrafts = useCallback(() => {
    if (!multi || !multi.candidates) return;
    multi.candidates.forEach(c => {
      const st = multiAddState[c.draft_id];
      if (st !== 'added' && st !== 'adding') cleanupDraft(c.draft_id);
    });
  }, [multi, multiAddState, cleanupDraft]);

  const closePanel = () => {
    if (multi) cleanupMultiDrafts();
    if (draft && draft.draft_id && (!result || result.status !== 'added')) cleanupDraft(draft.draft_id);
    // On the manual_required banner the server-minted draft has NOT been promoted to
    // `draft` yet — its id lives on branchMsg.draft_id. Without this, closing the panel
    // from that banner leaks the orphaned manual draft (matches the spec "preview/panel
    // closed without Add → draft GC'd" branch).
    if (!draft && branchMsg && branchMsg.draft_id) cleanupDraft(branchMsg.draft_id);
    if (onClose) onClose();
  };

  const fieldStyle = { width: '100%', padding: '7px 9px', border: '1px solid #e0dfdc', borderRadius: '6px', fontSize: '13px', marginTop: '3px', boxSizing: 'border-box' };
  const labelStyle = { fontSize: '11px', color: '#6b6b6b', fontWeight: 600, marginTop: '8px', display: 'block' };

  return (
    <div data-ingest-panel="" style={{ background: '#fff', border: '1px solid #ebeae8', borderRadius: '10px', padding: '14px', boxShadow: '0 4px 18px rgba(0,0,0,0.08)' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
        <strong style={{ fontSize: '14px', color: '#37352f' }}>{t('从链接添加','Add from link')}</strong>
        <button data-ingest-close="" onClick={closePanel} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', color: '#9b9a97' }}>✕</button>
      </div>

      {/* paste + target picker (F1/F9/F12 — only addable slots; meals-any NOT offered) */}
      {!draft && !multi && (
        <div>
          <label style={labelStyle}>{t('网页 / 小红书链接','Page / RedNote URL')}</label>
          <input data-ingest-url="" type="text" value={url} placeholder="https://… / 小红书"
            onChange={e => onTargetChange(setUrl)(e.target.value)} style={fieldStyle} />
          <label style={labelStyle}>{t('目标位置','Target slot')} (Day {dayNum})</label>
          <select data-ingest-slot="" value={slot} onChange={e => onTargetChange(setSlot)(e.target.value)} style={fieldStyle}>
            {INGEST_ADDABLE_SLOTS.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
          {isActivity && (
            <div>
              <label style={labelStyle}>{t('活动类别（活动位必填）','Activity category (required)')}</label>
              <select data-ingest-actcat="" value={activityCat} onChange={e => onTargetChange(setActivityCat)(e.target.value)} style={fieldStyle}>
                {INGEST_ACTIVITY_CATS.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          )}
          <button data-ingest-scrape="" onClick={doScrape} disabled={busy} style={{ marginTop: '12px', width: '100%', padding: '9px', background: busy ? '#cfcfcf' : '#37352f', color: '#fff', border: 'none', borderRadius: '6px', cursor: busy ? 'default' : 'pointer', fontSize: '13px', fontWeight: 600 }}>
            {busy ? t('抓取中…','Scraping…') : t('抓取并预览','Scrape & preview')}
          </button>
        </div>
      )}

      {/* first-class failure branches — every one actionable, never silent */}
      {branchMsg && (
        <div data-ingest-branch={branchMsg.branch || branchMsg.kind} style={{ marginTop: '10px', padding: '10px', borderRadius: '6px', background: branchMsg.kind === 'blocked' ? '#fbeaea' : '#fff7e6', border: '1px solid ' + (branchMsg.kind === 'blocked' ? '#f0c0c0' : '#ffe0a3'), fontSize: '12px', color: '#7a5b00' }}>
          <div style={{ fontWeight: 600 }}>
            {branchMsg.kind === 'blocked' ? t('链接被安全策略拦截','Link blocked by safety policy')
              : branchMsg.kind === 'expired' ? t('草稿已过期','Draft expired')
              : t('无法自动抓取该内容','Cannot auto-scrape this content')}
          </div>
          <div style={{ marginTop: '4px' }}>{branchMsg.detail}</div>
          {branchMsg.kind === 'expired' && branchMsg.preserved && (branchMsg.preserved.name || branchMsg.preserved.why_fits_user || branchMsg.preserved.location_summary) && (
            <div data-ingest-preserved="" style={{ marginTop: '6px', padding: '8px', background: '#fffdf5', border: '1px dashed #ddca8a', borderRadius: '5px', userSelect: 'text', whiteSpace: 'pre-wrap' }}>
              {branchMsg.preserved.name ? (t('名称','Name') + ': ' + branchMsg.preserved.name + '\n') : ''}
              {branchMsg.preserved.why_fits_user ? (t('为什么适合','Why it fits') + ': ' + branchMsg.preserved.why_fits_user + '\n') : ''}
              {branchMsg.preserved.location_summary ? (t('位置摘要','Location') + ': ' + branchMsg.preserved.location_summary) : ''}
            </div>
          )}
          {branchMsg.kind === 'manual_required' && branchMsg.draft_id && (
            <button data-ingest-manual="" onClick={() => {
              // Degrade honestly to a manual text candidate that still cites the URL.
              // Use the SERVER-minted manual draft_id so the manual
              // Add commits a real draft, never draft_id:null -> HTTP 400 dead-end.
              setDraft({ draft_id: branchMsg.draft_id, manual: true, canonical_url: branchMsg.canonical_url || url,
                option: { normalized: { name: '', why_fits_user: '', source_agent: isActivity ? activityCat : (slot === 'accommodation' ? 'accommodation' : 'meals'), city_context: null } },
                preview: { title: '', text: '', images: [], items: [], multi_item: false, thin: true } });
              setBranchMsg(null);
            }} style={{ marginTop: '8px', padding: '6px 10px', background: '#37352f', color: '#fff', border: 'none', borderRadius: '5px', cursor: 'pointer', fontSize: '12px' }}>
              {t('改为手动填写（仍记录链接）','Switch to manual entry (keeps the URL)')}
            </button>
          )}
          {(branchMsg.kind === 'blocked' || branchMsg.kind === 'error' || branchMsg.kind === 'expired') && (
            <button onClick={() => { setBranchMsg(null); resetDraftState(); }} style={{ marginTop: '8px', marginLeft: '6px', padding: '6px 10px', background: '#eee', color: '#37352f', border: 'none', borderRadius: '5px', cursor: 'pointer', fontSize: '12px' }}>
              {t('重试 / 换链接','Retry / new link')}
            </button>
          )}
        </div>
      )}

      {/* 小红书 list-note -> N independently-addable candidates */}
      {multi && multi.candidates && (
        <div data-ingest-multi="" style={{ marginTop: '10px' }}>
          <div style={{ fontSize: '12px', fontWeight: 600, color: '#2b4a9b', marginBottom: '6px' }}>
            {t('从这篇笔记中找到 ', 'Found ')}{multi.candidate_count}{t(' 个地点，逐个添加你想要的',' places — add the ones you want')}
          </div>
          {multi.candidates.map((c, ci) => {
            const opt = (c.option && c.option.normalized) || {};
            const st = multiAddState[c.draft_id] || 'idle';
            const added = st === 'added';
            const adding = st === 'adding';
            return (
              <div key={c.draft_id} data-ingest-candidate={c.item_id} style={{ display: 'flex', alignItems: 'flex-start', gap: '8px', padding: '8px', marginBottom: '6px', background: added ? '#eaf7ec' : '#f8f8f7', border: '1px solid ' + (added ? '#bfe6c6' : '#ebeae8'), borderRadius: '6px' }}>
                {c.preview && c.preview.images && c.preview.images[0] && (
                  <img src={c.preview.images[0].local_url} alt="" style={{ width: '40px', height: '40px', objectFit: 'cover', borderRadius: '5px', flexShrink: 0 }} />
                )}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div data-ingest-candidate-name="" style={{ fontSize: '13px', fontWeight: 600, color: '#37352f', wordBreak: 'break-word' }}>{opt.name || (t('地点','Place') + ' ' + (ci + 1))}</div>
                  {opt.location_summary && <div style={{ fontSize: '11px', color: '#9b9a97', wordBreak: 'break-word' }}>{opt.location_summary}</div>}
                  {opt.why_fits_user && <div style={{ fontSize: '11px', color: '#6b6b6b', marginTop: '2px', wordBreak: 'break-word' }}>{opt.why_fits_user}</div>}
                  {/* F8-MULTI: per-candidate city-mismatch confirm — shown ONLY when the server flagged
                      THIS candidate; mirrors the single-URL checkbox. Add is blocked until ticked. */}
                  {c.requires_city_confirm && !added && (
                    <label data-ingest-candidate-cityconfirm={c.item_id} style={{ display: 'flex', alignItems: 'center', gap: '5px', fontSize: '11px', color: '#9a6b00', marginTop: '4px', cursor: 'pointer' }}>
                      <input type="checkbox" checked={!!multiCityConfirmed[c.draft_id]} onChange={e => { const v = e.target.checked; setMultiCityConfirmed(prev => ({ ...prev, [c.draft_id]: v })); }} />
                      {t('城市不一致，仍要添加？','Different city — add anyway?')}
                    </label>
                  )}
                  {st === 'rejected' && <div style={{ fontSize: '11px', color: '#9b2c2c', marginTop: '2px' }}>{t('添加被拒绝','Add rejected')}</div>}
                </div>
                {(() => {
                  const cityBlocked = c.requires_city_confirm && !multiCityConfirmed[c.draft_id];
                  const addDisabled = added || adding || cityBlocked;
                  return (
                <button data-ingest-candidate-add={c.item_id} onClick={() => doAddCandidate(c)} disabled={addDisabled}
                  style={{ flexShrink: 0, padding: '6px 10px', background: added ? '#bfe6c6' : ((adding || cityBlocked) ? '#cfcfcf' : '#2f7a3f'), color: added ? '#1f6b32' : '#fff', border: 'none', borderRadius: '5px', cursor: addDisabled ? 'default' : 'pointer', fontSize: '12px', fontWeight: 600 }}>
                  {added ? t('已添加 ✓','Added ✓') : (adding ? t('添加中…','Adding…') : t('添加','Add'))}
                </button>
                  );
                })()}
              </div>
            );
          })}
          <button data-ingest-multi-done="" onClick={closePanel} style={{ marginTop: '4px', padding: '7px 12px', background: '#f0efed', color: '#37352f', border: 'none', borderRadius: '6px', cursor: 'pointer', fontSize: '13px' }}>{t('完成','Done')}</button>
        </div>
      )}

      {/* preview + review/edit (M13/F3) */}
      {draft && !result && (
        <div data-ingest-preview="">
          {multiItem && (
            <div data-ingest-multiitem="" style={{ marginTop: '8px', padding: '8px', background: '#f6f8ff', border: '1px solid #d6e0ff', borderRadius: '6px' }}>
              <div style={{ fontSize: '12px', fontWeight: 600, color: '#2b4a9b' }}>{t('该页面包含多个地点，请选择要添加的项目','This page lists several places — pick which to add')}</div>
              {draft.preview.items.map(it => (
                <label key={it.item_id} style={{ display: 'block', fontSize: '12px', marginTop: '5px', cursor: 'pointer' }}>
                  <input type="radio" name="ingest-item" data-ingest-item={it.item_id}
                    checked={chosenItem === it.item_id} onChange={() => setChosenItem(it.item_id)} /> {it.name || it.item_id}
                </label>
              ))}
            </div>
          )}
          {thinPage && !branchMsg && (
            <div style={{ marginTop: '8px', fontSize: '12px', color: '#9a6b00' }}>{t('内容较少，请补全必填字段后再添加','Sparse page — fill the required fields before adding')}</div>
          )}
          <label style={labelStyle}>{t('名称','Name')} *</label>
          <input data-ingest-field-name="" type="text" value={previewVal('name')} onChange={e => setVal('name', e.target.value)} style={fieldStyle} />
          <label style={labelStyle}>{t('为什么适合（必填）','Why it fits *')}</label>
          <textarea data-ingest-field-why="" value={String(previewVal('why_fits_user') || (draft.option && draft.option.normalized.why_fits_user) || '')} onChange={e => setVal('why_fits_user', e.target.value)} rows={2} style={{ ...fieldStyle, resize: 'vertical' }} />
          <label style={labelStyle}>{t('位置摘要','Location summary')}</label>
          <input data-ingest-field-loc="" type="text" value={previewVal('location_summary')} onChange={e => setVal('location_summary', e.target.value)} style={fieldStyle} />

          {/* image picker (M17/C1) — local cached URLs only, decline = text-only */}
          {draft.preview && draft.preview.images && draft.preview.images.length > 0 && (
            <div data-ingest-images="" style={{ marginTop: '10px' }}>
              <label style={labelStyle}>{t('封面图（可选，可不选）','Cover image (optional)')}</label>
              <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '4px' }}>
                {draft.preview.images.map(img => (
                  <img key={img.id} src={img.local_url} data-ingest-image={img.id} alt=""
                    onClick={() => setChosenImage(chosenImage === img.id ? null : img.id)}
                    style={{ width: '54px', height: '54px', objectFit: 'cover', borderRadius: '6px', cursor: 'pointer', border: chosenImage === img.id ? '3px solid #37352f' : '1px solid #e0dfdc' }} />
                ))}
                <button data-ingest-image-none="" onClick={() => setChosenImage(null)} style={{ fontSize: '11px', padding: '4px 8px', border: '1px solid #e0dfdc', borderRadius: '6px', background: chosenImage === null ? '#37352f' : '#fff', color: chosenImage === null ? '#fff' : '#37352f', cursor: 'pointer' }}>{t('不用图片','No image')}</button>
              </div>
            </div>
          )}

          {/* F8 city-mismatch confirm-or-retarget (server still derives final city_context) */}
          {draft.city_context && (
            <label data-ingest-cityconfirm="" style={{ display: 'flex', alignItems: 'center', gap: '6px', fontSize: '11px', color: '#6b6b6b', marginTop: '8px' }}>
              <input type="checkbox" checked={cityConfirmed} onChange={e => setCityConfirmed(e.target.checked)} />
              {t('确认这是','Confirm this is in')} {draft.city_context.city_name}
            </label>
          )}

          <div style={{ display: 'flex', gap: '8px', marginTop: '12px' }}>
            <button data-ingest-add="" onClick={doAdd} disabled={!addEnabled} style={{ flex: 1, padding: '9px', background: addEnabled ? '#2f7a3f' : '#cfcfcf', color: '#fff', border: 'none', borderRadius: '6px', cursor: addEnabled ? 'pointer' : 'default', fontSize: '13px', fontWeight: 600 }}>
              {busy ? t('添加中…','Adding…') : t('添加进备选方案','Add to candidates')}
            </button>
            <button data-ingest-cancel="" onClick={closePanel} style={{ padding: '9px 12px', background: '#f0efed', color: '#37352f', border: 'none', borderRadius: '6px', cursor: 'pointer', fontSize: '13px' }}>{t('取消','Cancel')}</button>
          </div>
        </div>
      )}

      {/* post-Add confirmation or honest rejection */}
      {result && (
        <div data-ingest-result={result.status} style={{ marginTop: '10px', padding: '10px', borderRadius: '6px', background: result.status === 'added' ? '#eaf7ec' : '#fbeaea', border: '1px solid ' + (result.status === 'added' ? '#bfe6c6' : '#f0c0c0'), fontSize: '12px', color: result.status === 'added' ? '#1f6b32' : '#9b2c2c' }}>
          {result.status === 'added' ? (
            <div>
              <div style={{ fontWeight: 600 }}>{t('已添加进备选方案','Added to candidates')} ✓</div>
              <div style={{ marginTop: '3px' }}>{t('位置','Location')}: Day {result.where && result.where.day} · {result.where && result.where.slot}. {t('可在右侧候选项中拖拽到看板','Drag it from Candidates onto the board')}.</div>
              <button data-ingest-done="" onClick={() => { resetDraftState(); }} style={{ marginTop: '8px', padding: '6px 10px', background: '#2f7a3f', color: '#fff', border: 'none', borderRadius: '5px', cursor: 'pointer', fontSize: '12px' }}>{t('再添加一个','Add another')}</button>
            </div>
          ) : (
            <div>
              <div style={{ fontWeight: 600 }}>{t('添加被拒绝（未保存）','Add rejected (not saved)')}</div>
              <div style={{ marginTop: '3px', wordBreak: 'break-word' }}>{Array.isArray(result.detail) ? result.detail.join('; ') : String(result.detail)}</div>
              <button onClick={() => setResult(null)} style={{ marginTop: '8px', padding: '6px 10px', background: '#9b2c2c', color: '#fff', border: 'none', borderRadius: '5px', cursor: 'pointer', fontSize: '12px' }}>{t('返回修改','Back to edit')}</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
};

function NotionTravelApp() {

  // BUG A fix: a STABLE per-browser editor session id, persisted in localStorage so a RELOAD by

  // concurrent editor, trapping them in reload->edit->banner. A genuinely different browser/tab
  // gets its own stored id, so real concurrent-edit detection is preserved. Per-trip key so two
  // trips edited in one browser don't cross-conflict.
  const [editorSession] = useState(() => {

    try {

  });
  const [saveState, setSaveState] = useState('idle'); // 'idle'|'saving'|'saved'|'error'
  const [lastSaveTs, setLastSaveTs] = useState(null);
  const [isOffline, setIsOffline] = useState(() => !navigator.onLine);
  const [conflictDetected, setConflictDetected] = useState(false);
  const [isMobileLayout, setIsMobileLayout] = useState(() => window.innerWidth < 768);
  const [mobileTab, setMobileTab] = useState('kanban'); // 'kanban'|'timeline'|'candidates'
  const [ingestOpen, setIngestOpen] = useState(false); // Cycle-3: Add-from-link panel
  const [pendingSelection, setPendingSelection] = useState(null); // {optionId, slotId, originSlotId} for tap-to-select
  const [routeCache, setRouteCache] = useState({}); // {pairKey: {status, duration_minutes}} for route gaps (AC12/AC23)
  // Cycle-2: undo/redo (client-only)
  const { toastMsg: undoToastMsg, record: undoRecord } = useUndoRedo();
  const routeSeqRef = React.useRef({}); // per-pair monotonic seq for stale-response guard
  const saveSeqRef = React.useRef(0);    // monotonic counter for saveMutations only
  const budgetSeqRef = React.useRef({}); // per-day counters for recomputeBudget

  // task 20260615-125613 (R4, codex finding 2): SYNCHRONOUS in-flight save counter. saveStateRef
  // is updated by a useEffect (after render), so a just-started save may not yet read 'saving' —
  // completeEdit's flush must await THIS counter (incremented synchronously before fetch, decremented

  const inFlightSavesRef = React.useRef(0);
  const lastSaveOkRef = React.useRef(true); // false after a save that ended in error/conflict
  const lastSaveTsRef = React.useRef(null);
  // M5 (spurious single-user conflict banner): the plan VERSION this client loaded — the version it
  // is editing on top of. save_seq (monotonic per-trip counter, collision-free) is the preferred
  // signal; last_saved_ts is the timestamp fallback (iso_now has only second resolution, so two
  // saves in one second share a ts — the seq disambiguates). Sent as client_base_seq/client_base_ts
  // with each save so the server flags a REAL concurrent modification (disk version moved past this
  // baseline) instead of a mere session-token difference. Advanced to the response's save_seq/
  // saved_ts after every successful save so subsequent saves carry the up-to-date baseline.
  const loadedBaseTsRef = React.useRef(null);

  const effectiveDay = useMemo(() => {

  // Fetch v2 trip data for CandidatesSidebar candidates (only when TRIP_ID is set).

  // The cache is keyed 3-part from:to:car; entries are wrapped as {status, segment} to

  useEffect(() => {
    if (!TRIP_ID) return;
    fetch('/api/trip/' + encodeURIComponent(TRIP_ID))
      .then(r => r.json())
      .then(data => {
        setEditorTripData(data);
        // M5: capture the loaded plan's version (save_seq + last_saved_ts) as the conflict baseline
        // (the version this client is editing on top of). A save carrying this baseline only
        // conflicts if the disk version actually advanced past it (a real concurrent edit), never on
        // a session-token diff. save_seq may be absent on a never-saved plan -> stays null and the
        // server uses the ts/legacy fallback.
        const _baseTs = data && data.meta && data.meta.last_saved_ts;
        if (_baseTs) loadedBaseTsRef.current = _baseTs;
        const _baseSeq = data && data.meta && data.meta.save_seq;
        if (typeof _baseSeq === 'number') loadedBaseSeqRef.current = _baseSeq;
        const entries = data && data.route_cache && data.route_cache.entries;
        if (entries && typeof entries === 'object') {
          const hydrated = {};
          Object.keys(entries).forEach(k => {

  // Returns true only when the persisted post-save state was actually reloaded; returns false on a

  // Budget recompute helper
  const recomputeBudget = useCallback((dayNum) => {
    if (!TRIP_ID) return;

            // F6/AC7: intra_city has no first-class UI slot, so MERGE its known route cost
            // into the transportation bucket instead of discarding it. This is what keeps

            {
