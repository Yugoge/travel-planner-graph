                routeCache holds a resolved entry for the 3-part key from:to:car; a non-ok route
                (pending/unresolved/error/stale/missing) renders pending with a working retry and
                is NEVER coerced to ¥0 (pending != 0). Positioned at the vertical midpoint of the
                gap so it visibly sits BETWEEN the two items on the timeline. */}
            {editorDay && routeCache && entriesWithLayout.map((entry, i) => {
              if (i === 0) return null;
              const prevNeighbor = entriesWithLayout[i - 1]; // immediate timeline neighbor (for positioning)
              const bId = entry && entry.option_id;
              // A route gap is only meaningful when the TARGET is a routable located item
              // (coord-bearing, non-transport). A no-coords meal target has nowhere to route TO.
              if (!bId) return null;
              if (_routeItemIsTransport(entry) || !_routeItemHasCoords(entry)) return null;

              // task 20260616-231026 (Work Item B): per-target-block route ORIGIN + MODE chooser.
              // Origin candidates: (1) the previous LOCATED item — the nearest preceding
              // coord-bearing non-transport entry (AC-B1b skips the no-coords lunch between the
              // two activities); (2) the day's accommodation. Default origin = prev-located,
              // default mode = car; a user choice (routeChoice[bId]) overrides both for THIS block.
              const choice = (routeChoice && routeChoice[bId]) || {};
              const chosenMode = ROUTE_MODES.includes(choice.mode) ? choice.mode : DEFAULT_ROUTE_MODE;

              // nearest preceding located (coord-bearing, non-transport) entry as the prev-item origin
              let prevLocated = null;
              for (let j = i - 1; j >= 0; j--) {
                const cand = entriesWithLayout[j];
                if (cand && cand.option_id && cand.option_id !== bId && !_routeItemIsTransport(cand) && _routeItemHasCoords(cand)) { prevLocated = cand; break; }
              }
              const prevId = prevLocated && prevLocated.option_id;

              // accommodation origin candidate (resolve raw option for coords + city_context).
              // codex finding 4: honor an in-session accommodation re-selection (editorSelections)
              // exactly like normalizeSlotEnvelope, else fall back to the persisted selected_option_id —
              // otherwise the chooser keeps offering the OLD accommodation after the user changes it.
              const _accKey = (day && day.day) + ':accommodation';
              const accSelId = (editorSelections && Object.prototype.hasOwnProperty.call(editorSelections, _accKey))
                ? editorSelections[_accKey]
                : (editorDay.accommodation && editorDay.accommodation.selected_option_id);
              const accRaw = accSelId ? findSelectedAccommodationOption(editorDay, editorTripData, accSelId) : null;
              const accItem = accRaw ? { option_id: accSelId, coordinates: accRaw.coordinates, city_context: accRaw.city_context, _type: 'accommodation', _slotId: 'accommodation' } : null;

              // eligibility per the shared AC-B4 predicate (same-city + both coord-bearing, not transport).
              const prevEligible = !!prevLocated && prevItemOriginEligible(prevLocated, entry, editorDay, editorTripData);
              const accEligible = !!accItem && prevItemOriginEligible(accItem, entry, editorDay, editorTripData);
              // accommodation may be same-city but lack coords (B-E2 routability block): distinguish
              // so the disabled cue explains WHY (no-coords) vs simply not-applicable.
              const accNoCoords = !!accItem && !_routeItemHasCoords(accItem);
              // a gap with NO eligible origin at all still renders (disabled cue, no silent error).

              // resolve the active origin (codex finding 1: NEVER default fromId to an ineligible
              // prevId — start null and assign only inside an eligible branch, so a gap with no
              // eligible origin produces fromId=null and disables the route fetch entirely; this
              // prevents a cross-city / no-coords pair ever reaching fetchRoute).
              let fromId = null, originKind = 'none';
              if (choice.fromOptionId === (accItem && accItem.option_id) && accEligible) { fromId = accItem.option_id; originKind = 'accommodation'; }
              else if (choice.fromOptionId === prevId && prevEligible) { fromId = prevId; originKind = 'prev'; }
              else if (prevEligible) { fromId = prevId; originKind = 'prev'; }
              else if (accEligible) { fromId = accItem.option_id; originKind = 'accommodation'; }

              const pairKey = (fromId || 'none') + ':' + bId + ':' + chosenMode;
              const data = fromId ? routeCache[pairKey] : null;
              const midTop = (top(prevNeighbor.time.end) + top(entry.time.start)) / 2;
              const status = data && data.status;
              const isOk = status === 'ok';
              const seg = (data && (data.segment || data)) || {};
              const parts = [];
              if (isOk) {
                if (seg.duration_min != null) parts.push('~' + seg.duration_min + ' min');
                if (seg.distance_km != null) parts.push(seg.distance_km + ' km');
                if (seg.mode) parts.push(seg.mode);
                if (seg.cost != null) parts.push(fmtCost(seg.cost, undefined, lang));
              }
              const isLoading = !!data && status !== 'ok' && status !== 'error' && status !== 'unknown';
              const label = isOk ? (parts.join(' · ') || 'route')
                : status === 'error' ? (lang === 'local' ? '路线出错' : 'route error')
                : status === 'unknown' ? (lang === 'local' ? '无法定位' : 'no coords')
                : isLoading ? (lang === 'local' ? '计算中…' : 'routing…')
                : (lang === 'local' ? '加路线' : 'add route');
              const modeIcon = (ROUTE_MODE_LABELS[chosenMode] || ROUTE_MODE_LABELS.car).icon;

              // re-route helper: invalidate the previously rendered pair (B-E5) and record the choice.
              // codex finding 8: do NOT explicitly fetch here — the auto-route effect re-runs on the
              // updated routeChoice and issues the SINGLE fetch for the new pair+mode (no duplicate POST).
              const chooseRoute = (nextFrom, nextMode) => {
                if (!nextFrom) return;
                // codex finding 5 (AC-B5): re-clicking the ALREADY-active origin+mode is a no-op —
                // do NOT invalidate+refetch the current ok pair (that would transiently drop the
                // active route and open a same-key ok/stale save race for zero user benefit).
                if (nextFrom === fromId && nextMode === chosenMode) return;
                if (invalidateRoutePair) invalidateRoutePair(pairKey);
                if (setRouteChoice) setRouteChoice(prevC => ({ ...prevC, [bId]: { fromOptionId: nextFrom, mode: nextMode, _slotId: entry._slotId } }));
              };

              const segBtn = (active, disabled) => ({
                background: active ? '#37352f' : 'transparent', color: disabled ? '#c4c4c0' : (active ? '#fff' : '#37352f'),
                border: 'none', borderRadius: '3px', padding: '0 6px', minHeight: sm ? '44px' : '20px', minWidth: sm ? '44px' : 'auto',
                fontSize: '10px', cursor: disabled ? 'not-allowed' : 'pointer', transition: 'background 0.12s, color 0.12s',
                display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '2px',
              });

              return (
                <div key={'route-' + pairKey} data-route-gap data-route-status={status || 'missing'} data-route-pair={pairKey} data-route-origin={originKind} data-route-mode={chosenMode}
                  style={{ position: 'absolute', top: Math.max(0, midTop - 9), left: '12px', zIndex: 2,
                    fontSize: '11px', color: '#37352f', background: '#f5f5f3',
                    fontVariantNumeric: 'tabular-nums', border: '1px solid #e9e9e7',
                    borderRadius: '4px', padding: '2px 6px', display: 'inline-flex', alignItems: 'center', flexWrap: 'wrap', gap: '4px', maxWidth: sm ? '88vw' : '420px' }}>
                  <span aria-hidden="true">{modeIcon}</span>
                  <span style={{ color: isOk ? '#6b6b6b' : (status === 'error' ? '#e07c5a' : '#9b9a97') }}>{label}</span>
                  {isLoading && <span data-route-loading aria-label="loading" style={{ fontSize: '10px', color: '#9b9a97' }} role="status">⏳</span>}

                  {/* origin chooser: previous item | day accommodation (B1, B-E1/E2/E3) */}
                  <span data-route-origin-chooser role="group" aria-label={lang === 'local' ? '选择起点' : 'choose origin'}
                    style={{ display: 'inline-flex', alignItems: 'center', gap: '1px', borderLeft: '1px solid #e9e9e7', paddingLeft: '4px' }}>
                    <button type="button" data-origin-opt="prev" aria-pressed={originKind === 'prev'} disabled={!prevEligible}
                      title={prevEligible ? (lang === 'local' ? '从上一项出发' : 'from previous item') : (lang === 'local' ? '上一项不可作为起点（跨城/无坐标/为交通段）' : 'previous item ineligible (cross-city / no coords / transport)')}
                      onClick={(e) => { e.stopPropagation(); if (prevEligible) chooseRoute(prevId, chosenMode); }}
                      style={segBtn(originKind === 'prev', !prevEligible)}>
                      <span aria-hidden="true">↖</span><span>{lang === 'local' ? '上一项' : 'prev'}</span>
                    </button>
                    <button type="button" data-origin-opt="accommodation" aria-pressed={originKind === 'accommodation'} disabled={!accEligible}
                      aria-disabled={!accEligible}
                      title={accEligible ? (lang === 'local' ? '从住宿出发' : 'from accommodation') : accNoCoords ? (lang === 'local' ? '住宿无坐标，无法定位' : 'accommodation has no coordinates') : (lang === 'local' ? '住宿不可作为起点' : 'accommodation ineligible')}
                      onClick={(e) => { e.stopPropagation(); if (accEligible && accItem) chooseRoute(accItem.option_id, chosenMode); }}
                      style={segBtn(originKind === 'accommodation', !accEligible)}>
                      <span aria-hidden="true">{accEligible ? '🏨' : '🚫'}</span>
                      <span>{lang === 'local' ? '住宿' : 'accom'}</span>
                      {!accEligible && accNoCoords && <span data-no-coords-cue style={{ fontSize: '9px' }}>{lang === 'local' ? '·无坐标' : '· no coords'}</span>}
                    </button>
                  </span>

                  {/* mode chooser: car | walk | transit only (B2/B-E4) */}
                  <span data-route-mode-chooser role="group" aria-label={lang === 'local' ? '选择方式' : 'choose mode'}
                    style={{ display: 'inline-flex', alignItems: 'center', gap: '1px', borderLeft: '1px solid #e9e9e7', paddingLeft: '4px' }}>
                    {ROUTE_MODES.map(m => {
                      const ml = ROUTE_MODE_LABELS[m];
                      return (
                        <button type="button" key={'mode-' + m} data-mode-opt={m} aria-pressed={chosenMode === m} disabled={!fromId}
                          title={!fromId ? (lang === 'local' ? '无可用起点' : 'no available origin') : (lang === 'local' ? ml.local : ml.base)}
                          onClick={(e) => { e.stopPropagation(); if (fromId) chooseRoute(fromId, m); }}
                          style={segBtn(chosenMode === m, !fromId)}>
                          <span aria-hidden="true">{ml.icon}</span>
                          <span>{lang === 'local' ? ml.local : ml.base}</span>
                        </button>
                      );
                    })}
                  </span>

                  {!isOk && !isLoading && fromId && fetchRoute && (
                    <button data-route-retry onClick={(e) => { e.stopPropagation(); fetchRoute(fromId, bId, pairKey, chosenMode); }}
                      style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '10px', color: '#4a90d9', padding: 0, minHeight: sm ? '44px' : 'auto' }}>{lang === 'local' ? '重试' : 'retry'}</button>
                  )}
                </div>
              );
            })}
          </div>
        </div>
        )}
        {/* AC8 mobile: bottom spacer so the last timeline items clear the 64px peek
            bottom-sheet and stay tappable (the sheet no longer overlaps/traps taps). */}
        {sm && <div data-mobile-sheet-spacer="" style={{ height: '88px' }} aria-hidden="true" />}
      </div>
    </div>
  );
};

// ============================================================
// EDITOR HELPERS (always active — unified viewer/editor page)
// ============================================================

// R1 v3 — locate a v2 option object for a given slot+selectedId across
// precedence: (1) target slot options, (2) same-day cross-slot, (3) cross-day fallback.
// Returns null if not found. Preserves slot/day context (NOT a flat map).
function findSelectedOption(editorDay, slotId, selectedId, editorTripData) {
  if (!selectedId) return null;
  // 1. Target slot
  const tgt = editorDay && editorDay.slots && editorDay.slots[slotId];
  if (tgt && tgt.options) {
    const hit = tgt.options.find(o => o.option_id === selectedId);
    if (hit) return hit;
  }
  // 2. Same-day cross-slot
  if (editorDay && editorDay.slots) {
    for (const sKey of Object.keys(editorDay.slots)) {
      if (sKey === slotId) continue;
      const s = editorDay.slots[sKey];
      if (!s || !s.options) continue;
      const hit = s.options.find(o => o.option_id === selectedId);
      if (hit) return hit;
    }
  }
  // 3. Cross-day fallback (editorTripData.days[*])
  if (editorTripData && editorTripData.days) {
    for (const d of editorTripData.days) {
      if (!d || !d.slots) continue;
      for (const sKey of Object.keys(d.slots)) {
        const s = d.slots[sKey];
        if (!s || !s.options) continue;
        const hit = s.options.find(o => o.option_id === selectedId);
        if (hit) return hit;
      }
    }
  }
  return null;
}

// R1c v3 — locate a v2 accommodation option across editorDay then cross-day fallback.
function findSelectedAccommodationOption(editorDay, editorTripData, selectedId) {
  if (!selectedId) return null;
  const acc = editorDay && editorDay.accommodation;
  if (acc && acc.options) {
    const hit = acc.options.find(o => o.option_id === selectedId);
    if (hit) return hit;
  }
  if (editorTripData && editorTripData.days) {
    for (const d of editorTripData.days) {
      const a = d && d.accommodation;
      if (!a || !a.options) continue;
      const hit = a.options.find(o => o.option_id === selectedId);
      if (hit) return hit;
    }
  }
  return null;
}

// ============================================================
// ROUTE ORIGIN/MODE CHOOSER helpers (task 20260616-231026, Work Item B)
// Per-timeline-block route ORIGIN (previous located item | day accommodation)
// + MODE (walk|car|transit) chooser. Pure logic mirrors the AC-B4 Python oracle
// in tests/generated/20260616-231026/test_AC_B4_*.py::prev_item_origin_eligible.
// Keep these two predicates in lock-step. Server is unchanged (route.py accepts
// arbitrary origin + the {car,walk,transit} modes it maps in _mode_to_command).
// ============================================================

// Modes the server's _mode_to_command actually maps to real gaode commands
// (route.py:102-115). metro/bus/ferry are NOT offered: they sit in the route_cache
// enum but have no command mapping (silently fall back to walking) — offering them
// would mislead the user.
const ROUTE_MODES = ['car', 'walk', 'transit'];
const DEFAULT_ROUTE_MODE = 'car'; // module-level default; both TimelineView and NotionTravelApp read this
const ROUTE_MODE_LABELS = { car: { base: 'Drive', local: '驾车', icon: '🚕' }, walk: { base: 'Walk', local: '步行', icon: '🚶' }, transit: { base: 'Transit', local: '公交', icon: '🚌' } };

// Coordinates are ROUTABILITY only, never city identity. Shape: {latitude||lat, longitude||lng}.
function _routeItemHasCoords(item) {
  const c = item && item.coordinates;
  return !!(c && (c.latitude != null || c.lat != null) && (c.longitude != null || c.lng != null));
}

// A transportation/travel slot is never an eligible route ORIGIN (mirrors the
// Python oracle _is_transport: transportation/travel/flight excluded).
function _routeItemIsTransport(item) {
  const t = (item && (item._type || item.slot_type || item.kind || item.type) || '').toString().toLowerCase();
  return t === 'transportation' || t === 'transport' || t === 'travel' || t === 'flight';
}

// Resolve an item's authoritative city_id from city_context (mandatory per-option in
// the v2 schema). Prefer the field already on the display entry; else resolve the raw
// option by option_id (the display entry may not preserve city_context).
function _routeCityId(item, editorDay, editorTripData) {
  const direct = item && item.city_context && item.city_context.city_id;
  if (direct != null) return direct;
  if (!item || !item.option_id) return null;
  const raw = findSelectedOption(editorDay, item._slotId, item.option_id, editorTripData)
    || findSelectedAccommodationOption(editorDay, editorTripData, item.option_id);
  const cc = raw && raw.city_context;
  return (cc && cc.city_id != null) ? cc.city_id : null;
}

// previous-item origin eligibility — EXACT mirror of the AC-B4 Python oracle
// prev_item_origin_eligible(frm, to): same calendar day (caller's responsibility —
// pair comes from one day's timeline), same city_context.city_id, both
// coordinate-bearing, candidate origin not transport/travel. Cross-city => ineligible
// (no cross-city ground route, B-E3); transport candidate => ineligible regardless of city.
function prevItemOriginEligible(frm, to, editorDay, editorTripData) {
  if (_routeItemIsTransport(frm) || _routeItemIsTransport(to)) return false;
  if (!_routeItemHasCoords(frm) || !_routeItemHasCoords(to)) return false;
  const a = _routeCityId(frm, editorDay, editorTripData);
  const b = _routeCityId(to, editorDay, editorTripData);
  if (a == null || b == null) return false;
  return a === b;
}

// R1 v3 synthesis helper — map a v2 option into PLAN card shape.
// iter-1 currency-display fix: callers pass a normalized DTO whose `cost` is ALREADY in
// display currency (converted by normalizeOptionCardDTO) and `cost_local` holds the raw
// local amount. Emit the CONVERTED numeric `cost` so fmtCost renders the right number with
// the € symbol (no more raw-CNY-as-€). For any non-DTO fallback caller, convert via
// toDisplayCurrency. cost_display is a display-currency string fallback only.
function _synthesizeCardFromV2Option(opt, existingCard) {
  const base = existingCard ? { ...existingCard } : {};
  base.name_base = opt.name || base.name_base;
  base.name_local = opt.name_local || base.name_local || '';
  if (opt.location_summary) base.location_base = opt.location_summary;
  if (opt.location_local) base.location_local = opt.location_local;
  base.image = opt.cover_image || opt.image || base.image || null;
  // Time: preserve existing card's time if v2 omits (TimelineView filters 00:00)
  if (opt.time && opt.time.start && opt.time.start !== '00:00') base.time = opt.time;
  // notes
  if (opt.notes_base) base.notes_base = opt.notes_base;
  if (opt.notes_local) base.notes_local = opt.notes_local;
  // cost: prefer the DTO's already-converted display `cost`; else convert local->display.
  const displayCost = (typeof opt.cost === 'number')
    ? opt.cost
    : toDisplayCurrency(opt.cost_local, opt.currency_local);
  base.cost = displayCost || 0;
  base.cost_local = (typeof opt.cost_local === 'number') ? opt.cost_local : 0;
  base.cost_display = '';
  base.option_id = opt.option_id;
  base.selected = true;
  return base;
}

// R1 v3 — match an existing card against a v2 option by option_id OR name.
function _matchesOption(card, opt) {
  if (!card || !opt) return false;
  if (card.option_id && opt.option_id && card.option_id === opt.option_id) return true;
  if (card.name_base && opt.name && card.name_base === opt.name) return true;
  if (card.name_local && opt.name_local && card.name_local === opt.name_local) return true;
  return false;
}

// mergeEditorSelectionsIntoPublishedDay was DELETED in Cycle 4 (pillar a, R3/AC2).
// Its full overlay is reproduced — sourced purely from the v2 editor model — by
// deriveV2DisplayDay (defined below normalizeSlotEnvelope). Editor-mode code reads
// NEITHER day.meals NOR day.meal_alternatives NOR publishedDay.meals; the v2-derived
// day model (incl. .renderOptions) is the single source feeding Timeline + Budget.

// ============================================================
// R4 v4 (dev-20260531-084316) — UNIFIED CARD NORMALIZATION + <OptionCard>
// One DTO + one component feed BOTH the middle board (KanbanView) AND the right
// sidebar (CandidatesSidebar), killing the two-normalization-path defect.
// ============================================================

// normalizeOptionCardDTO: canonicalize a single v2/PLAN-shaped option into the
// fields OptionCard renders. image = cover_image || image || null (single source).
// Carries name_base/name_local so getDisplayName/getDisplayField work unchanged.
function normalizeOptionCardDTO(opt) {
  if (!opt) return null;
  // RC (iter-1 currency-display fix): editor v2-derived options carry RAW LOCAL cost
  // (CNY) + currency_local; fmtCost renders with the DISPLAY symbol (€) and documents
  // "All costs are in display currency". Convert local->display HERE — the single shared
  // DTO chokepoint feeding board OptionCards, Timeline, and Budget-detail (via
  // _displayCardFromDTO) — so every editor surface shows the CONVERTED value, byte-for-byte
  // matching the static viewer (which converts via gen._to_display_currency). cost_local
  // preserves the original local amount for any surface that legitimately needs it.
  //
  // IDEMPOTENT + NO-DOUBLE-CONVERT (codex finding #2): convert local->display IFF the
  // option carries `currency_local`. Every raw v2 option ALWAYS carries currency_local
  // (verified: 52/52 on disk; flight-meal adapter defaults it to CNY), so meals/activities/
  // accommodation options all convert. A PLAN-synthesized card (e.g.
  // preserveCurrentAccommodationOption from publishedDay.accommodation) has NO currency_local
  // and its `cost` is ALREADY display currency -> PASS THROUGH (dividing would 7.9x-understate).
  // Raw source = cost_local (set by a prior normalize) ?? cost, so re-normalizing is a no-op:
  //   raw v2:    {cost:88, currency_local:'CNY'} -> {cost:11.2, cost_local:88, currency_local:'CNY'}
  //              -> re-normalize converts cost_local(88) -> 11.2 (stable).
  //   PLAN card: {cost:507}                      -> {cost:507, cost_local:507} (no currency_local)
  //              -> re-normalize passes through 507 (stable, no division).
  const hasLocalCurrency = typeof opt.currency_local === 'string' && opt.currency_local.length > 0;
  const rawSource = typeof opt.cost_local === 'number'
    ? opt.cost_local
    : (typeof opt.cost === 'number' ? opt.cost : 0);
  const displayCost = hasLocalCurrency
    ? toDisplayCurrency(rawSource, opt.currency_local)
    : (typeof opt.cost === 'number' ? opt.cost : 0); // already-display PLAN card: no conversion
  const localCost = rawSource;
  return {
    ...opt,
    option_id: opt.option_id || null,
    name_base: opt.name_base || opt.name || '',
    name_local: opt.name_local || '',
    location_base: opt.location_base || opt.location_summary || '',
    location_local: opt.location_local || '',
    image: opt.cover_image || opt.image || null,
    cost: displayCost,
    cost_local: localCost,
    cost_display: opt.cost_display || '',
    time: opt.time || null,
  };
}

// normalizeSlotEnvelope: resolve one slot's CARD model from v2 selection state.
// Inputs carry the fallback context the cross-day resolvers (2743/2777) require.
//   { dayNum, slotId, editorDay, editorTripData, editorSelections, publishedDay, context }
// Returns { slotId, isEmpty, isAccommodation, selectedId, option (DTO|null), origin }.
// isEmpty=true ⇒ board draws an explicit empty slot (no PLAN default). This is the
// SYM1 source-root fix: render by v2 selection, not by cloned PLAN_DATA.
// MEAL_SLOT_IDS_TPL: the three meal slots that may carry primary + included.
const MEAL_SLOT_IDS_TPL = ['breakfast', 'lunch', 'dinner'];

// _slotRawOptions: the v2 options[] for a slot from the editor v2 model.
function _slotRawOptions(editorDay, slotId, isAccommodation) {
  const s = isAccommodation
    ? (editorDay && editorDay.accommodation)
    : (editorDay && editorDay.slots && editorDay.slots[slotId]);
  return (s && Array.isArray(s.options)) ? s.options : [];
}

// _includedOptions: meal-slot options carrying included:true, de-duped against the
// primary, ordered by the slot's options[] array order (R6 deterministic semantics).
function _includedOptions(editorDay, slotId, isAccommodation, primaryId) {
  if (isAccommodation || !MEAL_SLOT_IDS_TPL.includes(slotId)) return [];
  const out = [];
  const seen = new Set();
  for (const o of _slotRawOptions(editorDay, slotId, isAccommodation)) {
    if (o && o.included === true && o.option_id && o.option_id !== primaryId && !seen.has(o.option_id)) {
      seen.add(o.option_id);
      out.push(o);
    }
  }
  return out;
}

// normalizeSlotEnvelope: resolve one slot's CARD model from v2 selection state.
// Returns { slotId, isEmpty, isAccommodation, selectedId, option (DTO|null) — back-compat,
//           primary (DTO|null), included: [DTO], renderOptions: [DTO] }.
// renderOptions = primary (if any) followed by each included meal option, all DTOs.
// DISPLAY-OCCUPANCY (R2-B4/R9): a meal slot is display-EMPTY when it has no resolvable
// primary AND no included:true option, even if options[] is non-empty.
function normalizeSlotEnvelope({ dayNum, slotId, editorDay, editorTripData, editorSelections }) {
  const sel = editorSelections || {};
  const isAccommodation = slotId === 'accommodation';
  const key = dayNum + ':' + slotId;
  const slotObj = isAccommodation
    ? (editorDay && editorDay.accommodation)
    : (editorDay && editorDay.slots && editorDay.slots[slotId]);
  const locallyTouched = Object.prototype.hasOwnProperty.call(sel, key);
  const persisted = slotObj && slotObj.selected_option_id;
  let selectedId = locallyTouched ? sel[key] : persisted;
  // BUG 3 (task 20260616): an UNTOUCHED slot with no explicit selection must still render the
  // server-stamped rendered primary (rendered_primary_option_id) — else options[0] for an
  // unskipped meal/accommodation slot — so the recommended option (e.g. Jianxinyuan) shows as the
  // MAIN card in EDIT mode, not the first `included` alternate. Mirrors CandidatesSidebar's
  // effectivePrimaryId and the static viewer. A locally TOUCHED slot (incl. an explicit clear,
  // sel[key]=null) is respected verbatim — no fallback — so a deliberate clear stays empty.
  // hasExplicitPrimary: true when selectedId derives from a real stored/local selection.
  // The options[0] fallback means no user has touched the slot — any included:true options are
  // server-stored candidates, NOT user-promoted companion meals; suppress _includedOptions then.
  // rendered_primary_option_id is a display fallback stamped unconditionally by trip.py — NOT a user selection signal.
  let hasExplicitPrimary = locallyTouched || !!(slotObj && slotObj.selected_option_id);
  // BUG 3b (task 20260618): track when selectedId resolves from rendered_primary_option_id so
  // Edit 1b's suppression is NOT applied — the server-stamped primary must render in edit mode
  // just as it does in the static viewer. options[0] client fallback remains suppressed.
  let _selectedFromRenderedPrimary = false;
  if (!locallyTouched && (selectedId === undefined || selectedId === null) && slotObj) {
    if (slotObj.rendered_primary_option_id) {
      selectedId = slotObj.rendered_primary_option_id;
      _selectedFromRenderedPrimary = true;
    } else if (!slotObj.skipped && Array.isArray(slotObj.options) && slotObj.options.length) {
      selectedId = slotObj.options[0].option_id;
      // fallback path — included:true on these options is storage state, not a user companion
    }
  }
  const rawPrimary = selectedId
    ? (isAccommodation
        ? findSelectedAccommodationOption(editorDay, editorTripData, selectedId)
        : findSelectedOption(editorDay, slotId, selectedId, editorTripData))
    : null;
  const primaryDTO = rawPrimary ? normalizeOptionCardDTO(rawPrimary) : null;
  const includedRaw = hasExplicitPrimary ? _includedOptions(editorDay, slotId, isAccommodation, selectedId) : [];
  const includedDTOs = includedRaw.map(o => normalizeOptionCardDTO(o));
  const renderOptions = [];
  // rendered_primary_option_id path renders as primary role to match the static viewer appearance.
  const hasRenderableExplicitPrimary = !!primaryDTO && (hasExplicitPrimary || _selectedFromRenderedPrimary);
  if (primaryDTO) {
    primaryDTO._mealRole = hasRenderableExplicitPrimary ? 'primary' : 'candidate';
    primaryDTO._mealOrdinal = 0;
    renderOptions.push(primaryDTO);
  }
  includedDTOs.forEach((d, i) => {
    d._mealRole = hasRenderableExplicitPrimary ? 'optional' : 'candidate';
    d._mealOrdinal = i + 1;
    renderOptions.push(d);
  });
  // Edit 1b (M6 fix): suppress options[0] client-side fallback for untouched meal slots.
  // _selectedFromRenderedPrimary is EXEMPT: server-stamped authoritative primary must render
  // in edit mode (BUG 3). Accommodation fallback unchanged.
  const isMealSlot = !isAccommodation && MEAL_SLOT_IDS_TPL.includes(slotId);
  if (!hasExplicitPrimary && !_selectedFromRenderedPrimary && isMealSlot) { renderOptions.length = 0; }
  const isEmpty = renderOptions.length === 0;
  return {
    slotId, isEmpty, isAccommodation, selectedId: selectedId || null,
    option: primaryDTO, primary: primaryDTO, included: includedDTOs, renderOptions,
    hasExplicitPrimary,
  };
}

// deriveV2DisplayDay: the single v2-only day display model that REPLACES the deleted
// mergeEditorSelectionsIntoPublishedDay overlay. It reproduces the full overlay the
// deleted function supplied — the per-category budget overlay (sole Donut writer),
// day.cover, accommodation cover/check_in/check_out/stars, meal time, activity-anchor
// replacement, duplicate filtering, and cross-day fallback — but sources EVERYTHING
// from the v2 editor model (editorDay/editorTripData/editorSelections), reading NEITHER
// day.meals NOR day.meal_alternatives NOR publishedDay.meals in editor mode.
// Output is publishedDay-shaped for the Timeline/Budget consumers PLUS:
//   .renderOptions = { breakfast:[DTO], lunch:[DTO], dinner:[DTO] }  (primary + included)
// Timeline + Budget-detail meal reads consume .renderOptions[mealType], not day.meals.
function deriveV2DisplayDay({ dayNum, editorDay, editorTripData, editorSelections, publishedDay }) {
  // Viewer mode (no editorDay): return publishedDay untouched (no v2 overlay).
  if (!editorDay) return publishedDay;
  const day = publishedDay ? JSON.parse(JSON.stringify(publishedDay)) : { day: dayNum };
  // AC8 atomicity: carry the v2 day clock window (arrival_ts/departure_ts) from the raw editor
  // day onto the display day so TimelineView can clamp a grid drag-IN's derived time into the
  // same [arrival,departure] bounds the server save-boundary enforces (publishedDay from /api/trip
  // does not expose these). Without this the clamp falls back to 00:00-23:59 and an empty-grid
  // drop near the top of a flight/arrival day derives an out-of-bounds time the server rejects.
  if (editorDay) {
    if (editorDay.arrival_ts !== undefined) day.arrival_ts = editorDay.arrival_ts;
    if (editorDay.departure_ts !== undefined) day.departure_ts = editorDay.departure_ts;
  }
  // 1. Budget overlay — editorDay.budget is the authoritative per-category source.
  if (editorDay && editorDay.budget) {
    day.budget = Object.assign({}, day.budget, editorDay.budget);
  }

  // 2. Meals: derive primary + included per meal slot from v2 selection state.
  const renderOptions = {};
  day.meals = {};
  day.meal_alternatives = {};
  MEAL_SLOT_IDS_TPL.forEach(slotId => {
    const env = normalizeSlotEnvelope({ dayNum, slotId, editorDay, editorTripData, editorSelections });
    // Build PLAN-shaped DISPLAY cards from the v2 DTOs so the publishedDay-shaped consumers
    // (TimelineView, Donut, Budget-detail) keep working — and so meal `time` is preserved
    // (raw v2 DTOs have no time; _displayCardFromDTO restores the slot's PLAN time). The
    // Timeline/Budget-detail read renderOptions[], so renderOptions MUST hold display cards.
    const cards = env.renderOptions.map(d => _displayCardFromDTO(d, slotId, publishedDay));
    // Edit 8: propagate _mealRole/_mealOrdinal through _displayCardFromDTO stripping.
    // Without this, editor-mode Timeline entries have undefined _mealRole.
    cards.forEach((card, i) => { if (card && env.renderOptions[i]) { card._mealRole = env.renderOptions[i]._mealRole; card._mealOrdinal = env.renderOptions[i]._mealOrdinal; } });
    renderOptions[slotId] = cards;
    day.meals[slotId] = cards.length ? cards[0] : null;
    if (cards.length > 1) {
      day.meal_alternatives[slotId] = cards.slice(1);
    }
  });

  // 3. Accommodation: cover/check_in/check_out/stars from the v2 selected option.
  const accEnv = normalizeSlotEnvelope({ dayNum, slotId: 'accommodation', editorDay, editorTripData, editorSelections });
  if (accEnv.primary) {
    const accCard = _displayCardFromDTO(accEnv.primary, 'accommodation', publishedDay);
    const raw = accEnv.primary;
    accCard.check_in = raw.check_in || (publishedDay && publishedDay.accommodation && publishedDay.accommodation.check_in) || accCard.check_in || '';
    accCard.check_out = raw.check_out || (publishedDay && publishedDay.accommodation && publishedDay.accommodation.check_out) || accCard.check_out || '';
    accCard.stars = (raw.stars !== undefined ? raw.stars : (publishedDay && publishedDay.accommodation && publishedDay.accommodation.stars)) || 0;
    day.accommodation = accCard;
    const coverImg = raw.cover_image || raw.image || accCard.image;
    if (coverImg) day.cover = coverImg;
  } else if (Object.prototype.hasOwnProperty.call(editorSelections || {}, dayNum + ':accommodation')
             && (editorSelections || {})[dayNum + ':accommodation'] === null) {
    day.accommodation = null;
  }

  // 4. Activities: anchor-replacement + duplicate filtering from v2 selection.
  const actSlots = ['morning_activity', 'afternoon_activity', 'evening_activity'];
  const actArrays = ['attractions', 'entertainment', 'cafe', 'unscheduled_optionals'];
  actSlots.forEach(slotId => {
    const env = normalizeSlotEnvelope({ dayNum, slotId, editorDay, editorTripData, editorSelections });
    if (!env.primary) return;
    const selOpt = env.primary;
    let anchorArr = null, anchorIdx = -1;
    for (const arr of actArrays) {
      if (!day[arr]) continue;
      const idx = day[arr].findIndex(c => _matchesOption(c, selOpt));
      if (idx >= 0) { anchorArr = arr; anchorIdx = idx; break; }
    }
    if (anchorArr === null) {
      const slotOptionNames = new Set();
      (_slotRawOptions(editorDay, slotId, false)).forEach(o => {
        if (o.name) slotOptionNames.add(o.name);
        if (o.name_local) slotOptionNames.add(o.name_local);
      });
      let timedHit = null, untimedHit = null;
      for (const arr of actArrays) {
        if (!day[arr]) continue;
        for (let i = 0; i < day[arr].length; i++) {
          const c = day[arr][i];
          if ((c.name_base && slotOptionNames.has(c.name_base)) || (c.name_local && slotOptionNames.has(c.name_local))) {
            if (c.time && c.time.start && c.time.start !== '00:00') { if (!timedHit) timedHit = { arr, i }; }
            else if (!untimedHit) untimedHit = { arr, i };
          }
        }
      }
      const hit = timedHit || untimedHit;
      if (hit) { anchorArr = hit.arr; anchorIdx = hit.i; }
    }
    if (anchorArr === null) return;
    const existing = day[anchorArr][anchorIdx];
    // F8/AC5: an explicit user-edited v2 option time is AUTHORITATIVE — it must win over
    // the stale published-anchor time. Only fall back to the anchor's time when the v2
    // option carries no edited time (preserving the pre-edit positioning behavior).
    const v2Time = (selOpt && selOpt.time && selOpt.time.start && selOpt.time.end) ? selOpt.time : null;
    if (_matchesOption(existing, selOpt)) {
      existing.selected = true; existing.option_id = selOpt.option_id;
      if (v2Time) existing.time = v2Time;
    } else {
      const synth = _synthesizeCardFromV2Option(selOpt, existing);
      if (v2Time) synth.time = v2Time;
      else if (existing.time) synth.time = existing.time;
      day[anchorArr][anchorIdx] = synth;
    }
    for (const arr of actArrays) {
      if (!day[arr]) continue;
      day[arr] = day[arr].filter((c, i) => {
        if (arr === anchorArr && i === anchorIdx) return true;
        return !_matchesOption(c, selOpt);
      });
    }
  });

  day.renderOptions = renderOptions;
  return day;
}

// _displayCardFromDTO: build a PLAN-shaped meal/accommodation card from a v2 DTO so
// publishedDay-shaped consumers (TimelineView, Donut, Budget-detail) keep working
// without reading raw v2 shapes. Preserves the slot's PLAN time when the DTO omits it.
function _displayCardFromDTO(dto, slotId, publishedDay) {
  if (!dto) return null;
  const planCard = (publishedDay && publishedDay.meals && publishedDay.meals[slotId]) || null;
  const card = _synthesizeCardFromV2Option(dto, planCard || {});
  card.name_base = dto.name_base || dto.name || card.name_base || slotId;
  card.name_local = dto.name_local || card.name_local || '';
  // Numeric cost for Budget-detail/Donut: use the v2 DTO's numeric cost.
  card.cost = (typeof dto.cost === 'number') ? dto.cost : 0;
  // Preserve PLAN time when DTO lacks a meaningful time.
  if ((!card.time || (card.time.start === '00:00')) && planCard && planCard.time) {
    card.time = planCard.time;
  }
  card.option_id = dto.option_id;
  return card;
}

// OptionCard — the single card used by board ('board') and sidebar ('candidates').
// drag: STRUCTURED descriptor (NOT bare handleProps) preserving the FULL Cycle-2
// DnD surface for both engines + native gating:
//   { optionId, slotId, originSlotId, sourceSurface,        // identity
//     draggable, dragOptionId,                              // native gate inputs
//     onDragStart, onDragEnd,                               // native card handlers
//     handleProps,                                          // pointer engine (getHandleProps result)
//     slotDrop: { dataDroppable, dataDropZone, dataTargetSurface,
//                 onDragOver, onDragLeave, onDrop, onClick } // .slot-drop overlay (board) / sidebar deselect zone
//   }
// context switches ONLY: footprint, drag-handle placement, ✕ visibility, selected styling.
const OptionCard = ({ option, context, categoryColor, categoryLabel, categoryEmoji,
    isSelected, isPending, isEmpty, isOptional, isPrimary, isIncluded, emptyLabel, lang, mapProvider, drag,
    cardW, cardH, imgH, imgBg, onClear, onDelete, onClick, onMouseEnter, onMouseLeave }) => {
  const isBoard = context === 'board';
  const opt = option || {};
  const _imgH = imgH || (isBoard ? 140 : 140);
  const _imgBg = imgBg || '#f5f3ef';
  const baseStyle = isBoard
    ? { width: cardW + 'px', minWidth: cardW + 'px', height: cardH + 'px', flexShrink: 0, scrollSnapAlign: 'start' }
    : { width: '100%', maxWidth: '280px', boxSizing: 'border-box', minWidth: 0, height: '320px', flexShrink: 0, marginBottom: '8px' };
  const selectedShadow = '0 0 0 2px #45b26b, 0 1px 3px rgba(0,0,0,0.06)';
  const restShadow = isOptional
    ? '0 1px 3px rgba(0,0,0,0.04)'
    : (isBoard && isSelected ? '0 1px 3px rgba(0,0,0,0.06), 0 0 0 1.5px ' + categoryColor + '33' : '0 1px 3px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.03)');
  const cardStyle = {
    ...baseStyle,
    background: isPending ? '#eff6ff' : '#fff', borderRadius: '8px',
    border: isOptional ? '1.5px dashed ' + categoryColor + '80'
      : isSelected ? '1.5px solid ' + categoryColor
      : isPending ? '2px solid #3b82f6' : 'none',
    boxShadow: isSelected ? selectedShadow : restShadow,
    overflow: 'hidden', transition: 'box-shadow .15s, transform .15s', cursor: 'pointer',
    display: 'flex', flexDirection: 'column', position: 'relative',
  };
  const _hoverOn = (e) => { e.currentTarget.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1), 0 0 0 1px rgba(74,144,217,0.2)'; e.currentTarget.style.transform = 'translateY(-2px)'; if (onMouseEnter) onMouseEnter(e); };
  const _hoverOff = (e) => { e.currentTarget.style.boxShadow = isSelected ? selectedShadow : restShadow; e.currentTarget.style.transform = 'translateY(0)'; if (onMouseLeave) onMouseLeave(e); };
  const sd = (drag && drag.slotDrop) || null;
  // Whole-card pointer-drag (Notion parity): in the default pointer engine (NOT native),
  // make the entire card a drag initiator by spreading handleProps.onPointerDown onto the
  // card root. The 5px/8px movement threshold in onPointerDown ensures a plain click without
  // movement does NOT start a drag, so onClick (select/detail) still fires. touchAction:'pan-y'
  // keeps vertical column scrolling on touch while a deliberate drag past threshold initiates.
  const _pointerEngine = (typeof window !== 'undefined') && (window.TRIP_EDITOR_DND_ENGINE !== 'native');
  const _wholeCardDrag = _pointerEngine && drag && drag.dragOptionId && drag.handleProps && drag.handleProps.onPointerDown;
  const _rootStyle = _wholeCardDrag ? { ...cardStyle, touchAction: 'pan-y', cursor: 'grab' } : cardStyle;
  const mealRole = isPrimary ? 'primary' : (isIncluded || isOptional) ? 'optional' : 'candidate';
  const _isMealSlotCard = isBoard && !isEmpty && !!(drag && drag.slotId && ['breakfast','lunch','dinner'].includes(drag.slotId));
  return (
    <div className={isBoard ? undefined : 'card-candidate'} style={_rootStyle}
      data-slot-card={isBoard ? (isSelected || (drag && drag.dragOptionId) ? 'primary' : 'alternative') : undefined}
      data-candidates-surface={isBoard ? undefined : ''}
      data-meal-role={_isMealSlotCard ? mealRole : undefined}
      data-slot-id={(drag && drag.slotId) || undefined}
      data-origin-slot-id={(drag && drag.originSlotId) || undefined}
      data-option-id={(drag && drag.dragOptionId) || undefined}
      data-flip-key={(drag && drag.dragOptionId) || undefined}
      draggable={drag ? drag.draggable : undefined}
      onDragStart={drag ? drag.onDragStart : undefined}
      onDragEnd={drag ? drag.onDragEnd : undefined}
      onPointerDown={_wholeCardDrag ? drag.handleProps.onPointerDown : undefined}
      onClick={onClick ? (e) => { if (_ptrDragJustEnded) return; onClick(e); } : undefined}
      onMouseEnter={_hoverOn}
      onMouseLeave={_hoverOff}
    >
      {drag && drag.dragOptionId && drag.handleProps && <DragHandle isMobileViewport={drag.isMobileViewport} handleProps={drag.handleProps} />}
      {/* U11: primary vs included visual distinction on multi-meal board cards. */}
      {isBoard && !isEmpty && (isPrimary || isIncluded) && (
        <span data-meal-role={mealRole} data-meal-role-badge="" style={{
          position: 'absolute', top: '6px', left: '6px', zIndex: 4,
          padding: '1px 7px', borderRadius: '10px', fontSize: '10px', fontWeight: 700,
          letterSpacing: '0.3px', textTransform: 'uppercase',
          background: isPrimary ? categoryColor : '#fff',
          color: isPrimary ? '#fff' : categoryColor,
          border: isPrimary ? 'none' : '1.5px solid ' + categoryColor,
        }}>
          {isPrimary ? (lang === 'local' ? '主' : 'Primary') : 'Optional/可选'}
        </span>
      )}
      {/* ✕ clear control — board primary non-empty only; above .slot-drop overlay */}
      {isBoard && onClear && !isEmpty && (drag && drag.dragOptionId) && (
        <button type="button" aria-label="clear" data-clear-slot={(drag && drag.slotId) || ''}
          onClick={(e) => { e.preventDefault(); e.stopPropagation(); onClear(); }}
          onMouseDown={(e) => { e.preventDefault(); e.stopPropagation(); }}
          style={{ position: 'absolute', top: '6px', left: '6px', zIndex: 3, width: '24px', height: '24px', borderRadius: '50%', border: 'none', background: 'rgba(0,0,0,0.45)', color: '#fff', fontSize: '14px', lineHeight: '24px', textAlign: 'center', cursor: 'pointer', padding: 0 }}>✕</button>
      )}
      {/* 🗑 delete-option control (task 20260616) — removes a NON-selected candidate/alternate
          option entirely. Never shown on a selected/primary card (the server rejects deleting the
          selected option; the caller passes onDelete only for deletable cards). Top-RIGHT so it
          never overlaps the top-left ✕ clear / role badge. Above the .slot-drop overlay. */}
      {onDelete && !isEmpty && !isPrimary && !(isSelected && !isIncluded) && (
        <button type="button" aria-label={lang === 'local' ? '删除候选项' : 'Delete option'}
          data-delete-option={(drag && drag.dragOptionId) || ''}
          title={lang === 'local' ? '删除此候选项' : 'Delete this option'}
          onClick={(e) => { e.preventDefault(); e.stopPropagation(); onDelete(); }}
          onMouseDown={(e) => { e.preventDefault(); e.stopPropagation(); }}
          onPointerDown={(e) => { e.stopPropagation(); }}
          style={{ position: 'absolute', top: '6px', right: '6px', zIndex: 5, width: '24px', height: '24px', borderRadius: '50%', border: 'none', background: 'rgba(192,57,43,0.92)', color: '#fff', fontSize: '13px', lineHeight: '24px', textAlign: 'center', cursor: 'pointer', padding: 0 }}>🗑</button>
      )}
      <div style={{ width: '100%', height: _imgH + 'px', overflow: 'hidden', background: _imgBg, flexShrink: 0 }}>
        {!isEmpty && opt.image && <img src={opt.image} alt="" draggable={false} style={{ width: '100%', height: '100%', objectFit: 'cover' }} onError={e => { e.target.style.display = 'none'; }} />}
      </div>
      {isEmpty && (
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '60px', color: '#9ca3af', fontSize: '12px', fontStyle: 'italic' }}>
          {emptyLabel || categoryLabel}
        </div>
      )}
      <div style={{ padding: '8px 10px', flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
        <div style={{ fontSize: '10px', fontWeight: '700', color: categoryColor, textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '3px', display: 'flex', alignItems: 'center', gap: '4px', flexShrink: 0 }}>
          <span>{categoryEmoji} {categoryLabel}</span>
          {isOptional && <span style={{ padding: '1px 4px', background: '#f5f5f3', borderRadius: '3px', fontSize: '9px', color: '#9b9a97', border: '1px solid #e0e0e0' }}>{L('optional', lang)}</span>}
        </div>
        {!isEmpty && (
        <div style={{ fontSize: '13px', fontWeight: '600', color: '#37352f', marginBottom: '3px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', flexShrink: 0 }}>
          {getDisplayName(opt, lang)}
          <RedNoteLink name={opt.name_local || opt.name_base} />
        </div>
        )}
        {!isEmpty && (
        <div style={{ fontSize: '11px', color: '#6b6b6b', lineHeight: 1.6, flexShrink: 0 }}>
          {opt.time && opt.time.start && opt.time.start !== '00:00' && <div>{opt.time.start} – {opt.time.end}{opt.cost > 0 ? ' · ' + fmtCost(opt.cost, undefined, lang) : (opt.cost_display ? ' · ' + opt.cost_display : '')}</div>}
          {!(opt.time && opt.time.start) && opt.cost > 0 && <div>{fmtCost(opt.cost, undefined, lang)}</div>}
          {!(opt.time && opt.time.start) && !(opt.cost > 0) && opt.cost_display && <div>{opt.cost_display}</div>}
          {getDisplayField(opt, 'cuisine', lang) && <div style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{getDisplayField(opt, 'cuisine', lang)}</div>}
          {getDisplayField(opt, 'type', lang) && <div style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{getDisplayField(opt, 'type', lang)}</div>}
          {(opt.location_base || opt.location_local) && <div style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}><MapLink item={opt} lang={lang} mapProvider={mapProvider} /></div>}
        </div>
        )}
        {!isEmpty && (
        <div style={{ fontSize: '11px', color: '#9b9a97', lineHeight: 1.5, flex: 1, overflow: 'hidden', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', marginTop: '3px' }}>
          {lang === 'local' && opt.notes_local ? opt.notes_local : opt.notes_base}
        </div>
        )}
        {/* M3 (stress-test): mobile tap-to-add. On mobile the Timeline + Candidates tabs are
            mutually-exclusive full-screen views, so a cross-tab drag is impractical and there is
            no drop target. This explicit affordance lets a mobile user add the candidate into its
            own slot (set-primary if empty, included alternate if occupied — via the same
            applyEditorSelection bridge the desktop tap-to-place uses) at the slot's default time
            (editable afterward via the ✎ time editor). Shown only when a mobile-add handler is
            wired (candidates context, mobile viewport). */}
        {!isEmpty && drag && drag.onMobileAdd && (
          <button type="button" data-mobile-add-candidate={(drag && drag.slotId) || ''}
            onClick={(e) => { e.preventDefault(); e.stopPropagation(); drag.onMobileAdd(); }}
            onPointerDown={(e) => { e.stopPropagation(); }}
            style={{ marginTop: '8px', width: '100%', padding: '9px 10px', flexShrink: 0,
              background: '#176d2c', color: '#fff', border: 'none', borderRadius: '6px',
              fontSize: '13px', fontWeight: 600, cursor: 'pointer',
              // ABOVE the .slot-drop deselect overlay (inset:0, last child) so the tap reaches the
              // button rather than the overlay (which would otherwise intercept the pointer event).
              position: 'relative', zIndex: 3 }}>
            + {lang === 'local' ? '添加到时间线' : 'Add to timeline'}
          </button>
        )}
      </div>
      {sd && (
        <div className="slot-drop" data-slot-id={(drag && drag.slotId) || undefined}
          data-droppable={sd.dataDroppable}
          data-drop-zone={sd.dataDropZone || undefined}
          data-target-surface={sd.dataTargetSurface || undefined}
          aria-hidden="true"
          style={{ position: 'absolute', inset: 0, background: 'transparent', transition: 'background 0.12s' }}
          onDragOver={sd.onDragOver}
          onDragLeave={sd.onDragLeave}
          onDrop={sd.onDrop}
          onClick={sd.onClick}
        />
      )}
    </div>
  );
};

// Module-level drag state for onDragOver compatibility gate (AC18/FIX3)
let currentDragSlotId = null;

// _isCompatible: meal slots are mutually compatible; non-meal require exact match (M18)
const MEAL_SLOTS = new Set(['breakfast', 'lunch', 'dinner', 'meals-any']);
// SKIPPABLE_MEAL_SLOTS: the 3 real persisted meal slots per day.schema.json (additionalProperties:false).
// MEAL_SLOTS includes the UI-only 'meals-any' pseudo-slot which is NOT a valid persisted key — a skip
// mutation with slot:'meals-any' would write a schema-forbidden slots['meals-any'] key on disk.
// Therefore ALL backend `skip` mutation emits must be gated by SKIPPABLE_MEAL_SLOTS, not MEAL_SLOTS.
const SKIPPABLE_MEAL_SLOTS = new Set(['breakfast', 'lunch', 'dinner']);
// buildSkipMuts: produce de-duplicated, SKIPPABLE_MEAL_SLOTS-filtered skip mutations
// with the canonical payload shape {type:'skip', slot, extra:{skipped:false, skipped_reason:null}}.
// Returns [] when no input id is a valid persisted meal slot (filter no-ops for non-meal callers).
const buildSkipMuts = (...ids) => {
  const seen = new Set();
  const muts = [];
  for (const id of ids) {
    if (!id || !SKIPPABLE_MEAL_SLOTS.has(id) || seen.has(id)) continue;
    seen.add(id);
    muts.push({ type: 'skip', slot: id, extra: { skipped: false, skipped_reason: null } });
  }
  return muts;
};
function _isCompatible(srcSlotId, tgtSlotId) {
  if (MEAL_SLOTS.has(srcSlotId) && MEAL_SLOTS.has(tgtSlotId)) return true;
  return srcSlotId === tgtSlotId;
}

// R3 / AC11 v3 — codex F9: success flash on the stable slot card (which survives
// React commits), not the .slot-drop overlay (which may unmount). 600 ms window.
function _flashSuccess(slotId) {

  const els = document.querySelectorAll('[data-slot-card="primary"][data-slot-id="' + slotId + '"], [data-timeline-entry][data-slot-id="' + slotId + '"]');
  els.forEach(el => {
    el.setAttribute('data-drop-success', '');
    setTimeout(() => { try { el.removeAttribute('data-drop-success'); } catch (_) {} }, 600);
  });
}

// AC11 fix-pass v2 — reject flash on the .slot-drop overlay during onDragOver
// for incompatible drags. dragover fires many times/sec; debounce so the
// attribute is set+reset at most once per ~500ms to avoid restarting the
// animation every frame. Stamp the element with __rejectAt to track timing.
function _flashReject(el) {
  if (!el || typeof document === 'undefined') return;
  // Already flashing? skip — let the existing 400ms animation finish.
  if (el.hasAttribute('data-drop-reject')) return;
  const now = Date.now();
  // Throttle: ignore re-triggers within 500ms of last clear
  if (el.__rejectAt && (now - el.__rejectAt) < 500) return;
  el.__rejectAt = now;
  el.setAttribute('data-drop-reject', '');
  setTimeout(() => {
    try { el.removeAttribute('data-drop-reject'); } catch (_) {}
  }, 400);
}

// CandidatesSidebar component: fixed right panel (always active)
const CandidatesSidebar = ({ editorTripData, publishedDay, lang, mapProvider, editorSelections, saveMutations, undoRecord: _sbUndoRecord,

  // Cycle-2: Pointer DnD integration for candidate cards

    onDrop: (rawDropIntent) => {

      borderLeft: inlineMode ? 'none' : '1px solid #e5e7eb', zIndex: inlineMode ? undefined : 100,

  const isMealSlotOccupied = (slotId, draggedOptionId) => {

    <div id="candidates-groups" style={{
      position: inlineMode ? 'static' : 'fixed', right: 0, top: 0, bottom: 0, width: inlineMode ? '100%' : '300px',
      overflowY: inlineMode ? 'visible' : 'auto', background: 'white',
      borderLeft: inlineMode ? 'none' : '1px solid #e5e7eb', zIndex: inlineMode ? undefined : 100,
      fontFamily: "ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif",
      padding: '16px 12px'

      <div style={{ fontSize: '12px', color: '#9b9a97' }}>{lang === 'local' ? '今日无候选项。' : 'No candidates for this day.'}</div>

      lunch: lang === 'local' ? '午餐' : 'Lunch',
      dinner: lang === 'local' ? '晚餐' : 'Dinner',

  const effectivePrimaryId = (slotId, slot) => {

    // option (if present), else options[0] for an unskipped meal/accommodation slot, else null.
    // This is EXACTLY the server resolver's precedence for the client-known case — the only
    // branch the client cannot reproduce is the legacy-name match for STALE-selection slots,
    // which only applies to UNTOUCHED slots (see below).
    const localDerivedPrimary = () => {

      const resolved = resolveSelectionLocal(dayNum + ':' + slotId, slot.selected_option_id);

    // rendered_primary_option_id is STALE for the candidate sidebar — it still names the
    // pre-select primary. For a TOUCHED slot the rendered primary is simply selected-else-options[0],
    // which the client computes correctly, so the delete-control visibility flips immediately with
    // NO refetch. UNTOUCHED slots keep the server stamp verbatim, preserving the stale-selection
    // legacy-name-match branch the client cannot reproduce.
    const locallyTouched = Object.prototype.hasOwnProperty.call(editorSelections || {}, dayNum + ':' + slotId);
    if (Object.prototype.hasOwnProperty.call(slot, 'rendered_primary_option_id') && !locallyTouched) {

    }

  };

  // in ANY activity slot is hidden from the sidebar everywhere (mirrors isMealSelected),

  const isActivitySelected = (optionId) => activitySlots.some(sid => {

        if (!dayEntry || !dayEntry.slots) return prev;

  const makeCandidateDrag = (rawOpt, slotId, originSlotId, name) => ({

    borderLeft: inlineMode ? 'none' : '1px solid #e5e7eb', zIndex: inlineMode ? undefined : 100,

  };

      data-drop-zone="sidebar-candidate"
      data-target-surface="sidebar"
      data-droppable="true"

        {lang === 'local' ? '候选项 — 第' + dayNum + '天' : 'Candidates — Day ' + dayNum}

        return (
          <div style={{ padding: '8px 12px' }}>

              {accLabel !== 'accommodation' ? accLabel : (lang === 'local' ? '住宿' : 'Accommodation')}
            </div>

              const isSelected = selectedAccId === rawOpt.option_id;
              const isPending = pendingSelection && pendingSelection.optionId === rawOpt.option_id && pendingSelection.slotId === 'accommodation';

              const accDrag = makeCandidateDrag(rawOpt, 'accommodation', 'accommodation', getDisplayName(opt, lang));
              return (
                <OptionCard key={rawOpt.option_id || oi} context="candidates"
                  option={normalizeOptionCardDTO(rawOpt)}
                  categoryColor="#27ae60" categoryEmoji="🏨"
                  categoryLabel={accLabel !== 'accommodation' ? accLabel : (lang === 'local' ? '住宿' : 'Accommodation')}

                  lang={lang} mapProvider={mapProvider} drag={accDrag}

                  onClick={() => {
                    if (isPending) { setPendingSelection && setPendingSelection(null); return; }
                    setPendingSelection && setPendingSelection({ optionId: rawOpt.option_id, slotId: 'accommodation', originSlotId: 'accommodation' });
