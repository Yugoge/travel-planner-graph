      {/* Unified Meals group (M19) */}
      {mealsGroup.length > 0 && (() => {
        const mealsLabel = L('meals', lang);
        return (
        <div style={{ padding: '8px 12px' }}>
          <div style={{ fontSize: '10px', fontWeight: '700', color: '#6b6b6b', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '6px' }}>
            {mealsLabel !== 'meals' ? mealsLabel : (lang === 'local' ? '餐饮' : 'Meals')}
          </div>
          {mealsGroup.map((rawOpt, oi) => {
            const opt = normalizeOptionCardDTO(rawOpt);
            const slotId = rawOpt._originSlotId;
            // R8 composite identity: hide only when THIS option is primary/included IN ITS OWN
            // slot; the same option_id under another meal slot stays independently renderable.
            const isSelected = isMealHiddenInSlot(rawOpt.option_id, slotId);
            if (isSelected) return null;
            // BUG 3: suppress the 🗑 control on the EFFECTIVE rendered primary (options[0] of a
            // null-selection unskipped meal slot) — the server rejects deleting it.
            const isEffectivePrimary = effectivePrimaryId(slotId, slots[slotId]) === rawOpt.option_id;
            // Pending state is slot-scoped too (composite identity).
            const isPending = pendingSelection && pendingSelection.optionId === rawOpt.option_id
              && pendingSelection.originSlotId === slotId;
            const mealDrag = makeCandidateDrag(rawOpt, slotId, slotId, getDisplayName(opt, lang));
            return (
              <OptionCard key={dayNum + ':' + slotId + ':' + (rawOpt.option_id || oi)} context="candidates"
                option={normalizeOptionCardDTO(rawOpt)}
                categoryColor="#e67e22" categoryEmoji="🍽️"
                categoryLabel={getSlotLabel(slotId)}
                isSelected={isSelected} isPending={isPending} isEmpty={false}
                lang={lang} mapProvider={mapProvider} drag={mealDrag}
                onDelete={isEffectivePrimary ? undefined : () => deleteCandidate(slotId, rawOpt.option_id)}
                onClick={() => {
                  if (isPending) { setPendingSelection && setPendingSelection(null); return; }
                  setPendingSelection && setPendingSelection({ optionId: rawOpt.option_id, slotId: slotId, originSlotId: slotId });
                }}
              />
            );
          })}
        </div>
        );
      })()}

      {/* Activity slots */}
      {activitySlots.map(slotId => {
        const slot = slots[slotId];
        if (!slot || !slot.options || slot.options.length === 0) return null;
        const key = dayNum + ':' + slotId;
        const selectedId = resolveSelectionLocal(key, slot.selected_option_id);
        return (
          <div key={slotId} style={{ padding: '8px 12px' }}>
            <div style={{ fontSize: '10px', fontWeight: '700', color: '#6b6b6b', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '6px' }}>
              {getSlotLabel(slotId)}
            </div>
            {slot.options.map((rawOpt, oi) => {
              const opt = normalizeOptionCardDTO(rawOpt);
              const isSelected = selectedId === rawOpt.option_id;
              const isPending = pendingSelection && pendingSelection.optionId === rawOpt.option_id && pendingSelection.slotId === slotId;
              // R4 v4 move-semantics (codex-1): selected activity lives on the board — hide it
              // from EVERY activity slot in the sidebar, not just its own slot.
              if (isSelected || isActivitySelected(rawOpt.option_id)) return null;
              const actDrag = makeCandidateDrag(rawOpt, slotId, slotId, getDisplayName(opt, lang));
              return (
                <OptionCard key={rawOpt.option_id || oi} context="candidates"
                  option={normalizeOptionCardDTO(rawOpt)}
                  categoryColor="#3498db" categoryEmoji="📍"
                  categoryLabel={getSlotLabel(slotId)}
                  isSelected={isSelected} isPending={isPending} isEmpty={false}
                  lang={lang} mapProvider={mapProvider} drag={actDrag}
                  onDelete={() => deleteCandidate(slotId, rawOpt.option_id)}
                  onClick={() => {
                    if (isPending) { setPendingSelection && setPendingSelection(null); return; }
                    setPendingSelection && setPendingSelection({ optionId: rawOpt.option_id, slotId: slotId, originSlotId: slotId });
                  }}
                />
              );
            })}
          </div>
        );
      })}
    </div>
  );
};

// ============================================================
// INGEST (Cycle 3) — paste URL/RedNote link -> preview -> review -> Add candidate
// ============================================================
// IngestPanel: a self-contained "Add from link" surface. It scrapes server-side
// (POST /api/ingest, draft-only), renders an editable preview, gates Add until the
// required fields/branch conditions are satisfied (F2 multi-item, F8 city-mismatch,
// thin page), offers optional cover-image selection, commits via POST
// /api/ingest/commit, inspects the add_option mutation_results (a rejected Add is an
// error, NOT a silent success), and on success refetches so the candidate appears +
// is draggable. Every failure branch is a first-class actionable state — never a
// silent no-op.
const INGEST_ADDABLE_SLOTS = ['breakfast','lunch','dinner','morning_activity','afternoon_activity','evening_activity','accommodation'];
const INGEST_ACTIVITY_SLOTS = ['morning_activity','afternoon_activity','evening_activity'];
const INGEST_ACTIVITY_CATS = ['attractions','cafe','entertainment','shopping'];

const IngestPanel = ({ tripId, dayNum, editorSession, lang, onAdded, onClose }) => {
  const [url, setUrl] = useState('');
  const [slot, setSlot] = useState('morning_activity');
  const [activityCat, setActivityCat] = useState('attractions');
  const [busy, setBusy] = useState(false);
  const [draft, setDraft] = useState(null);          // {draft_id, preview, option, branch, ...}
  const [branchMsg, setBranchMsg] = useState(null);  // {kind:'blocked'|'manual_required'|'error'|'expired', detail, branch}
  const [edited, setEdited] = useState({});          // user-edited whitelisted fields
  const [chosenImage, setChosenImage] = useState(null);
  const [chosenItem, setChosenItem] = useState(null);
  const [cityConfirmed, setCityConfirmed] = useState(false);
  const [result, setResult] = useState(null);        // {status:'added'|'rejected', detail, where}
  // Multi-candidate (小红书 list-note) state: a list of independently-addable candidates,
  // each {draft_id, item_id, option, preview} from the server; addState tracks per-candidate
  // add status ('idle'|'adding'|'added'|'rejected') keyed by draft_id.
  const [multi, setMulti] = useState(null);          // {candidates:[...], note_title, canonical_url}
  const [multiAddState, setMultiAddState] = useState({});
  // F8-MULTI: per-candidate city-mismatch confirmation, keyed by draft_id — mirrors the
  // single-URL `cityConfirmed`. A candidate whose server flagged requires_city_confirm is
  // NOT auto-confirmed; the user must tick its own checkbox before that candidate can Add.
  const [multiCityConfirmed, setMultiCityConfirmed] = useState({});
  const isLocal = lang === 'local';
  const t = (zh, en) => (isLocal ? zh : en);
  const isActivity = INGEST_ACTIVITY_SLOTS.includes(slot);

  const ingestHeaders = { 'Content-Type': 'application/json', 'X-Editor-Session': editorSession };

  const resetDraftState = () => {
    setDraft(null); setEdited({}); setChosenImage(null); setChosenItem(null);
    setCityConfirmed(false); setResult(null); setBranchMsg(null);
    setMulti(null); setMultiAddState({}); setMultiCityConfirmed({});
  };

  const cleanupDraft = useCallback((dId) => {
    if (!dId) return;
    fetch('/api/ingest/cleanup', { method: 'POST', headers: ingestHeaders,
      body: JSON.stringify({ draft_id: dId }) }).catch(() => {});
  }, [editorSession]);

  // Changing the url/slot/activity-category while a manual_required branch is showing
  // would otherwise let the manual Add commit the OLD server-minted draft's target
  // (a silent wrong-target add). Discard the stale branch + its orphaned draft
  // so the next Scrape mints a draft matching the new target.
  const onTargetChange = (setter) => (v) => {
    if (branchMsg) {
      if (branchMsg.draft_id) cleanupDraft(branchMsg.draft_id);
      setBranchMsg(null);
    }
    setter(v);
  };

  const doScrape = async () => {
    if (!url.trim()) { setBranchMsg({ kind: 'error', detail: t('请粘贴一个链接','paste a link first') }); return; }
    resetDraftState();
    setBusy(true);
    try {
      const body = { trip_id: tripId, day: dayNum, slot, url: url.trim() };
      if (isActivity) body.activity_category = activityCat;
      const r = await fetch('/api/ingest', { method: 'POST', headers: ingestHeaders, body: JSON.stringify(body) });
      const data = await r.json();
      if (r.status === 403) { setBranchMsg({ kind: 'error', detail: t('会话校验失败','session check failed') }); return; }
      if (r.status === 413) { setBranchMsg({ kind: 'error', detail: t('请求过大','request too large') }); return; }
      if (data.status === 'blocked') {
        setBranchMsg({ kind: 'blocked', branch: data.branch, detail: data.detail || t('该链接被安全策略拦截','link blocked by safety policy') });
        return;
      }
      if (data.status === 'manual_required' || data.status === 'needs_render') {
        // First-class actionable branch (rednote auth / timeout / 429 / unsupported MIME /
        // interstitial / SPA). Offer manual-entry that still records the URL citation.
        // The server now mints a real MANUAL draft for these branches and returns its
        // draft_id — the manual Add commits THAT draft, never null.
        setBranchMsg({ kind: 'manual_required', branch: data.branch, detail: data.detail,
                       canonical_url: data.canonical_url, draft_id: data.draft_id || null });
        return;
      }
      if (data.status === 'multi_preview') {
        // A 小红书 list-note extracted into N independently-addable candidates.
        setMulti(data);
        const init = {};
        (data.candidates || []).forEach(c => { init[c.draft_id] = 'idle'; });
        setMultiAddState(init);
      } else if (data.status === 'preview') {
        setDraft(data);
        if (data.preview && data.preview.images && data.preview.images.length === 1) {
          setChosenImage(data.preview.images[0].id); // single image -> preselect, user may decline
        }
      } else if (data.status === 'error') {
        setBranchMsg({ kind: 'error', detail: data.detail || t('抓取失败','scrape failed') });
      }
    } catch (e) {
      setBranchMsg({ kind: 'error', detail: t('网络错误，请重试','network error, retry') });
    } finally {
      setBusy(false);
    }
  };

  const previewVal = (field) => {
    if (Object.prototype.hasOwnProperty.call(edited, field)) return edited[field];
    return (draft && draft.option && draft.option.normalized && draft.option.normalized[field]) || '';
  };
  const setVal = (field, v) => setEdited(prev => ({ ...prev, [field]: v }));

  const multiItem = draft && draft.preview && draft.preview.multi_item;
  const thinPage = draft && draft.preview && draft.preview.thin;
  const needsCityConfirm = draft && draft.preview && draft.preview.requires_city_confirm;

  // Add gating (F2/F8/thin): name+why required; multi-item requires an item pick;
  // city-mismatch (F8) requires explicit confirm before Add is enabled.
  const nameOk = String(previewVal('name') || '').trim().length > 0;
  const whyOk = String(previewVal('why_fits_user') || (draft && draft.option && draft.option.normalized.why_fits_user) || '').trim().length > 0;
  const itemOk = !multiItem || !!chosenItem;
  const cityOk = !needsCityConfirm || cityConfirmed;
  const addEnabled = !!draft && !busy && !result && nameOk && whyOk && itemOk && cityOk;

  const doAdd = async () => {
    if (!draft) return;
    setBusy(true);
    try {
      const userEdits = {};
      ['name','name_local','location_summary','why_fits_user','cost','currency_local'].forEach(f => {
        if (Object.prototype.hasOwnProperty.call(edited, f)) userEdits[f] = edited[f];
      });
      const body = {
        draft_id: draft.draft_id,
        selected_item_id: chosenItem || undefined,
        selected_image_id: chosenImage || undefined,
        user_edited_fields: userEdits,
        city_confirmed: needsCityConfirm ? !!cityConfirmed : undefined,
      };
      const r = await fetch('/api/ingest/commit', { method: 'POST', headers: ingestHeaders, body: JSON.stringify(body) });
      const data = await r.json();
      if (r.status === 409 && data.code === 'draft_expired') {
        // F5: draft expired during review — visible, never silent. Carry the typed input
        // onto the expired banner so the "input preserved" claim is HONEST: the
        // user literally sees + can re-use what they typed, instead of a silent discard.
        const preserved = { ...(draft.option && draft.option.normalized ? {
          name: draft.option.normalized.name, why_fits_user: draft.option.normalized.why_fits_user,
          location_summary: draft.option.normalized.location_summary } : {}), ...edited };
        setBranchMsg({ kind: 'expired', preserved,
          detail: t('草稿已过期，请重新抓取。你刚才填写的内容已保留如下，可复制后重试。',
                    'Draft expired — re-scrape. Your typed input is preserved below; copy it and retry.') });
        setDraft(null);
        return;
      }
      if (data.status === 'added' || data.status === 'updated_existing') {
        setResult({ status: 'added', where: data.where, detail: data.detail, updated: data.status === 'updated_existing' });
        // Refetch so the candidate appears + is draggable.
        if (onAdded) await onAdded();
      } else if (data.status === 'rejected') {
        // add_option failure rides inside HTTP 200 — surface it as an error.
        setResult({ status: 'rejected', detail: data.detail || data.mutation_results });
      } else if (data.status === 'error') {
        setResult({ status: 'rejected', detail: data.detail });
      } else {
        setResult({ status: 'rejected', detail: t('未知响应','unexpected response') });
      }
    } catch (e) {
      setResult({ status: 'rejected', detail: t('网络错误','network error') });
    } finally {
      setBusy(false);
    }
  };

  // Add ONE candidate from a 小红书 list-note. Each candidate has its own server draft, so
  // the commit goes through the SAME /api/ingest/commit path as a single-URL ingest. The
  // city-mismatch gate (F8-MULTI) is NEVER auto-confirmed: a candidate the server flagged
  // requires_city_confirm sends the user's ACTUAL per-candidate choice (multiCityConfirmed
  // keyed by draft_id), mirroring the single-URL path. If confirm is required but the user
  // has not ticked it, the Add is blocked here (and the button is disabled) — never silently true.
  const doAddCandidate = async (cand) => {
    if (!cand || !cand.draft_id) return;
    if (cand.requires_city_confirm && !multiCityConfirmed[cand.draft_id]) return;
    setMultiAddState(prev => ({ ...prev, [cand.draft_id]: 'adding' }));
    try {
      const body = {
        draft_id: cand.draft_id,
        city_confirmed: cand.requires_city_confirm ? !!multiCityConfirmed[cand.draft_id] : undefined,
      };
      const r = await fetch('/api/ingest/commit', { method: 'POST', headers: ingestHeaders, body: JSON.stringify(body) });
      const data = await r.json();
      if (data.status === 'added' || data.status === 'updated_existing') {
        setMultiAddState(prev => ({ ...prev, [cand.draft_id]: 'added' }));
        if (onAdded) await onAdded(); // refetch so the new candidate is draggable
      } else {
        setMultiAddState(prev => ({ ...prev, [cand.draft_id]: 'rejected' }));
      }
    } catch (e) {
      setMultiAddState(prev => ({ ...prev, [cand.draft_id]: 'rejected' }));
    }
  };

  // Cleanup EVERY un-added candidate draft when the multi list is dismissed, so the
  // server GCs the unchosen drafts + their images (no orphaned drafts).
  // F3: skip a candidate whose Add is still in-flight ('adding') — GC'ing its draft
  // here would race the live /api/ingest/commit and delete the draft underneath itself.
  // Only drafts that are neither 'added' nor 'adding' are safe to GC on close.
  const cleanupMultiDrafts = useCallback(() => {
    if (!multi || !multi.candidates) return;
    multi.candidates.forEach(c => {
      const st = multiAddState[c.draft_id];
      if (st !== 'added' && st !== 'adding') cleanupDraft(c.draft_id);
    });
  }, [multi, multiAddState, cleanupDraft]);

  const closePanel = () => {
    if (multi) cleanupMultiDrafts();
    if (draft && draft.draft_id && (!result || result.status !== 'added')) cleanupDraft(draft.draft_id);
    // On the manual_required banner the server-minted draft has NOT been promoted to
    // `draft` yet — its id lives on branchMsg.draft_id. Without this, closing the panel
    // from that banner leaks the orphaned manual draft (matches the spec "preview/panel
    // closed without Add → draft GC'd" branch).
    if (!draft && branchMsg && branchMsg.draft_id) cleanupDraft(branchMsg.draft_id);
    if (onClose) onClose();
  };

  const fieldStyle = { width: '100%', padding: '7px 9px', border: '1px solid #e0dfdc', borderRadius: '6px', fontSize: '13px', marginTop: '3px', boxSizing: 'border-box' };
  const labelStyle = { fontSize: '11px', color: '#6b6b6b', fontWeight: 600, marginTop: '8px', display: 'block' };

  return (
    <div data-ingest-panel="" style={{ background: '#fff', border: '1px solid #ebeae8', borderRadius: '10px', padding: '14px', boxShadow: '0 4px 18px rgba(0,0,0,0.08)' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
        <strong style={{ fontSize: '14px', color: '#37352f' }}>{t('从链接添加','Add from link')}</strong>
        <button data-ingest-close="" onClick={closePanel} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', color: '#9b9a97' }}>✕</button>
      </div>

      {/* paste + target picker (F1/F9/F12 — only addable slots; meals-any NOT offered) */}
      {!draft && !multi && (
        <div>
          <label style={labelStyle}>{t('网页 / 小红书链接','Page / RedNote URL')}</label>
          <input data-ingest-url="" type="text" value={url} placeholder="https://… / 小红书"
            onChange={e => onTargetChange(setUrl)(e.target.value)} style={fieldStyle} />
          <label style={labelStyle}>{t('目标位置','Target slot')} (Day {dayNum})</label>
          <select data-ingest-slot="" value={slot} onChange={e => onTargetChange(setSlot)(e.target.value)} style={fieldStyle}>
            {INGEST_ADDABLE_SLOTS.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
          {isActivity && (
            <div>
              <label style={labelStyle}>{t('活动类别（活动位必填）','Activity category (required)')}</label>
              <select data-ingest-actcat="" value={activityCat} onChange={e => onTargetChange(setActivityCat)(e.target.value)} style={fieldStyle}>
                {INGEST_ACTIVITY_CATS.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          )}
          <button data-ingest-scrape="" onClick={doScrape} disabled={busy} style={{ marginTop: '12px', width: '100%', padding: '9px', background: busy ? '#cfcfcf' : '#37352f', color: '#fff', border: 'none', borderRadius: '6px', cursor: busy ? 'default' : 'pointer', fontSize: '13px', fontWeight: 600 }}>
            {busy ? t('抓取中…','Scraping…') : t('抓取并预览','Scrape & preview')}
          </button>
        </div>
      )}

      {/* first-class failure branches — every one actionable, never silent */}
      {branchMsg && (
        <div data-ingest-branch={branchMsg.branch || branchMsg.kind} style={{ marginTop: '10px', padding: '10px', borderRadius: '6px', background: branchMsg.kind === 'blocked' ? '#fbeaea' : '#fff7e6', border: '1px solid ' + (branchMsg.kind === 'blocked' ? '#f0c0c0' : '#ffe0a3'), fontSize: '12px', color: '#7a5b00' }}>
          <div style={{ fontWeight: 600 }}>
            {branchMsg.kind === 'blocked' ? t('链接被安全策略拦截','Link blocked by safety policy')
              : branchMsg.kind === 'expired' ? t('草稿已过期','Draft expired')
              : t('无法自动抓取该内容','Cannot auto-scrape this content')}
          </div>
          <div style={{ marginTop: '4px' }}>{branchMsg.detail}</div>
          {branchMsg.kind === 'expired' && branchMsg.preserved && (branchMsg.preserved.name || branchMsg.preserved.why_fits_user || branchMsg.preserved.location_summary) && (
            <div data-ingest-preserved="" style={{ marginTop: '6px', padding: '8px', background: '#fffdf5', border: '1px dashed #ddca8a', borderRadius: '5px', userSelect: 'text', whiteSpace: 'pre-wrap' }}>
              {branchMsg.preserved.name ? (t('名称','Name') + ': ' + branchMsg.preserved.name + '\n') : ''}
              {branchMsg.preserved.why_fits_user ? (t('为什么适合','Why it fits') + ': ' + branchMsg.preserved.why_fits_user + '\n') : ''}
              {branchMsg.preserved.location_summary ? (t('位置摘要','Location') + ': ' + branchMsg.preserved.location_summary) : ''}
            </div>
          )}
          {branchMsg.kind === 'manual_required' && branchMsg.draft_id && (
            <button data-ingest-manual="" onClick={() => {
              // Degrade honestly to a manual text candidate that still cites the URL.
              // Use the SERVER-minted manual draft_id so the manual
              // Add commits a real draft, never draft_id:null -> HTTP 400 dead-end.
              setDraft({ draft_id: branchMsg.draft_id, manual: true, canonical_url: branchMsg.canonical_url || url,
                option: { normalized: { name: '', why_fits_user: '', source_agent: isActivity ? activityCat : (slot === 'accommodation' ? 'accommodation' : 'meals'), city_context: null } },
                preview: { title: '', text: '', images: [], items: [], multi_item: false, thin: true } });
              setBranchMsg(null);
            }} style={{ marginTop: '8px', padding: '6px 10px', background: '#37352f', color: '#fff', border: 'none', borderRadius: '5px', cursor: 'pointer', fontSize: '12px' }}>
              {t('改为手动填写（仍记录链接）','Switch to manual entry (keeps the URL)')}
            </button>
          )}
          {(branchMsg.kind === 'blocked' || branchMsg.kind === 'error' || branchMsg.kind === 'expired') && (
            <button onClick={() => { setBranchMsg(null); resetDraftState(); }} style={{ marginTop: '8px', marginLeft: '6px', padding: '6px 10px', background: '#eee', color: '#37352f', border: 'none', borderRadius: '5px', cursor: 'pointer', fontSize: '12px' }}>
              {t('重试 / 换链接','Retry / new link')}
            </button>
          )}
        </div>
      )}

      {/* 小红书 list-note -> N independently-addable candidates */}
      {multi && multi.candidates && (
        <div data-ingest-multi="" style={{ marginTop: '10px' }}>
          <div style={{ fontSize: '12px', fontWeight: 600, color: '#2b4a9b', marginBottom: '6px' }}>
            {t('从这篇笔记中找到 ', 'Found ')}{multi.candidate_count}{t(' 个地点，逐个添加你想要的',' places — add the ones you want')}
          </div>
          {multi.candidates.map((c, ci) => {
            const opt = (c.option && c.option.normalized) || {};
            const st = multiAddState[c.draft_id] || 'idle';
            const added = st === 'added';
            const adding = st === 'adding';
            return (
              <div key={c.draft_id} data-ingest-candidate={c.item_id} style={{ display: 'flex', alignItems: 'flex-start', gap: '8px', padding: '8px', marginBottom: '6px', background: added ? '#eaf7ec' : '#f8f8f7', border: '1px solid ' + (added ? '#bfe6c6' : '#ebeae8'), borderRadius: '6px' }}>
                {c.preview && c.preview.images && c.preview.images[0] && (
                  <img src={c.preview.images[0].local_url} alt="" style={{ width: '40px', height: '40px', objectFit: 'cover', borderRadius: '5px', flexShrink: 0 }} />
                )}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div data-ingest-candidate-name="" style={{ fontSize: '13px', fontWeight: 600, color: '#37352f', wordBreak: 'break-word' }}>{opt.name || (t('地点','Place') + ' ' + (ci + 1))}</div>
                  {opt.location_summary && <div style={{ fontSize: '11px', color: '#9b9a97', wordBreak: 'break-word' }}>{opt.location_summary}</div>}
                  {opt.why_fits_user && <div style={{ fontSize: '11px', color: '#6b6b6b', marginTop: '2px', wordBreak: 'break-word' }}>{opt.why_fits_user}</div>}
                  {/* F8-MULTI: per-candidate city-mismatch confirm — shown ONLY when the server flagged
                      THIS candidate; mirrors the single-URL checkbox. Add is blocked until ticked. */}
                  {c.requires_city_confirm && !added && (
                    <label data-ingest-candidate-cityconfirm={c.item_id} style={{ display: 'flex', alignItems: 'center', gap: '5px', fontSize: '11px', color: '#9a6b00', marginTop: '4px', cursor: 'pointer' }}>
                      <input type="checkbox" checked={!!multiCityConfirmed[c.draft_id]} onChange={e => { const v = e.target.checked; setMultiCityConfirmed(prev => ({ ...prev, [c.draft_id]: v })); }} />

                  )}
                  {st === 'rejected' && <div style={{ fontSize: '11px', color: '#9b2c2c', marginTop: '2px' }}>{t('添加被拒绝','Add rejected')}</div>}
                </div>
                {(() => {
                  const cityBlocked = c.requires_city_confirm && !multiCityConfirmed[c.draft_id];

                  {added ? t('已添加 ✓','Added ✓') : (adding ? t('添加中…','Adding…') : t('添加','Add'))}

          })}
          <button data-ingest-multi-done="" onClick={closePanel} style={{ marginTop: '4px', padding: '7px 12px', background: '#f0efed', color: '#37352f', border: 'none', borderRadius: '6px', cursor: 'pointer', fontSize: '13px' }}>{t('完成','Done')}</button>
        </div>
      )}

      {/* preview + review/edit (M13/F3) */}
      {draft && !result && (
        <div data-ingest-preview="">
          {multiItem && (
            <div data-ingest-multiitem="" style={{ marginTop: '8px', padding: '8px', background: '#f6f8ff', border: '1px solid #d6e0ff', borderRadius: '6px' }}>

          {thinPage && !branchMsg && (
            <div style={{ marginTop: '8px', fontSize: '12px', color: '#9a6b00' }}>{t('内容较少，请补全必填字段后再添加','Sparse page — fill the required fields before adding')}</div>
          )}
          <label style={labelStyle}>{t('名称','Name')} *</label>
          <input data-ingest-field-name="" type="text" value={previewVal('name')} onChange={e => setVal('name', e.target.value)} style={fieldStyle} />
          <label style={labelStyle}>{t('为什么适合（必填）','Why it fits *')}</label>
          <textarea data-ingest-field-why="" value={String(previewVal('why_fits_user') || (draft.option && draft.option.normalized.why_fits_user) || '')} onChange={e => setVal('why_fits_user', e.target.value)} rows={2} style={{ ...fieldStyle, resize: 'vertical' }} />
          <label style={labelStyle}>{t('位置摘要','Location summary')}</label>
          <input data-ingest-field-loc="" type="text" value={previewVal('location_summary')} onChange={e => setVal('location_summary', e.target.value)} style={fieldStyle} />

          {/* image picker (M17/C1) — local cached URLs only, decline = text-only */}
          {draft.preview && draft.preview.images && draft.preview.images.length > 0 && (
            <div data-ingest-images="" style={{ marginTop: '10px' }}>
              <label style={labelStyle}>{t('封面图（可选，可不选）','Cover image (optional)')}</label>
              <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '4px' }}>
                {draft.preview.images.map(img => (
                  <img key={img.id} src={img.local_url} data-ingest-image={img.id} alt=""
                    onClick={() => setChosenImage(chosenImage === img.id ? null : img.id)}
                    style={{ width: '54px', height: '54px', objectFit: 'cover', borderRadius: '6px', cursor: 'pointer', border: chosenImage === img.id ? '3px solid #37352f' : '1px solid #e0dfdc' }} />
                ))}
                <button data-ingest-image-none="" onClick={() => setChosenImage(null)} style={{ fontSize: '11px', padding: '4px 8px', border: '1px solid #e0dfdc', borderRadius: '6px', background: chosenImage === null ? '#37352f' : '#fff', color: chosenImage === null ? '#fff' : '#37352f', cursor: 'pointer' }}>{t('不用图片','No image')}</button>
              </div>
            </div>
          )}

          {/* F8 city-mismatch confirm-or-retarget (server still derives final city_context) */}
          {draft.city_context && (
            <label data-ingest-cityconfirm="" style={{ display: 'flex', alignItems: 'center', gap: '6px', fontSize: '11px', color: '#6b6b6b', marginTop: '8px' }}>
              <input type="checkbox" checked={cityConfirmed} onChange={e => setCityConfirmed(e.target.checked)} />
              {t('确认这是','Confirm this is in')} {draft.city_context.city_name}

          <div style={{ display: 'flex', gap: '8px', marginTop: '12px' }}>
            <button data-ingest-add="" onClick={doAdd} disabled={!addEnabled} style={{ flex: 1, padding: '9px', background: addEnabled ? '#2f7a3f' : '#cfcfcf', color: '#fff', border: 'none', borderRadius: '6px', cursor: addEnabled ? 'pointer' : 'default', fontSize: '13px', fontWeight: 600 }}>
              {busy ? t('添加中…','Adding…') : t('添加进备选方案','Add to candidates')}
            </button>
            <button data-ingest-cancel="" onClick={closePanel} style={{ padding: '9px 12px', background: '#f0efed', color: '#37352f', border: 'none', borderRadius: '6px', cursor: 'pointer', fontSize: '13px' }}>{t('取消','Cancel')}</button>
          </div>
        </div>
      )}

      {/* post-Add confirmation or honest rejection */}
      {result && (
        <div data-ingest-result={result.status} style={{ marginTop: '10px', padding: '10px', borderRadius: '6px', background: result.status === 'added' ? '#eaf7ec' : '#fbeaea', border: '1px solid ' + (result.status === 'added' ? '#bfe6c6' : '#f0c0c0'), fontSize: '12px', color: result.status === 'added' ? '#1f6b32' : '#9b2c2c' }}>
          {result.status === 'added' ? (
            <div>
              <div style={{ fontWeight: 600 }}>{t('已添加进备选方案','Added to candidates')} ✓</div>
              <div style={{ marginTop: '3px' }}>{t('位置','Location')}: Day {result.where && result.where.day} · {result.where && result.where.slot}. {t('可在右侧候选项中拖拽到看板','Drag it from Candidates onto the board')}.</div>
              <button data-ingest-done="" onClick={() => { resetDraftState(); }} style={{ marginTop: '8px', padding: '6px 10px', background: '#2f7a3f', color: '#fff', border: 'none', borderRadius: '5px', cursor: 'pointer', fontSize: '12px' }}>{t('再添加一个','Add another')}</button>
            </div>
          ) : (
            <div>
              <div style={{ fontWeight: 600 }}>{t('添加被拒绝（未保存）','Add rejected (not saved)')}</div>
              <div style={{ marginTop: '3px', wordBreak: 'break-word' }}>{Array.isArray(result.detail) ? result.detail.join('; ') : String(result.detail)}</div>
              <button onClick={() => setResult(null)} style={{ marginTop: '8px', padding: '6px 10px', background: '#9b2c2c', color: '#fff', border: 'none', borderRadius: '5px', cursor: 'pointer', fontSize: '12px' }}>{t('返回修改','Back to edit')}</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
};

// ============================================================
// APP
// ============================================================
function NotionTravelApp() {
  const [selTrip, setSelTrip] = useState(0);
  const [selDay, setSelDay] = useState(0);
  const [view, setView] = useState('kanban');
  const [sbOpen, setSbOpen] = useState(false);
  const [selectedItem, setSelectedItem] = useState(null);
  const [selectedBudgetCat, setSelectedBudgetCat] = useState(null);
  // Root cause fix (commit 8f2bddd): Add language toggle for bilingual POI display
  const [lang, setLang] = useState('local');  // 'local' or 'base'
  const [mapProvider, setMapProvider] = useState('gaode');  // 'gaode' or 'google'
  // Editor state (always active — unified viewer/editor page)
  const [editorTripData, setEditorTripData] = useState(null);
  const [editorSelections, setEditorSelections] = useState({});
  // task 20260615-125613 (R2/R3/R4): ONE normalized model, TWO render modes derived each render.
  //   'preview' = read-only landing (default); 'edit' = interactive. Both render from the SAME
  //   editorDay/effectiveDay model — Preview only HIDES/DISABLES edit affordances (same single underlying model).
  //   The mode is reflected in the URL (?mode=edit) so deep links + Back/Forward honor it.
  const [mode, setMode] = useState(() => {
    if (typeof TRIP_ID === 'undefined' || !TRIP_ID) return 'preview';
    try {
      return new URLSearchParams(window.location.search).get('mode') === 'edit'
        ? 'edit' : 'preview';
    } catch (_) { return 'preview'; }
  });
  // readOnly gates every edit affordance (drag start, select/skip controls, ingest, candidate
  // sidebar interactions). Mirrored to a window flag the DnD handlers consult so Preview's board
  // is non-mutating without re-threading a prop through the entire render tree.
  const readOnly = mode === 'preview';
  useEffect(() => {
    try { window.__TRIP_PREVIEW_READONLY = readOnly; } catch (_) {}
  }, [readOnly]);
  // Reflect mode in the URL (?mode=edit) without a reload, and honor Back/Forward.
  const _syncModeToUrl = useCallback((m) => {
    try {
      const u = new URL(window.location.href);
      if (m === 'edit') u.searchParams.set('mode', 'edit');
      else u.searchParams.delete('mode');
      window.history.pushState({ mode: m }, '', u.toString());
    } catch (_) {}
  }, []);
  useEffect(() => {
    const onPop = () => {
      try {
        const m = new URLSearchParams(window.location.search).get('mode') === 'edit'
          ? 'edit' : 'preview';
        setMode(m);
      } catch (_) {}
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);
  // BUG A fix: a STABLE per-browser editor session id, persisted in localStorage so a RELOAD by
  // the SAME user reuses it. Previously a fresh random id was minted on every mount, so each
  // reload's first save mismatched meta.current_editor_session (written by the PRIOR load) ->
  // a spurious "Another session modified this plan" 409-soft banner for a single user with no
  // concurrent editor, trapping them in reload->edit->banner. A genuinely different browser/tab
  // gets its own stored id, so real concurrent-edit detection is preserved. Per-trip key so two
  // trips edited in one browser don't cross-conflict.
  const [editorSession] = useState(() => {
    const _newId = () => (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
    try {
      const _k = 'tripEditorSession:' + TRIP_ID;
      let _id = window.localStorage.getItem(_k);
      if (!_id) { _id = _newId(); window.localStorage.setItem(_k, _id); }
      return _id;
    } catch (_) {
      // localStorage unavailable (private mode / disabled) — fall back to an ephemeral id.
      return _newId();
    }
  });
  const [saveState, setSaveState] = useState('idle'); // 'idle'|'saving'|'saved'|'error'
  const [lastSaveTs, setLastSaveTs] = useState(null);
  const [isOffline, setIsOffline] = useState(() => !navigator.onLine);
  const [conflictDetected, setConflictDetected] = useState(false);
  const [isMobileLayout, setIsMobileLayout] = useState(() => window.innerWidth < 768);
  const [mobileTab, setMobileTab] = useState('kanban'); // 'kanban'|'timeline'|'candidates'
  // canShowCandidates: CandidatesSidebar visible only in edit mode with a real TRIP_ID.
  // Static exports (no TRIP_ID) and preview mode never show the candidates panel.
  const canShowCandidates = !!(typeof TRIP_ID !== 'undefined' && TRIP_ID && mode === 'edit');
  // Reset mobileTab off 'candidates' when the candidates panel becomes unavailable.
  useEffect(() => { if (!canShowCandidates) setMobileTab(t => t === 'candidates' ? 'kanban' : t); }, [canShowCandidates]);
  const [ingestOpen, setIngestOpen] = useState(false); // Cycle-3: Add-from-link panel
  const [pendingSelection, setPendingSelection] = useState(null); // {optionId, slotId, originSlotId} for tap-to-select
  const [routeCache, setRouteCache] = useState({}); // {pairKey: {status, duration_minutes}} for route gaps (AC12/AC23)
  // task 20260616-231026 (Work Item B): per-TARGET-block route choice override
  // {targetOptionId: {fromOptionId, mode}}. The auto-route default pairs prev->current
  // at ROUTE_MODE; a user-chosen origin/mode for a target block overrides which pair is
  // fetched AND rendered for that block (codex finding 4). Auto-route remains the default.
  const [routeChoice, setRouteChoice] = useState({});
  // Cycle-2: undo/redo (client-only)
  const { toastMsg: undoToastMsg, record: undoRecord } = useUndoRedo();
  const routeSeqRef = React.useRef({}); // per-pair monotonic seq for stale-response guard
  // task 20260616-231026 (AC-B5 fix): authoritative synchronous mirror of routeCache.
  // invalidateRoutePair must read a pair's PRIOR status deterministically — reading a flag
  // assigned INSIDE a setRouteCache(updater) fails because React runs the updater later, so the
  // flag is still stale when read (the read-after-setState race that left superseded route_refs
  // status:'ok' and made budget.py multi-count a leg). This ref is written synchronously by every
  // routeCache mutation (and mirrored by an effect as a safety net) so prior-status reads never race.
  const routeCacheRef = React.useRef({});
  const saveSeqRef = React.useRef(0);    // monotonic counter for saveMutations only
  const budgetSeqRef = React.useRef({}); // per-day counters for recomputeBudget
  const saveStateRef = React.useRef('idle');
  // task 20260615-125613 (R4, codex finding 2): SYNCHRONOUS in-flight save counter. saveStateRef
  // is updated by a useEffect (after render), so a just-started save may not yet read 'saving' —
  // completeEdit's flush must await THIS counter (incremented synchronously before fetch, decremented
  // in finally) so Done never returns to Preview before persistence settles.
  const inFlightSavesRef = React.useRef(0);
  const lastSaveOkRef = React.useRef(true); // false after a save that ended in error/conflict
  const lastSaveTsRef = React.useRef(null);
  // M5 (spurious single-user conflict banner): the plan VERSION this client loaded — the version it
  // is editing on top of. save_seq (monotonic per-trip counter, collision-free) is the preferred
  // signal; last_saved_ts is the timestamp fallback (iso_now has only second resolution, so two
  // saves in one second share a ts — the seq disambiguates). Sent as client_base_seq/client_base_ts
  // with each save so the server flags a REAL concurrent modification (disk version moved past this
  // baseline) instead of a mere session-token difference. Advanced to the response's save_seq/
  // saved_ts after every successful save so subsequent saves carry the up-to-date baseline.
  const loadedBaseTsRef = React.useRef(null);
  const loadedBaseSeqRef = React.useRef(null);
  const [saveStatusText, setSaveStatusText] = useState('');
  const bp = useBreakpoint();
  const sm = bp === 'sm';

  const trip = PLAN_DATA.trips[selTrip];
  const publishedDay = trip?.days?.[selDay];

  // Resolve editorDay using absolute day number from PLAN_DATA
  const editorDay = useMemo(() => {
    if (!editorTripData) return null;
    return editorTripData.days && editorTripData.days.find(
      d => Number(d.day) === Number(publishedDay && publishedDay.day)
    ) || null;
  }, [editorTripData, publishedDay]);

  // effectiveDay = the v2-derived display day (editor mode) or publishedDay (viewer).
  // Cycle 4 (R3/AC2): mergeEditorSelectionsIntoPublishedDay is gone; deriveV2DisplayDay
  // reproduces the full overlay sourced purely from the v2 editor model, exposing
  // .renderOptions[mealType] (primary + included) for the Timeline + Budget-detail reads.
  const effectiveDay = useMemo(() => {
    if (!editorDay) return publishedDay;
    return deriveV2DisplayDay({
      dayNum: publishedDay && publishedDay.day,
      editorDay, editorTripData, editorSelections, publishedDay,
    });
  }, [publishedDay, editorDay, editorSelections, editorTripData]);

  // Fetch v2 trip data for CandidatesSidebar candidates (only when TRIP_ID is set).
  // F5/AC7: hydrate routeCache from data.route_cache.entries on load so persisted route
  // renders reappear and the budget intra_city contribution survives reload (no 0-flip).
  // The cache is keyed 3-part from:to:car; entries are wrapped as {status, segment} to
  // match the live /api/route response shape the render/retry path expects.
  useEffect(() => {
    if (!TRIP_ID) return;
    fetch('/api/trip/' + encodeURIComponent(TRIP_ID))
      .then(r => r.json())
      .then(data => {
        setEditorTripData(data);
        // M5: capture the loaded plan's version (save_seq + last_saved_ts) as the conflict baseline
        // (the version this client is editing on top of). A save carrying this baseline only
        // conflicts if the disk version actually advanced past it (a real concurrent edit), never on
        // a session-token diff. save_seq may be absent on a never-saved plan -> stays null and the
        // server uses the ts/legacy fallback.
        const _baseTs = data && data.meta && data.meta.last_saved_ts;
        if (_baseTs) loadedBaseTsRef.current = _baseTs;
        const _baseSeq = data && data.meta && data.meta.save_seq;
        if (typeof _baseSeq === 'number') loadedBaseSeqRef.current = _baseSeq;
        const entries = data && data.route_cache && data.route_cache.entries;
        if (entries && typeof entries === 'object') {
          const hydrated = {};
          Object.keys(entries).forEach(k => {
            const seg = entries[k] || {};
            hydrated[k] = { status: seg.status || 'unresolved', segment: seg };
          });
          if (Object.keys(hydrated).length) {
            // AC-B5: sync the ref in the SAME path so a re-choice right after load reads the
            // hydrated prior status deterministically (not just after the [routeCache] effect).
            routeCacheRef.current = { ...hydrated, ...routeCacheRef.current };
            setRouteCache(prev => ({ ...hydrated, ...prev }));
          }
        }
        // task 20260616-231026 (AC-B8 reload durability): hydrate routeChoice from each day's
        // persisted intra_city_routes so a reload preserves the user's chosen origin+mode instead
        // of silently reverting the block to the default (prev-item / car). Only status:'ok' entries
        // are active legs; 'stale'/'unresolved' superseded refs are skipped (this is why the AC-B5
        // fix above — marking the prior ref stale — is what keeps reload from re-hydrating the OLD
        // mode). routeChoice is keyed by TARGET option_id (the route_ref's to_option_id); the 3-part
        // key is from:to:mode and option_ids in this schema carry a -<day>-<slot> infix so the target
        // id is stable/unique across days (no cross-day collision). Persisted choice is written ONLY
        // where it differs from the auto-route default (prev-located + DEFAULT_ROUTE_MODE); a default
        // leg needs no override and re-resolves automatically.
        const choiceFromDays = {};
        const days = (data && data.days) || [];
        days.forEach(d => {
          const routes = d && d.intra_city_routes;
          if (!routes || typeof routes !== 'object' || Array.isArray(routes)) return;
          Object.keys(routes).forEach(k => {
            const ref = routes[k] || {};
            if (ref.status !== 'ok') return; // only the active leg defines the current choice
            // codex finding 4: do NOT rely on a positional 3-way split (an option_id is only
            // required to be a non-empty string and could in principle contain a colon). The
            // mode is authoritatively the persisted ref.mode (a ROUTE_MODES enum token); recover
            // from:to by stripping the known trailing ':<mode>' suffix, then taking the LAST colon
            // as the from/to boundary. Falls back to the positional split only if the suffix is absent.
            const key = String(k);
            const mode = ROUTE_MODES.includes(ref.mode) ? ref.mode : (key.split(':').pop());
            if (!ROUTE_MODES.includes(mode)) return;
            const suffix = ':' + mode;
            const fromTo = key.endsWith(suffix) ? key.slice(0, -suffix.length) : key.split(':').slice(0, 2).join(':');
            const lastColon = fromTo.lastIndexOf(':');
            if (lastColon <= 0) return;
            const fromId = fromTo.slice(0, lastColon), toId = fromTo.slice(lastColon + 1);
            if (!toId || !fromId) return;
            // Last ok-entry for a target wins (there should be exactly one after the AC-B5 fix).
            choiceFromDays[toId] = { fromOptionId: fromId, mode };
          });
        });
        if (Object.keys(choiceFromDays).length) {
          // do NOT clobber an in-session choice the user just made before this fetch resolved.
          setRouteChoice(prev => ({ ...choiceFromDays, ...(prev || {}) }));
        }
      })
      .catch(() => {});
  }, [TRIP_ID]);

  // Refetch v2 trip data after an ingest Add so the new candidate
  // appears in 备选方案 and is immediately draggable (no full reload).
  const refetchTripData = useCallback(async () => {
    if (!TRIP_ID) return;
    try {
      const r = await fetch('/api/trip/' + encodeURIComponent(TRIP_ID));
      const data = await r.json();
      setEditorTripData(data);
    } catch (e) { /* leave prior data; UI surfaces the ingest result separately */ }
  }, []);

  // task 20260615-125613 (R4, codex finding 2): STRICT refetch for the Done->Preview transition.
  // Returns true only when the persisted post-save state was actually reloaded; returns false on a
  // non-ok response or a network error so completeEdit can STAY in Edit and surface the failure
  // (never show a Preview built from an unconfirmed reload).
  const refetchTripDataStrict = useCallback(async () => {
    if (!TRIP_ID) return true; // no server to reload from (static/offline export) — nothing to await
    try {
      const r = await fetch('/api/trip/' + encodeURIComponent(TRIP_ID));
      if (!r.ok) return false;
      const data = await r.json();
      setEditorTripData(data);
      return true;
    } catch (e) {
      return false;
    }
  }, []);

  // Shared selection resolver — key-presence semantics (AC10)
  const resolveSelection = useCallback((selections, key, publishedId) => {
    if (Object.prototype.hasOwnProperty.call(selections, key)) {
      return selections[key]; // null = explicitly cleared
    }
    return publishedId;
  }, []);

  // Online/offline detection (M6, M28)
  useEffect(() => {
    const goOnline = () => setIsOffline(false);
    const goOffline = () => setIsOffline(true);
    window.addEventListener('online', goOnline);
    window.addEventListener('offline', goOffline);
    return () => {
      window.removeEventListener('online', goOnline);
      window.removeEventListener('offline', goOffline);
    };
  }, []);

  // Mobile layout resize listener (M12)
  useEffect(() => {
    const h = () => setIsMobileLayout(window.innerWidth < 768);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);

  // Save status auto-refresh every 15s (M27)
  useEffect(() => {
    const interval = setInterval(() => {
      const st = saveStateRef.current;
      const ts = lastSaveTsRef.current;
      if (st === 'saved' && ts) {
        const elapsed = Math.floor((Date.now() - ts) / 1000);
        setSaveStatusText('saved ' + elapsed + 's ago');
      }
    }, 15000);
    return () => clearInterval(interval);
  }, []);

  // Keep refs in sync for setInterval stale-closure avoidance
  useEffect(() => { saveStateRef.current = saveState; }, [saveState]);
  useEffect(() => { lastSaveTsRef.current = lastSaveTs; }, [lastSaveTs]);
  // task 20260616-231026 (AC-B5): keep routeCacheRef mirroring routeCache (safety net; the
  // mutators below also write the ref synchronously so prior-status reads never race a commit).
  useEffect(() => { routeCacheRef.current = routeCache; }, [routeCache]);

  // Budget recompute helper
  const recomputeBudget = useCallback((dayNum) => {
    if (!TRIP_ID) return;
    const seq = (budgetSeqRef.current[dayNum] || 0) + 1;
    budgetSeqRef.current[dayNum] = seq;
    fetch('/api/budget/recompute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ trip_id: TRIP_ID, day: dayNum }),
    })
      .then(r => r.json())
      .then(resp => {
        if (budgetSeqRef.current[dayNum] !== seq) return; // stale
        // iter-1 currency-display fix: /api/budget/recompute sums RAW LOCAL cost and
        // returns amounts in resp.currency_local (CNY). The Donut total + per-category
        // segments render with the DISPLAY symbol (€), so convert local->display HERE with
        // the SAME rate the static viewer used, before storing for display. The SERVER
        // budget path itself stays raw-local (unchanged) — only the editor display converts.
        const budCur = resp.currency_local || 'CNY';
        const toDisp = (v) => toDisplayCurrency(v, budCur);
        const entry = resp.days && resp.days.find(d => Number(d.day) === Number(dayNum));
        if (entry && entry.day_total !== undefined) {
          // Budget total update is displayed via a separate state
          setLiveDayTotal(prev => ({ ...prev, [dayNum]: toDisp(entry.day_total) }));
        }
        // AC4/AC5: map entry.breakdown per-category values onto editorTripData.days[n].budget
        // Key mapping: breakdown.meals→budget.meals, breakdown.activities→budget.attractions,
        // breakdown.accommodation→budget.accommodation, breakdown.transportation→budget.transportation
        // UI-only keys (entertainment, shopping, cafe) are preserved unchanged.
        if (entry && entry.breakdown && setEditorTripData) {
          if (budgetSeqRef.current[dayNum] !== seq) return; // stale guard for budget merge
          const bd = entry.breakdown;
          const amt = (b) => (b && b.amount !== undefined) ? b.amount : b;
          setEditorTripData(prev => {
            if (!prev || !prev.days) return prev;
            const updated = JSON.parse(JSON.stringify(prev));
            const dayEntry = updated.days.find(d => Number(d.day) === Number(dayNum));
            if (!dayEntry) return prev;
            if (!dayEntry.budget) dayEntry.budget = {};
            if (bd.meals !== undefined) dayEntry.budget.meals = toDisp(amt(bd.meals));
            if (bd.activities !== undefined) dayEntry.budget.attractions = toDisp(amt(bd.activities));
            if (bd.accommodation !== undefined) dayEntry.budget.accommodation = toDisp(amt(bd.accommodation));
            // F6/AC7: intra_city has no first-class UI slot, so MERGE its known route cost
            // into the transportation bucket instead of discarding it. This is what keeps
            // the budget headline from flipping to 0 after a route/budget recompute — the
            // intra_city contribution survives into the displayed transportation total.
            {
              const transAmt = (bd.transportation !== undefined) ? amt(bd.transportation) : 0;
              const intraAmt = (bd.intra_city !== undefined) ? amt(bd.intra_city) : 0;
              if (bd.transportation !== undefined || bd.intra_city !== undefined) {
                dayEntry.budget.transportation = toDisp((transAmt || 0) + (intraAmt || 0));
              }
            }
            return updated;
          });
        }
      })
      .catch(() => {});
  }, []);

  const [liveDayTotal, setLiveDayTotal] = useState({});

  // fetchRoute: POST /api/route for a pair of consecutive filled slots (AC12/AC23).
  // Canonical 3-part key from:to:car. The client legacy mode 'driving' is normalized to
  // the route_cache.schema enum token 'car' so the client lookup hits the server's
  // 3-part key (the old 2-part key a:b silently missed). After the route resolves OK,
  // persist a route_ref into the day-file so membership + budget survive reload (M5).
  // saveMutations + the live day number are read through refs (set by effects below) to
  // avoid a TDZ on the later const declarations and keep fetchRoute dependency-stable.
  const ROUTE_MODE = DEFAULT_ROUTE_MODE; // default mode; per-gap chooser (Work Item B) overrides it
  // task 20260616-231026: pairKey/fetchRoute now take an explicit mode so a non-car
  // mode threads through the cache key, the POST body, AND the persisted route_ref. The
  // mode defaults to ROUTE_MODE so existing auto-route/retry callers keep working.
  const routePairKey = useCallback((a, b, mode) => a + ':' + b + ':' + (mode || ROUTE_MODE), []);
  const saveMutationsRef = React.useRef(null);
  const currentDayNumRef = React.useRef(null);
  const fetchRoute = useCallback((fromOptionId, toOptionId, pairKey, mode) => {
    if (!TRIP_ID || !fromOptionId || !toOptionId) return;
    const useMode = mode || ROUTE_MODE;
    const key = pairKey || (fromOptionId + ':' + toOptionId + ':' + useMode);
    routeSeqRef.current[key] = (routeSeqRef.current[key] || 0) + 1;
    const seq = routeSeqRef.current[key];
    fetch('/api/route', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ trip_id: TRIP_ID, from_option_id: fromOptionId, to_option_id: toOptionId, mode: useMode, request_seq: seq }),
    })
      .then(r => r.json())
      .then(data => {
        if (routeSeqRef.current[key] !== seq) return; // stale
        // Response status {ok,unknown,error}: render uses it directly; persist maps
        // unknown->unresolved (day enum has no 'unknown'). Persist a day route_ref only
        // when the route resolves OK so a known cost can join the budget.
        const seg = (data && data.segment) || {};
        routeCacheRef.current = { ...routeCacheRef.current, [key]: data }; // sync mirror (AC-B5)
        setRouteCache(prev => ({ ...prev, [key]: data }));
        if (data && data.status === 'ok' && saveMutationsRef.current && currentDayNumRef.current) {
          saveMutationsRef.current(currentDayNumRef.current, [{ type: 'route_ref', extra: {
            from_option_id: fromOptionId, to_option_id: toOptionId, mode: useMode,
            status: 'ok',
            duration_min: seg.duration_min, distance_km: seg.distance_km, cost: seg.cost,
          } }]);
        }
      })
      .catch(() => {
        // codex finding 7: guard stale FAILURES too — a superseded/invalidated request that rejects
        // must NOT write 'error' back (it could resurrect an old pair or clobber a newer success).
        if (routeSeqRef.current[key] !== seq) return;
        routeCacheRef.current = { ...routeCacheRef.current, [key]: { status: 'error' } }; // sync mirror (AC-B5)
        setRouteCache(prev => ({ ...prev, [key]: { status: 'error' } }));
      });
  }, []);

  // task 20260616-231026 (B-E5 + codex finding 6): drop a specific rendered route so a stale
  // route never renders after the user re-chooses origin/mode for a gap (extends the time/coord
  // prune at the delete/mirror path). Bumps the seq guard so an in-flight response for the old
  // key is ignored, removes the key from routeCache, AND — if that old pair had resolved OK and
  // been persisted — marks the persisted day route_ref 'stale' so the superseded leg stops
  // contributing to budget/reload (a 3-part key is from:to:mode).
  const invalidateRoutePair = useCallback((pairKey) => {
    if (!pairKey) return;
    routeSeqRef.current[pairKey] = (routeSeqRef.current[pairKey] || 0) + 1;
    // AC-B5 FIX: read the pair's PRIOR status DETERMINISTICALLY from the synchronous ref mirror —
    // NOT from a flag mutated inside the setRouteCache updater (which React runs later, after this
    // function returns, so the flag would still be stale at read time). routeCacheRef is written
    // synchronously by fetchRoute and here, and mirrored by an effect, so it always reflects the
    // committed-or-just-set cache. This is what makes the route_ref status:'stale' mutation actually
    // fire, so exactly one status:'ok' entry per block survives and budget.py never multi-counts a leg.
    const prior = routeCacheRef.current && routeCacheRef.current[pairKey];
    const wasOk = !!(prior && prior.status === 'ok');
    routeCacheRef.current = (() => {
      const next = { ...(routeCacheRef.current || {}) };
      delete next[pairKey];
      return next;
    })();
    setRouteCache(prev => {
      if (!prev || !(pairKey in prev)) return prev;
      const next = { ...prev };
      delete next[pairKey];
      return next;
    });
    const seg = pairKey.split(':');
    if (wasOk && seg.length >= 3 && saveMutationsRef.current && currentDayNumRef.current) {
      saveMutationsRef.current(currentDayNumRef.current, [{ type: 'route_ref', extra: {
        from_option_id: seg[0], to_option_id: seg[1], mode: seg[2], status: 'stale',
      } }]);
    }
  }, []);

  // saveMutations: central save helper (M5, M6, M7, M11)
  const saveMutations = useCallback(async (dayNum, mutations) => {
    // task 20260615-125613: Preview is read-only — never mutate from a non-edit mode. Edit
    // affordances are hidden in Preview, but this guard makes the contract enforceable.
    if (mode === 'preview') return;
    if (isOffline) {
      setSaveState('error');
      setSaveStatusText('offline — not saved');
      lastSaveOkRef.current = false;
      return;
    }
    // codex finding 2: track this save synchronously so completeEdit's flush awaits it.
    inFlightSavesRef.current += 1;
    lastSaveOkRef.current = true; // optimistic; flipped to false on any error/conflict branch below
    setSaveState('saving');
    setSaveStatusText('saving…');
    const seq = ++saveSeqRef.current;
    try {
      const resp = await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          trip_id: TRIP_ID,
          day: dayNum,
          editor_session: editorSession,
          // M5: the loaded-baseline version so the server flags a conflict ONLY on real divergence.
          client_base_seq: loadedBaseSeqRef.current,
          client_base_ts: loadedBaseTsRef.current,
          mutations,
        }),
      });
      if (saveSeqRef.current !== seq) return; // stale
      if (resp.status === 409) {
        setConflictDetected(true);
        setSaveState('error');
        setSaveStatusText('conflict');
        lastSaveOkRef.current = false;
        return;
      }
      const data = await resp.json();
      if (saveSeqRef.current !== seq) return; // stale after json parse
      // BUG B fix (no snap-back): a SOFT 409 (last-writer-wins) means the server STILL PERSISTED
      // this save (handle_save proceeds; the conflict flag is advisory). Surface the banner, but
      // do NOT early-return before the local-mirror block below — otherwise the just-applied edit
      // (e.g. a flight-meal retime) is never mirrored into editorTripData and the card visually
      // SNAPS BACK to its old position even though disk holds the new value. We flag the conflict,
      // skip the optimistic "saved" label, and fall through so the APPLIED mutations still mirror.
      const _conflictSoft = data.conflict === '409-soft';
      if (_conflictSoft) {
        setConflictDetected(true);
      }
      if (!resp.ok) {
        setSaveState('error');
        setSaveStatusText('error');
        lastSaveOkRef.current = false;
        return;
      }
      // M5: advance the conflict baseline to the version this save just wrote (the server bumped
      // meta.save_seq and set last_saved_ts = saved_ts), so the NEXT save carries the current
      // baseline and does not spuriously re-flag. On a genuine soft-409 the banner already fired this
      // round; adopting the new version means a subsequent single-user save (no further concurrent
      // edit) stays clean.
      if (typeof data.save_seq === 'number') loadedBaseSeqRef.current = data.save_seq;
      if (data.saved_ts) loadedBaseTsRef.current = data.saved_ts;
      // Cycle 4 (R11/#4): a v2->meals.json writeback failure means the save did NOT persist
      // (the server wrote nothing). Surface it as an error so the UI does not claim "saved".
      if (data.writeback && data.writeback.status === 'failed') {
        setSaveState('error');
        setSaveStatusText('save failed');
        lastSaveOkRef.current = false;
        return;
      }
      // AC5/AC7/AC11 (rejection-path fix): an HTTP-200 save can carry a PARTIAL failure — a
      // per-mutation result whose status is not 'applied' (e.g. a server-rejected out-of-bounds
      // time). The client MUST consult data.mutation_results and (a) NOT claim 'saved' when any
      // requested mutation was rejected, and (b) only mirror/prune locally for the mutations the
      // server actually APPLIED. Mirroring a rejected time would show an invalid value as saved
      // and prune a valid routeCache cost — the exact two QA-reproduced edge bugs.
      const _results = Array.isArray(data.mutation_results) ? data.mutation_results : [];
      const _appliedIdx = new Set(
        _results.filter(r => r && r.status === 'applied').map(r => r.index)
      );
      const _rejected = _results.filter(r => r && r.status === 'error');
      const _reqCount = (mutations || []).length;
      // FAIL-CLOSED (housekeeping #2): a mutation is applied IFF its own index has an 'applied'
      // result row — full stop. The current server appends exactly one result per mutation in
      // every loop branch, so len(results)===_reqCount for any real batch and this is purely a
      // defensive backstop. But if a FUTURE server regression ever returned HTTP-200 with an
      // empty/truncated mutation_results for a non-empty batch, the old code FAIL-OPENED here
      // (treated all indices as applied, claimed 'saved', and mirrored an unconfirmed value).
      // We now treat an unexpectedly-short/empty result list as "not applied": no per-mutation
      // 'applied' row means not applied, so the UI does NOT claim saved and does NOT mirror/prune.
      const _isApplied = (idx) => _appliedIdx.has(idx);
      // Not fully applied = any requested mutation index lacks an 'applied' result row. An empty
      // or truncated result list for a non-empty batch therefore reads as not-fully-applied.
      const _notFullyApplied = _reqCount > 0 &&
        Array.from({ length: _reqCount }, (_, i) => i).some(i => !_appliedIdx.has(i));
      const ts = Date.now();
      if (_rejected.length || _notFullyApplied) {
        // Partial failure: keep the prior valid state for the non-applied mutation, do NOT show
        // 'saved'. Surface visible inline feedback (the save-status banner turns red).
        setSaveState('error');
        // delete_option (task 20260616): surface the server's user-facing reason for a rejected
        // delete (e.g. "cannot delete the currently-selected option …") rather than a generic line.
        const _rejDel = _rejected.find(r => r && r.type === 'delete_option');
        setSaveStatusText(_rejected[0] && _rejected[0].type === 'time'
          ? 'time rejected — out of bounds'
          : (_rejDel
              ? (_rejDel.detail && _rejDel.detail[0] ? String(_rejDel.detail[0]) : 'cannot delete the selected option')
              : (_rejected.length ? 'some changes were rejected' : 'some changes were not saved')));
        lastSaveOkRef.current = false;
      } else if (_conflictSoft) {
        // BUG B: the save PERSISTED but a genuine concurrent editor also touched the plan. Show
        // the conflict status (not 'saved') yet still mirror the APPLIED mutations below so the
        // user's own edit does not snap back — the banner already warns them to reload.
        setSaveState('error');
        setSaveStatusText('conflict');
        lastSaveOkRef.current = false;
      } else {
        setSaveState('saved');
        setLastSaveTs(ts);
        setSaveStatusText('saved');
      }
      // Cycle 4 (R5/R6/#1): mirror role-aware MEAL select mutations into editorTripData so the
      // board (which renders from editorDay.slots[].options[].included) updates WITHOUT a reload.
      // Only mirror the ones the server APPLIED (AC5 rejection-path).
      const _mealMuts = (mutations || []).filter((m, i) => m.type === 'select'
        && ['breakfast', 'lunch', 'dinner'].includes(m.slot) && _isApplied(i));
      if (_mealMuts.length) {
        setEditorTripData(prev => {
          if (!prev || !prev.days) return prev;
          const updated = JSON.parse(JSON.stringify(prev));
          const dayEntry = updated.days.find(d => Number(d.day) === Number(dayNum));
          if (!dayEntry || !dayEntry.slots) return prev;
          _mealMuts.forEach(m => _applyLocalMealMutation(dayEntry, m, prev));
          return updated;
        });
      }
      // AC5/AC7/AC10/AC11: mirror an APPLIED `time` mutation locally and PRUNE stale routeCache.
      // A server-REJECTED time (status:'error', e.g. out-of-bounds) is NOT mirrored and does NOT
      // prune routeCache — the prior valid time and its route cost stay intact (no false 'saved',
      // no budget 0-flip). The server marks applied-edit day routes 'stale' + removes the
      // route_cache entry; the client must (1) optimistically set the option's v2 time so the
      // timeline repositions without a reload, and (2) drop any routeCache key referencing the
      // edited option so the stale route stops rendering and the auto-fetch effect re-resolves it.
      const _timeMuts = (mutations || []).filter((m, i) => m.type === 'time' && m.option_id && m.slot && _isApplied(i));
      if (_timeMuts.length) {
        setEditorTripData(prev => {
          if (!prev || !prev.days) return prev;
          const updated = JSON.parse(JSON.stringify(prev));
          const dayEntry = updated.days.find(d => Number(d.day) === Number(dayNum));
          if (!dayEntry || !dayEntry.slots) return prev;
          _timeMuts.forEach(m => {
            const slot = dayEntry.slots[m.slot];
            const opt = slot && (slot.options || []).find(o => o.option_id === m.option_id);
            if (opt && m.extra && m.extra.time) opt.time = m.extra.time;
          });
          return updated;
        });
        const editedIds = new Set(_timeMuts.map(m => m.option_id));
        // AC-B5: prune the ref in the SAME synchronous path as the state so a subsequent
        // invalidateRoutePair reads the pruned cache deterministically (not one effect-tick late).
        const _pruneTime = (src) => {
          const next = {};
          Object.keys(src || {}).forEach(k => {
            const pair = k.split(':').slice(0, 2);  // from:to (mode is the last token)
            if (!pair.some(id => editedIds.has(id))) next[k] = src[k];
          });
          return next;
        };
        routeCacheRef.current = _pruneTime(routeCacheRef.current);
        setRouteCache(prev => _pruneTime(prev));
      }
      // task 20260616-231026 (codex finding 5 — AC-B5): a SELECT / SKIP / DELETE in a slot changes
      // which option occupies it, so any rendered route referencing the OLD or NEW option id in that
      // slot is stale. Prune those routeCache keys (KanbanView renders the cache generically, so a
      // stale cost would otherwise linger) AND drop any per-block route choice that references the
      // affected ids — so the chooser re-resolves the default eligible pair instead of a stale one.
      const _selMuts = (mutations || []).filter((m, i) => (m.type === 'select' || m.type === 'skip' || m.type === 'delete_option') && _isApplied(i));
      if (_selMuts.length) {
        const affectedIds = new Set();
        _selMuts.forEach(m => {
          if (m.option_id) affectedIds.add(m.option_id);
          // a `select` replaces the slot's previously-selected option — that prior id's routes are also stale.
          if (m.type === 'select' && m.slot) {
            const key = Number(dayNum) + ':' + m.slot;
            const prevSel = Object.prototype.hasOwnProperty.call(editorSelections, key)
              ? editorSelections[key]
              : (editorDay && editorDay.slots && editorDay.slots[m.slot] && editorDay.slots[m.slot].selected_option_id);
            if (prevSel) affectedIds.add(prevSel);
          }
        });
        if (affectedIds.size) {
          // AC-B5: prune the ref in the SAME synchronous path as the state (see time-prune above).
          const _pruneSel = (src) => {
            const next = {};
            Object.keys(src || {}).forEach(k => {
              const pair = k.split(':').slice(0, 2);
              if (!pair.some(id => affectedIds.has(id))) next[k] = src[k];
            });
            return next;
          };
          routeCacheRef.current = _pruneSel(routeCacheRef.current);
          setRouteCache(prev => _pruneSel(prev));
          setRouteChoice(prev => {
            if (!prev) return prev;
            let changed = false;
            const next = {};
            Object.keys(prev).forEach(tId => {
              const c = prev[tId];
              if (affectedIds.has(tId) || (c && affectedIds.has(c.fromOptionId))) { changed = true; return; }
              next[tId] = c;
            });
            return changed ? next : prev;
          });
        }
      }
      // AC8: update editorTripData.days[n].stage after a successful stage mutation so editorDay
      // doesn't stay stale. FAIL-CLOSED (housekeeping #2): mirror ONLY an APPLIED stage mutation,
      // matching the meal/time gating above — a rejected or not-confirmed stage must not mirror.
      const _stageMutIdx = (mutations || []).findIndex(m => m.type === 'stage');
      if (_stageMutIdx >= 0 && _isApplied(_stageMutIdx)) {
        const stageMut = mutations[_stageMutIdx];
        const stageVal = stageMut && (stageMut.to_stage != null ? stageMut.to_stage : stageMut.value);
        if (stageVal) setEditorTripData(prev => {
          if (!prev || !prev.days) return prev;
          return { ...prev, days: prev.days.map(d => Number(d.day) === Number(dayNum) ? { ...d, stage: stageVal } : d) };
        });
      }
      // delete_option (task 20260616): mirror an APPLIED delete by pruning the option from the
      // local editorTripData slot so the candidate/board card disappears without a reload. Only
      // APPLIED deletes mirror (a server-rejected delete — e.g. the selected-option guard — leaves
      // the option in place); the slot's selected_option_id is never the deleted id (the server
      // rejects that), so no dangling selection results.
      const _delMuts = (mutations || []).filter((m, i) => m.type === 'delete_option' && m.slot && m.option_id && _isApplied(i));
      if (_delMuts.length) {
        setEditorTripData(prev => {
          if (!prev || !prev.days) return prev;
          const updated = JSON.parse(JSON.stringify(prev));
          const dayEntry = updated.days.find(d => Number(d.day) === Number(dayNum));
          if (!dayEntry) return prev;
          _delMuts.forEach(m => {
            const slot = m.slot === 'accommodation' ? dayEntry.accommodation : (dayEntry.slots && dayEntry.slots[m.slot]);
            if (slot && Array.isArray(slot.options)) {
              slot.options = slot.options.filter(o => o.option_id !== m.option_id);
            }
          });
          return updated;
        });
      }
      // Post-save budget recompute (M10, M25)
      recomputeBudget(dayNum);
    } catch (_) {
      if (saveSeqRef.current !== seq) return;
      setSaveState('error');
      setSaveStatusText('error');
      lastSaveOkRef.current = false;
    } finally {
      // codex finding 2: synchronous in-flight bookkeeping so completeEdit can await durability.
      inFlightSavesRef.current = Math.max(0, inFlightSavesRef.current - 1);
    }
  }, [isOffline, editorSession, recomputeBudget, mode]);

  // task 20260615-125613 (R3): Preview -> Edit. Enable edit affordances + reflect in the URL.
  const enterEdit = useCallback(() => {
    setMode('edit');
    _syncModeToUrl('edit');
  }, [_syncModeToUrl]);

  // task 20260615-125613 (R4): Edit -> Done -> (flush pending autosave + await persistence +
  // surface 409/error) -> Preview rendered from the PERSISTED post-save state. We await any
  // in-flight save (saveState transitions out of 'saving'), and only return to Preview when the
  // save did NOT end in error/conflict; on a surfaced error we STAY in Edit so the user can retry
  // (Edit never silently switches to Preview without flush/error — AC5/AC7).
  const [completingEdit, setCompletingEdit] = useState(false);
  const completeEdit = useCallback(async () => {
    setCompletingEdit(true);
    try {
      // 1) Flush: await every in-flight save to settle. We poll the SYNCHRONOUS in-flight counter
      //    (incremented before fetch, decremented in finally) — NOT saveStateRef, which lags a
      //    render behind and could read 'idle' for a just-started save (codex finding 2). Also
      //    drain saveStateRef==='saving' as a belt-and-suspenders for any non-counted path.
      const _deadline = Date.now() + 8000;
      while ((inFlightSavesRef.current > 0 || saveStateRef.current === 'saving')
             && Date.now() < _deadline) {
        await new Promise(r => setTimeout(r, 50));
      }
      // 2) If any in-flight save did not drain, or the last settled save ended in error/conflict,
      //    do NOT switch to Preview — surface + STAY in Edit so the user can retry (AC5/AC7:
      //    Edit never silently switches to Preview without flush/error).
      if (inFlightSavesRef.current > 0 || lastSaveOkRef.current === false
          || saveStateRef.current === 'error') {
        setSaveStatusText('保存未完成，已留在编辑模式 / save unfinished — staying in Edit');
        return;
      }
      // 3) Re-load the PERSISTED post-save state so Preview renders from disk, not stale memory.
      //    STRICT: if the reload fails, STAY in Edit and surface — never show a Preview built from
      //    an unconfirmed reload (codex finding 2: refetchTripData swallowed errors).
      const ok = await refetchTripDataStrict();
      if (!ok) {
        setSaveStatusText('刷新失败，已留在编辑模式 / reload failed — staying in Edit');
        return;
      }
      // 4) Return to Preview.
      setMode('preview');
      _syncModeToUrl('preview');
    } finally {
      setCompletingEdit(false);
    }
  }, [refetchTripDataStrict, _syncModeToUrl]);

  // setEditorSelection bridge (also used internally)
  const setEditorSelection = useCallback((slotId, optionId, dayNum, originSlotId) => {
    // task 20260615-125613 (codex finding 1): no local selection mutation in read-only Preview.
    if (mode === 'preview') return;
    const key = (dayNum || (publishedDay && publishedDay.day)) + ':' + slotId;
    setEditorSelections(prev => ({ ...prev, [key]: optionId }));
  }, [publishedDay, mode]);

  // Expose legacy bridge for compatibility (deps: publishedDay.day, saveMutations)
  useEffect(() => {
    // Bug3 fix (commit 14f72e30): when accommodation selection changes, push the previously-selected
    // PLAN hotel back into editorDay.accommodation.options[] so it reappears in the Candidates panel.
    // The PLAN hotel is absent from options[] because options[] only contains v2 API candidates.
    const preserveCurrentAccommodationOption = () => {
      if (!editorDay || !editorDay.accommodation) return;
