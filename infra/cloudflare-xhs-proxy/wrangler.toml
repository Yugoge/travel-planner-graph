name = "xhs-proxy"
main = "src/worker.js"
compatibility_date = "2024-09-25"

# Custom domain — configure in Cloudflare Dashboard after first deploy:
#   Workers & Pages > xhs-proxy > Settings > Triggers > Custom Domains
#   Add: xhs.life-ai.app
# Alternatively use a workers.dev subdomain (enabled by default).

routes = [
  { pattern = "xhs.life-ai.app/*", zone_name = "life-ai.app" }
]

[vars]
# Target origin
XHS_ORIGIN = "https://www.xiaohongshu.com"
# Shared secret — set a real value via `wrangler secret put AUTH_SECRET`
# AUTH_SECRET is read from encrypted secrets, not from here

# Optional: restrict to your server IP for extra safety
# ALLOWED_IPS = "YOUR_SERVER_IP"
