<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
  <title>Trip Planner</title>
  <link rel="stylesheet" href="/web/css/main.css">
</head>
<body>
  <header class="app-header" role="banner">
    <nav class="breadcrumb" aria-label="breadcrumb">
      <a href="/" class="nav-back" aria-label="Back to Travel Plans">&#8592; Travel Plans</a>
    </nav>
    <h1 class="app-title" id="trip-title">Trip Planner</h1>
    <div class="header-status">
      <span id="save-status" class="save-status" aria-live="polite">saved</span>
      <span id="conn-status" class="conn-status" data-state="online">online</span>
    </div>
    <div class="header-actions">
      <button type="button" id="export-pdf" class="btn btn-secondary" disabled>Export PDF</button>
      <button type="button" id="export-ical" class="btn btn-secondary" disabled>Export iCal</button>
    </div>
  </header>

  <div id="banner-conflict" class="banner banner-warn" hidden role="alert">
    Another tab edited this trip — refresh to see latest.
    <button type="button" class="banner-close" data-banner="banner-conflict" aria-label="dismiss">x</button>
  </div>

  <div id="banner-offline" class="banner banner-error" hidden role="alert">
    Offline — changes paused. Reconnect to resume editing.
  </div>

  <nav id="mobile-tabs" class="mobile-tabs" aria-label="Mobile view tabs" hidden>
    <button type="button" class="tab" data-pane="candidates" aria-pressed="true">Candidates</button>
    <button type="button" class="tab" data-pane="timeline" aria-pressed="false">Timeline</button>
    <button type="button" class="tab" data-pane="budget" aria-pressed="false">Budget</button>
  </nav>

  <main class="app-grid">
    <!-- LEFT: Candidates panel -->
    <section id="pane-candidates" class="pane pane-candidates" aria-label="Candidates panel">
      <header class="pane-header">
        <h2 class="pane-title">Candidates</h2>
        <div class="day-picker">
          <label for="day-select">Day:</label>
          <select id="day-select" aria-label="select active day"></select>
        </div>
      </header>
      <div id="candidates-groups" class="candidates-groups" role="list">
        <!-- Populated by state.js render -->
      </div>
    </section>

    <!-- CENTER: Timeline column -->
    <section id="pane-timeline" class="pane pane-timeline" aria-label="Timeline column">
      <header class="pane-header">
        <h2 class="pane-title">Day timeline</h2>
        <button type="button" id="approve-day-btn" class="btn btn-primary" disabled>
          Approve day selections &amp; build timeline
        </button>
      </header>
      <div id="timeline-slots" class="timeline-slots">
        <!-- Populated by state.js render -->
      </div>
    </section>

    <!-- RIGHT: Budget panel -->
    <aside id="pane-budget" class="pane pane-budget" aria-label="Budget panel">
      <header class="pane-header">
        <h2 class="pane-title">Budget</h2>
      </header>
      <div class="budget-totals">
        <div class="budget-row">
          <span class="budget-label">Trip total</span>
          <span id="budget-trip-total" class="budget-value">--</span>
        </div>
        <div class="budget-row budget-row-day">
          <span class="budget-label">Day total</span>
          <span id="budget-day-total" class="budget-value">--</span>
        </div>
      </div>
      <div id="budget-breakdown" class="budget-breakdown">
        <!-- Populated by budget.js render -->
      </div>
    </aside>
  </main>

  <template id="tpl-candidate-card">
    <article class="card card-candidate" role="listitem" tabindex="0">
      <div class="card-head">
        <h3 class="card-name"></h3>
        <span class="card-cost"></span>
      </div>
      <div class="card-meta">
        <span class="card-location"></span>
      </div>
      <p class="card-why"></p>
      <p class="card-source"></p>
      <p class="card-rationale" hidden></p>
      <div class="card-actions">
        <button type="button" class="btn btn-tap" data-action="tap-select" hidden>Select</button>
      </div>
    </article>
  </template>

  <template id="tpl-slot">
    <section class="slot" data-slot-id="">
      <header class="slot-header">
        <h3 class="slot-title"></h3>
        <span class="slot-status"></span>
      </header>
      <div class="slot-body">
        <div class="slot-drop" data-droppable="true" tabindex="0">
          <p class="slot-empty">Drop a candidate here</p>
          <div class="slot-selected" hidden></div>
        </div>
        <div class="slot-route-gap" hidden>
          <span class="route-text"></span>
          <button type="button" class="route-retry btn btn-tiny" hidden>retry</button>
        </div>
        <p class="slot-error" role="alert" hidden></p>
      </div>
    </section>
  </template>

  <script type="module" src="/web/js/state.js"></script>
</body>
</html>
